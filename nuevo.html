<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SICOM · Prototipo v6 · ingresos, tesorería y reportes</title>
<link rel="icon" href="data:,">
<style>
:root{
  --oro:#c8a24a; --oro-cl:#e0c37e; --oro-os:#9c7c2e;
  --crema:#f7f2e7; --crema-2:#efe6d3; --marron:#4a3826; --marron-2:#6b533a;
  --page:#faf7f0; --panel:#ffffff; --sup:#f5f0e4; --sup2:#ebe3d2;
  --ink:#2c2118; --ink2:#6b5c4c; --muted:#9a8b79;
  --linea:#e2d8c4; --hair:#efe8db;
  --ok:#2f8f5b; --ok-bg:#e6f4ec; --ok-ink:#1f6b42;
  --mal:#c1442f; --mal-bg:#fbeae6; --mal-ink:#9e3524;
  --avi:#b7791f; --avi-bg:#fdf3e0;
  --acc:#5b6ea8; --acc-bg:#eef1f9; --acc-ink:#3d4d80;
  --r1:9px; --r2:14px; --r3:20px;
  --sh1:0 1px 2px rgba(74,56,38,.06);
  --sh2:0 4px 14px rgba(74,56,38,.10);
  --sh3:0 14px 40px rgba(74,56,38,.16);
  --ring:0 0 0 3px rgba(200,162,74,.28);
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);
  font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;letter-spacing:-.015em}
button{font:inherit}
.top{background:linear-gradient(135deg,var(--marron) 0%,#2f2318 100%);color:#fff}
.topin{max-width:1240px;margin:0 auto;padding:15px 22px;display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.mono{width:42px;height:42px;border-radius:12px;background:linear-gradient(140deg,var(--oro-cl),var(--oro-os));
  display:grid;place-items:center;font-weight:800;font-size:21px;color:#3a2c1c;box-shadow:0 4px 14px rgba(200,162,74,.4);flex:0 0 auto}
.marca b{display:block;font-size:15px}
.marca span{display:block;font-size:11px;color:var(--oro-cl);letter-spacing:.09em;text-transform:uppercase;margin-top:1px}
.marcaproto{display:inline-block;background:rgba(255,255,255,.14);color:var(--oro-cl);font-size:9.5px;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:999px;border:1px solid rgba(224,195,126,.3)}
.tabs{margin-left:auto;display:flex;gap:4px;background:rgba(255,255,255,.08);padding:4px;border-radius:999px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;color:rgba(255,255,255,.72);padding:7px 13px;border-radius:999px;
  font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap;position:relative}
.tabs button:hover{color:#fff}
.tabs button.on{background:var(--oro);color:#33261a}
.tabs button .pip{display:inline-block;background:var(--mal);color:#fff;border-radius:999px;min-width:17px;height:17px;
  font-size:10.5px;font-weight:800;margin-left:5px;padding:0 4px;line-height:17px;vertical-align:1px}
.tabs button.on .pip{background:#33261a;color:var(--oro-cl)}
.cinta{background:rgba(0,0,0,.22);border-top:1px solid rgba(255,255,255,.07)}
.cintain{max-width:1240px;margin:0 auto;padding:8px 22px;display:flex;gap:18px;flex-wrap:wrap;align-items:center;
  font-size:12.5px;color:rgba(255,255,255,.78)}
.cintain b{color:#fff;font-variant-numeric:tabular-nums}
.cintain .pt{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px}
.cintain .pt.avi{background:var(--avi)}
.cintain select{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;
  padding:3px 8px;border-radius:999px;font-size:12.5px;width:auto;font-weight:600}
.cintain select option{color:#2c2118}
.wrap{max-width:1240px;margin:0 auto;padding:26px 22px 96px}
.sub{color:var(--ink2);margin:7px 0 22px;font-size:14.5px;max-width:78ch}
.card{background:var(--panel);border:1px solid var(--linea);border-radius:var(--r3);padding:22px;box-shadow:var(--sh1)}
.card+.card{margin-top:18px}
.card h2{font-size:16.5px;margin-bottom:4px}
.card .cap{font-size:13px;color:var(--muted);margin:0 0 16px}
.g2{display:grid;grid-template-columns:1fr 380px;gap:18px;align-items:start}
.g2b{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media(max-width:900px){.g2,.g2b{grid-template-columns:1fr}}
.peg{position:sticky;top:16px}
label.f{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--linea);border-radius:var(--r1);
  font:inherit;background:var(--panel);color:var(--ink);transition:.14s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--oro);box-shadow:var(--ring)}
input.mal,select.mal{border-color:var(--mal);background:#fffbfa}
input.bien{border-color:var(--ok)}
textarea{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.7;resize:vertical}
.fila{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.tel{display:grid;grid-template-columns:110px 1fr;gap:8px}
.ayuda{font-size:12.5px;color:var(--muted);margin-top:5px}
.err{font-size:12.5px;color:var(--mal-ink);margin-top:5px;font-weight:600}
.oki{font-size:12.5px;color:var(--ok-ink);margin-top:5px;font-weight:600}
.b{border:0;background:var(--marron);color:#fff;padding:11px 20px;border-radius:var(--r1);font-weight:650;font-size:14px;
  cursor:pointer;box-shadow:var(--sh1);transition:.14s}
.b:hover:not(:disabled){background:#33261a;box-shadow:var(--sh2)}
.b.oro{background:var(--oro);color:#33261a}
.b.oro:hover:not(:disabled){background:var(--oro-os);color:#fff}
.b.gh{background:transparent;color:var(--marron);border:1px solid var(--linea);box-shadow:none}
.b.gh:hover:not(:disabled){background:var(--sup);border-color:var(--oro)}
.b.sm{padding:7px 13px;font-size:13px}
.b.mini{padding:4px 10px;font-size:12px}
.b:disabled,.b.oro:disabled,.b.gh:disabled{background:var(--sup2);color:var(--muted);
  border:1px dashed var(--linea);cursor:not-allowed;box-shadow:none}
.acc{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
table.dat{width:100%;border-collapse:collapse;font-size:14px}
table.dat th{text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  font-weight:700;padding:9px 10px;border-bottom:1px solid var(--linea);background:var(--sup)}
table.dat td{padding:11px 10px;border-bottom:1px solid var(--hair);vertical-align:middle}
table.dat tr:last-child td{border-bottom:0}
table.dat .n{text-align:right;font-variant-numeric:tabular-nums}
.mini{font-size:12.5px;color:var(--muted)}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--sup2);color:var(--ink2)}
.chip.ok{background:var(--ok-bg);color:var(--ok-ink)}
.chip.mal{background:var(--mal-bg);color:var(--mal-ink)}
.chip.avi{background:var(--avi-bg);color:var(--avi)}
.chip.acc{background:var(--acc-bg);color:var(--acc-ink)}
.vacio{text-align:center;padding:34px 18px;color:var(--muted)}
.vacio .vi{font-size:30px;opacity:.4;margin-bottom:8px}
.nota{background:var(--sup);border-left:3px solid var(--oro);border-radius:0 var(--r1) var(--r1) 0;
  padding:13px 16px;font-size:13.5px;color:var(--ink2);margin:16px 0 0}
.nota b{color:var(--ink)}
.nota.az{border-left-color:var(--acc);background:var(--acc-bg)}
.nota.rj{border-left-color:var(--mal);background:var(--mal-bg)}
.riel{display:flex;margin:0 0 22px;background:var(--panel);border:1px solid var(--linea);
  border-radius:999px;padding:6px;box-shadow:var(--sh1);overflow-x:auto}
.riel .p{flex:1 1 0;min-width:84px;display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:999px;
  white-space:nowrap;color:var(--muted);font-size:12.5px;font-weight:600;transition:.16s;border:0;background:transparent;cursor:default}
.riel .p .n{width:21px;height:21px;border-radius:50%;background:var(--sup2);color:var(--muted);
  display:grid;place-items:center;font-size:11px;font-weight:800;flex:0 0 auto}
.riel .p.ya{color:var(--ink2);cursor:pointer}
.riel .p.ya .n{background:var(--ok);color:#fff}
.riel .p.ya:hover{background:var(--sup)}
.riel .p.on{background:var(--marron);color:#fff}
.riel .p.on .n{background:var(--oro);color:#33261a}
.riel .p.vue.on{background:var(--oro);color:#33261a}
.riel .p.vue.on .n{background:#33261a;color:var(--oro-cl)}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:2px;background:var(--linea);
  border:1px solid var(--linea);border-radius:var(--r3);overflow:hidden}
.hero .h{background:var(--panel);padding:20px 22px}
.hero .h.dest{background:linear-gradient(150deg,#fffdf7,var(--crema))}
.hero .k{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hero .v{display:block;font-size:30px;font-weight:800;letter-spacing:-.025em;font-variant-numeric:tabular-nums;margin-top:5px;line-height:1.1}
.hero .v small{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:0}
.hero .s{display:block;font-size:12.5px;color:var(--muted);margin-top:4px}
.mets{display:grid;grid-template-columns:repeat(auto-fit,minmax(98px,1fr));gap:9px}
.met{border:1px solid var(--linea);border-radius:var(--r2);padding:12px 10px;background:var(--panel);cursor:pointer;
  text-align:center;transition:.14s;box-shadow:var(--sh1);color:var(--ink)}
.met:hover{border-color:var(--oro)}
.met.on{border-color:var(--oro);background:linear-gradient(160deg,#fffdf7,var(--crema));box-shadow:var(--ring),var(--sh2)}
.met .ic{font-size:20px;line-height:1;display:block;margin-bottom:6px}
.met b{display:block;font-size:13px;line-height:1.25}
.met span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.opcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.opc{border:1px solid var(--linea);border-radius:var(--r2);padding:13px 15px;background:var(--panel);cursor:pointer;
  text-align:left;transition:.14s;box-shadow:var(--sh1);color:var(--ink)}
.opc:hover{border-color:var(--oro)}
.opc.on{border-color:var(--oro);background:linear-gradient(160deg,#fffdf7,var(--crema));box-shadow:var(--ring),var(--sh2)}
.opc b{display:block;font-size:14px}
.opc span{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.fuente{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fuente button{border:1px solid var(--linea);border-radius:var(--r2);padding:13px 15px;background:var(--panel);
  cursor:pointer;text-align:left;transition:.14s;color:var(--ink)}
.fuente button:hover{border-color:var(--acc)}
.fuente button.on{border-color:var(--acc);background:var(--acc-bg);box-shadow:0 0 0 3px rgba(91,110,168,.18)}
.fuente button b{display:block;font-size:13.5px}
.fuente button span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35}
@media(max-width:520px){.fuente{grid-template-columns:1fr}}
.visor{background:linear-gradient(150deg,#332619,#1e160e);border-radius:var(--r2);padding:16px 20px;color:#fff;margin-top:16px}
.visor .vk{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--oro-cl);font-weight:700}
.visor .vrow{display:flex;align-items:baseline;gap:10px;margin-top:4px}
.visor .vu{font-size:17px;font-weight:700;color:var(--oro-cl);flex:0 0 auto}
.visor input.vin{flex:1;min-width:0;background:transparent;border:0;border-bottom:2px solid rgba(224,195,126,.35);
  border-radius:0;padding:0 0 4px;color:#fff;font-size:36px;font-weight:800;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;line-height:1.15}
.visor input.vin:focus{outline:0;border-bottom-color:var(--oro);box-shadow:none}
.visor input.vin::placeholder{color:rgba(255,255,255,.24)}
.visor .veq{font-size:13px;color:rgba(255,255,255,.62);margin-top:7px;font-variant-numeric:tabular-nums;min-height:18px}
.visor .vn{font-size:36px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:4px}
.rapidos{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.rapidos button{border:1px solid var(--linea);background:var(--panel);border-radius:999px;padding:8px 15px;
  font-size:13.5px;font-weight:700;cursor:pointer;color:var(--ink);font-variant-numeric:tabular-nums;transition:.14s;box-shadow:var(--sh1)}
.rapidos button:hover{border-color:var(--oro);background:var(--sup)}
.rapidos button.ex{background:var(--marron);color:#fff;border-color:var(--marron)}
.estado{border-radius:var(--r2);padding:18px 20px;margin-top:16px;text-align:center}
.estado .et{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:800;opacity:.85}
.estado .mt{display:block;font-size:32px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:4px}
.estado .sb{display:block;font-size:13px;margin-top:3px;opacity:.8;font-variant-numeric:tabular-nums}
.estado.falta{background:var(--mal-bg);color:var(--mal-ink)}
.estado.vuelto{background:linear-gradient(150deg,#fffdf7,var(--crema-2));color:var(--marron);border:1px solid var(--oro-cl)}
.estado.cuadra{background:var(--ok-bg);color:var(--ok-ink)}
.estado.pend{background:var(--avi-bg);color:var(--avi)}
.lineas{margin-top:14px}
.lin{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--linea);
  border-radius:var(--r1);background:var(--sup);margin-bottom:8px}
.lin .li{flex:1;min-width:0}
.lin b{font-size:13.5px}
.lin .lm{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14.5px}
.lin .x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:18px;padding:0 4px;line-height:1}
.lin .x:hover{color:var(--mal)}
.lin .x.ed{font-size:15px}
.lin .x.ed:hover{color:var(--oro-os)}
.card.editando{border-color:var(--oro);box-shadow:var(--ring),var(--sh2)}
.vhero{background:linear-gradient(150deg,var(--oro-cl),var(--oro));border-radius:var(--r3);padding:24px;color:#33261a;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:20px;box-shadow:var(--sh2)}
.vhero .k{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:800;opacity:.7}
.vhero .v{display:block;font-size:34px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.05;margin-top:4px}
.vhero .s{display:block;font-size:12.5px;opacity:.75;margin-top:3px}
.billetes{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.billetes span{background:rgba(51,38,26,.12);border-radius:7px;padding:4px 10px;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.cats{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.cats button{border:1px solid var(--linea);background:var(--panel);border-radius:999px;padding:7px 14px;font-size:13px;
  font-weight:600;cursor:pointer;color:var(--ink2);transition:.14s}
.cats button.on{background:var(--marron);color:#fff;border-color:var(--marron)}
.prod{display:flex;gap:13px;padding:13px;border:1px solid var(--linea);border-radius:var(--r2);
  background:var(--panel);margin-bottom:10px;align-items:flex-start;flex-wrap:wrap;transition:.14s}
.prod:hover{border-color:var(--oro-cl)}
.foto{width:52px;height:52px;border-radius:11px;background:linear-gradient(150deg,var(--crema),var(--crema-2));
  display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.prod .pi{flex:1;min-width:140px}
.prod .pi b{font-size:14.5px}
.prod .pp{text-align:right;white-space:nowrap}
.prod .pp b{font-size:15.5px;font-variant-numeric:tabular-nums}
.tallas{display:flex;gap:6px;flex-wrap:wrap;flex:1 0 100%;margin-top:4px}
.tallas button{position:relative;min-width:52px;padding:8px 10px 6px;border:1px solid var(--linea);border-radius:var(--r1);
  background:var(--panel);font-size:13.5px;font-weight:800;cursor:pointer;color:var(--ink);transition:.14s}
.tallas button.on{background:var(--marron);color:#fff;border-color:var(--marron)}
.tallas button i{display:block;font-style:normal;font-size:10.5px;font-weight:600;color:var(--muted);margin-top:1px}
.tallas button.on i{color:var(--oro-cl)}
.tallas button u{position:absolute;top:-6px;right:-6px;background:var(--oro);color:#33261a;border-radius:999px;
  min-width:18px;height:18px;font-size:11px;font-weight:800;display:grid;place-items:center;text-decoration:none}
.tallas button:disabled{opacity:.35;cursor:not-allowed}
.hallado{border:1px solid var(--ok);background:var(--ok-bg);border-radius:var(--r2);padding:15px 17px;margin-top:15px;
  display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.hallado .av{width:44px;height:44px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;
  font-weight:800;font-size:17px;flex:0 0 auto}
.hallado b{color:var(--ok-ink)}
.nuevoc{border:1px dashed var(--linea);border-radius:var(--r2);padding:16px 17px;margin-top:15px;background:var(--sup)}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;cursor:pointer}
.check input{width:18px;height:18px;flex:0 0 auto;margin-top:2px;accent-color:var(--oro)}
.check span{font-size:13.5px;color:var(--ink2);line-height:1.45}
.segm{display:flex;gap:8px;flex-wrap:wrap}
.segm .sg{display:flex;align-items:center;gap:8px;border:1px solid var(--linea);background:var(--panel);
  border-radius:999px;padding:9px 16px 9px 10px;font-size:13.5px;font-weight:600;color:var(--ink2);cursor:pointer;transition:.14s}
.segm .sg:hover{border-color:var(--oro)}
.segm .sg .tick{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--linea);display:grid;place-items:center;
  font-size:11px;font-weight:800;color:transparent;background:var(--panel);flex:0 0 auto;transition:.14s}
.segm .sg.on{border-color:var(--oro);background:linear-gradient(160deg,#fffdf7,var(--crema));color:var(--ink);box-shadow:var(--ring)}
.segm .sg.on .tick{background:var(--oro);border-color:var(--oro);color:#33261a}
.mail{border:1px solid var(--linea);border-radius:var(--r2);overflow:hidden;background:#fff}
.mailhd{background:var(--sup);padding:13px 17px;border-bottom:1px solid var(--linea);font-size:13px}
.mailhd div{display:flex;gap:8px;padding:1px 0}
.mailhd .mk{color:var(--muted);min-width:56px;font-weight:600}
.mailbd{padding:24px 26px;font-size:14px;line-height:1.65;color:#2c2118}
.mailbd .logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(140deg,var(--oro-cl),var(--oro-os));
  display:grid;place-items:center;font-weight:800;font-size:28px;color:#3a2c1c;margin:0 auto 12px}
.mailbd h3{font-size:19px;text-align:center;margin-bottom:4px}
.mailbd .lead{text-align:center;color:var(--ink2);font-size:13.5px;margin:0 0 20px}
.mailbd .bloque{background:var(--sup);border-radius:var(--r2);padding:16px 18px;margin:16px 0}
.mailbd .bloque h4{margin:0 0 10px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.mailbd table{width:100%;border-collapse:collapse;font-size:13.5px}
.mailbd table td{padding:6px 0;border-bottom:1px solid var(--hair)}
.mailbd table tr:last-child td{border-bottom:0}
.mailbd .tt{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px;margin-top:4px}
.cat .ci{border:1px solid var(--linea);border-radius:var(--r2);padding:12px;text-align:center;background:#fff}
.cat .ci .ce{font-size:26px}
.cat .ci b{display:block;font-size:12.5px;margin-top:6px;line-height:1.3}

  s=(s||'').trim();

  const at=s.split('@');

  const [u,d]=at;
  if(!u) return {ok:false,msg:'Falta lo que va antes de la arroba.'};

  if(u.startsWith('.')||u.endsWith('.')||u.includes('..')) return {ok:false,msg:'Los puntos están mal colocados.'};
  if(!d.includes('.')) return {ok:false,msg:'Al dominio le falta el punto: escriba .com, .net, .ve…'};
  if(d.startsWith('.')||d.endsWith('.')||d.includes('..')) return {ok:false,msg:'El dominio tiene puntos mal colocados.'};
  if(!/^[A-Za-z0-9.-]+$/.test(d)) return {ok:false,msg:'El dominio tiene caracteres que no van.'};
  const tld=d.split('.').pop();
  if(!/^[A-Za-z]{2,}$/.test(tld)) return {ok:false,msg:'La terminación del dominio no es válida.'};

}

let TAB='caja', SUB='dia', PREV=null, MTXT='', MFILE='', CSUB='vend', PSEL=null, TSUB='vueltos', RSUB='dia', CIERRE=null;
let VTA=null;
function nuevaVenta(){
  VTA={paso:'cliente',doc:'',cli:null,
       nuevo:{nom:'',ape:'',gen:'X',op:'',tel:'',mail:'',mkt:true},buscado:false,
       canal:null,vendedorId:'sin',entrega:'oficina',zonaId:null,repId:null,
       q:'',cat:'Todas',lineas:[],
       cobros:[],met:'efec_usd',buf:'',ref:'',banco:'',fuente:'empresa',print:null,editC:null,
       vueltos:[],vmet:'efec_usd',vbuf:'',vref:'',vbanco:'',vfuente:'empresa',vprint:null,editV:null,
       hecha:null,correoEnviado:false};
}
nuevaVenta();
function totalArts(){return VTA.lineas.reduce((a,l)=>a+l.precio*l.cant,0);}
function montoDeliv(){if(VTA.entrega!=='delivery'||!VTA.zonaId)return 0;
  const z=DB.cfg.zonas.find(x=>x.id===VTA.zonaId);return z?z.usd:0;}
function totalVenta(){return Math.round((totalArts()+montoDeliv())*100)/100;}
function pagoRep(){const r=DB.cfg.repartidores.find(x=>x.id===VTA.repId);
  return r?Math.round(montoDeliv()*r.pct)/100:0;}
function pagadoUSD(){const t=tasaVigente();
  return VTA.cobros.reduce((a,c)=>a+(c.mon==='BS'?c.monto/(t?t.bcv:1):c.monto),0);}
function faltaUSD(){return Math.round((totalVenta()-pagadoUSD())*100)/100;}
function vueltoTotal(){const f=faltaUSD();return f<-0.005?Math.abs(f):0;}
function vueltoDado(){const t=tasaVigente();
  return VTA.vueltos.reduce((a,v)=>a+(v.mon==='BS'?v.monto/(t?t.bcv:1):v.monto),0);}
function vueltoResta(){return Math.round((vueltoTotal()-vueltoDado())*100)/100;}
function efUSDdado(){return VTA.vueltos.filter(v=>v.met==='efec_usd').reduce((a,v)=>a+v.monto,0);}
function cliActual(){
  if(VTA.cli) return VTA.cli;
  const n=VTA.nuevo;
  if(n.nom||n.ape) return {doc:VTA.doc,nom:n.nom,ape:n.ape,gen:n.gen,op:n.op,tel:n.tel,mail:n.mail,mkt:n.mkt,compras:0,nuevo:true};
  return null;
}
function cliListo(){
  const c=cliActual(); if(!c) return false;
  if(!c.nuevo) return true;
  return valDoc(VTA.doc) && c.nom.trim().length>1 && c.ape.trim().length>1
      && !valTel(c.op,c.tel) && valMail(c.mail).ok;
}

function cinta(){
  const t=tasaVigente(),s=saldoAcc(),np=pendAbiertos();
  let h='<span><span class="pt'+(tasaDeHoyCargada()?'':' avi')+'"></span>'
    +(t?'Tasa <b>Bs '+fN(t.bcv,2)+'</b> del <b>'+fFecha(t.fecha)+'</b>':'<b>Sin tasa</b>')+'</span>';

  if(np.length) h+='<span style="color:#f0c674">↩ <b>'+np.length+'</b> vuelto'+(np.length>1?'s':'')+' por entregar · USD <b>'

function pasosVta(){
  const b=[['cliente','Cliente'],['canal','Canal'],['arts','Artículos'],['cobro','Cobro']];
  if(vueltoTotal()>0||VTA.paso==='vuelto') b.push(['vuelto','Vuelto']);
  b.push(['correo','Recibo']);
  return b;
}
function vistaCaja(){
  if(VTA.paso==='correo'&&VTA.hecha) return pasoCorreo();
  const PS=pasosVta(),ia=PS.findIndex(p=>p[0]===VTA.paso);
  let h='<h1>Registro de ingresos</h1>'
    +'<p class="sub">Atiende <b>'+esc(cajeraNom(DB.turno))+'</b>. Un bloque por pantalla; el monto siempre se muestra en las dos monedas.</p>'
    +'<div class="riel">';
  PS.forEach((p,i)=>{const c=i===ia?'on':(i<ia?'ya':'');
    h+='<button class="p '+c+(p[0]==='vuelto'?' vue':'')+'"'+(i<ia&&p[0]!=='correo'?' data-paso="'+p[0]+'"':'')+'>'
      +'<span class="n">'+(i<ia?'✓':(i+1))+'</span><span>'+p[1]+'</span></button>';});
  h+='</div>';
  const ATRAS={canal:['cliente','Volver al cliente'],arts:['canal','Volver al canal'],
               cobro:['arts','Volver a los artículos'],vuelto:['cobro','Volver al cobro']};
  if(ATRAS[VTA.paso]) h+='<button class="volver" data-paso="'+ATRAS[VTA.paso][0]+'">← '+ATRAS[VTA.paso][1]+'</button>';
  if(VTA.paso==='cliente')h+=pasoCliente();
  if(VTA.paso==='canal')  h+=pasoCanal();
  if(VTA.paso==='arts')   h+=pasoArts();
  if(VTA.paso==='cobro')  h+=pasoCobro();
  if(VTA.paso==='vuelto') h+=pasoVuelto();
  return h;
}

/* 4 · COBRO */
/* precarga automática del monto que falta, en la moneda del método elegido */
function precarga(cual){
  if(cual==='cobro'){
    const f=Math.max(0,faltaUSD());
    VTA.buf = f>0.005 ? f.toFixed(2).replace('.',',') : '';
  }else{

  const c=Math.round((usd-Math.floor(usd))*100); if(c>0)r.push(c+'¢ en menudo');
  return r.length?r:['—'];}

/* registrar */
function registrar(){
  const t=tasaVigente(); let c=cliActual();
  if(c&&c.nuevo){
    const nc={id:'c'+(++DB.corr.cli),doc:c.doc,nom:c.nom.trim(),ape:c.ape.trim(),gen:c.gen,op:c.op,tel:c.tel,
              mail:c.mail.trim(),compras:0,monto:0,ultima:null,mkt:c.mkt};
    DB.clientes.push(nc); VTA.cli=nc; c=nc;
  }
  VTA.lineas.forEach(l=>{const p=DB.productos.find(x=>x.id===l.id); if(!p)return;
    if(l.talla&&p.tallas){const tt=p.tallas.find(x=>x.t===l.talla); if(tt)tt.e=Math.max(0,tt.e-l.cant);}
    else p.exi=Math.max(0,p.exi-l.cant);});
  const num='V-'+String(++DB.corr.venta).padStart(5,'0');
  c.compras=(c.compras||0)+1; c.monto=Math.round(((c.monto||0)+totalVenta())*100)/100; c.ultima=hoy;

  VTA.cobros.filter(x=>x.fuente==='accionista').forEach(x=>{
    const usd=x.mon==='BS'&&t?x.monto/t.bcv:x.monto;
    DB.accionista.push({fecha:hoy,tipo:'cobro',concepto:'Cobro venta '+num+' recibido en su cuenta',
      usd:-Math.round(usd*100)/100,ref:x.ref,venta:num});});
  VTA.vueltos.filter(x=>x.fuente==='accionista').forEach(x=>{
    const usd=x.mon==='BS'&&t?x.monto/t.bcv:x.monto;
    DB.accionista.push({fecha:hoy,tipo:'vuelto',concepto:'Vuelto venta '+num+' con fondos del accionista',
      usd:Math.round(usd*100)/100,ref:x.ref,venta:num});});

  const resta=vueltoResta();
  if(resta>0.005) DB.vpend.push({id:nid('vp'),venta:num,fecha:hoy,cliId:c.id,usd:resta,saldo:resta,entregas:[],cajera:DB.turno});

  DB.ventas.push({num,fecha:hoy,hora:horaAhora(),cliId:c.id,canal:VTA.canal,vendedorId:VTA.vendedorId==='sin'?null:VTA.vendedorId,
    repId:VTA.repId,entrega:VTA.entrega,deliv:montoDeliv(),cajera:DB.turno,total:totalVenta(),tasa:t?t.bcv:null,
    lineas:VTA.lineas.map(l=>{const p=DB.productos.find(x=>x.id===l.id)||{};
      return {sku:l.sku,nom:l.nom,talla:l.talla,cant:l.cant,precio:l.precio,cat:p.cat||''};}),
    cobros:VTA.cobros.slice(),vueltos:VTA.vueltos.slice(),pend:resta>0.005?resta:0});
  VTA.hecha={num,fecha:hoy,tasa:t?t.bcv:null,pend:resta>0.005?resta:0,cajera:DB.turno,
             repId:VTA.repId,pagoRep:pagoRep()};
  /* el recibo sale con la misma acción: no hace falta un segundo clic */
  DB.correos.push({fecha:hoy,cli:nomComp(c),mail:c.mail,venta:num,
    arts:VTA.lineas.reduce((a,l)=>a+l.cant,0),tipo:'recibo',estado:'enviado'});
  VTA.correoEnviado=true;
  aviso('Venta '+num+' registrada · recibo enviado a '+c.mail);
  VTA.paso='correo'; pinta();
}

function ventasDe(f){return DB.ventas.filter(v=>v.fecha===f);}
function movMet(f,k,mon){
  let e=0,sal=0;
  ventasDe(f).forEach(v=>{
    v.cobros.forEach(c=>{if(c.met===k)e+=c.monto;});
    v.vueltos.forEach(x=>{if(x.met===k)sal+=x.monto;});
  });
  DB.vpend.forEach(v=>v.entregas.forEach(x=>{if(x.met===k&&x.fecha===f)sal+=x.monto;}));
  return {ent:Math.round(e*100)/100, sal:Math.round(sal*100)/100, neto:Math.round((e-sal)*100)/100};
}
function esperadoCaja(f){
  const r={};
  METODOS.forEach(m=>{r[m.k]=movMet(f,m.k,m.mon);});
  r.efec_usd.esperado=Math.round((DB.fondoUSD+r.efec_usd.neto)*100)/100;
  r.efec_bs.esperado=r.efec_bs.neto;
  return r;
}

function repEst(){
  const vs=ventasDe(hoy);
  const agrupa=(fn)=>{const m={};vs.forEach(v=>{const k=fn(v);if(!k)return;m[k]=(m[k]||0)+v.total;});
    return Object.keys(m).map(k=>[k,Math.round(m[k]*100)/100]).sort((a,b)=>b[1]-a[1]);};
  const canal=agrupa(v=>v.canal);
  const vend=agrupa(v=>v.vendedorId?vendNom(v.vendedorId):'Autoservicio');
  const caj=agrupa(v=>cajeraNom(v.cajera));

  vs.forEach(v=>v.cobros.forEach(c=>{const t=tasaEn(v.fecha);
    const usd=c.mon==='BS'&&t?c.monto/t.bcv:c.monto;
    const n=(METODOS.find(y=>y.k===c.met)||{}).n;met[n]=(met[n]||0)+usd;}));
  const metArr=Object.keys(met).map(k=>[k,Math.round(met[k]*100)/100]).sort((a,b)=>b[1]-a[1]);
  const art={};
  vs.forEach(v=>v.lineas.forEach(l=>{art[l.nom]=(art[l.nom]||0)+l.cant;}));
  const artArr=Object.keys(art).map(k=>[k,art[k]]).sort((a,b)=>b[1]-a[1]);
  const cats={};
  vs.forEach(v=>v.lineas.forEach(l=>{if(l.cat)cats[l.cat]=(cats[l.cat]||0)+l.precio*l.cant;}));
  const catArr=Object.keys(cats).map(k=>[k,Math.round(cats[k]*100)/100]).sort((a,b)=>b[1]-a[1]);

  let h='<div class="g2b" style="margin-top:0">'
    +'<div>'+barras('Por canal de venta',canal)+barras('Por vendedor',vend)+barras('Por cajera',caj)+'</div>'
    +'<div>'+barras('Por método de pago',metArr)+barras('Por categoría',catArr)
    +barras('Artículos más vendidos',artArr,'')+'</div></div>';
  h+='<div class="card"><h2>Comparativo</h2><table class="dat"><thead><tr><th>Día</th><th class="n">Ventas</th>'
    +'<th class="n">Total USD</th><th class="n">Ticket promedio</th></tr></thead><tbody>';
  const fechas=Array.from(new Set(DB.ventas.map(v=>v.fecha))).sort().reverse();
  fechas.forEach(f=>{const g=ventasDe(f),tt=g.reduce((a,v)=>a+v.total,0);
    h+='<tr><td><b>'+fFecha(f)+'</b>'+(f===hoy?' <span class="chip ok">hoy</span>':'')+'</td>'
      +'<td class="n">'+g.length+'</td><td class="n"><b>'+fN(tt)+'</b></td>'
      +'<td class="n">'+fN(g.length?tt/g.length:0)+'</td></tr>';});
  h+='</tbody></table><div class="nota">En el sistema real esto se filtra por rango de fechas y se exporta. '
    +'Aquí se muestran los días que tienen ventas cargadas.</div></div>';
  return h;
}

function parseMasivo(txt){
  const filas=[],vistos={};
  txt.split(/\r?\n/).forEach((ln,i)=>{
    const raw=ln.trim(); if(!raw)return;
    const p=raw.split(/[\s;\t]+/).filter(Boolean),r={n:i+1,raw:raw};
    if(p.length<2){r.mal='Faltan datos';filas.push(r);return;}
    let f=p[0],iso=null,m=f.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
    if(m)iso=m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
    else if(/^\d{4}-\d{2}-\d{2}$/.test(f))iso=f;
    if(!iso){r.mal='Fecha no reconocida: «'+f+'»';filas.push(r);return;}
    r.fecha=iso; const bcv=num(p[1]);
    if(!isFinite(bcv)||bcv<=0){r.mal='Tasa inválida: «'+p[1]+'»';filas.push(r);return;}
    if(bcv<1||bcv>100000){r.mal='Fuera de rango ('+fN(bcv,2)+')';filas.push(r);return;}
    r.bcv=bcv; if(p[2]){const pa=num(p[2]);if(isFinite(pa)&&pa>0)r.par=pa;}
    if(iso>hoy){r.mal='Fecha futura';filas.push(r);return;}
    if(vistos[iso]){r.mal='Repetida (línea '+vistos[iso]+')';filas.push(r);return;}
    vistos[iso]=i+1;
    const ya=DB.tasas.find(t=>t.fecha===iso);
    r.tipo=ya?(ya.bcv===bcv?'igual':'actualiza'):'nueva'; if(ya)r.antes=ya.bcv;
    filas.push(r);});
  return filas;
}

function barra(){
  if(TAB!=='caja'||VTA.paso==='correo'){$('#barra').style.display='none';return;}
  $('#barra').style.display='';
  const falta=faltaUSD(),vue=vueltoTotal(),resta=vueltoResta(),c=cliActual();
  let izq='',der='',inf='';
  if(VTA.paso==='cliente'){
    const ok=cliListo();
    inf = !c ? 'Escriba la cédula del comprador.'
        : (VTA.cli ? 'Cliente '+nomComp(VTA.cli) : (ok?'Cliente nuevo · '+nomComp(c):'Complete los datos marcados en rojo.'));
    der='<button class="b oro" id="b_canal"'+(ok?'':' disabled')+'>Continuar →</button>';
  }else if(VTA.paso==='canal'){
    const ok=!!VTA.canal&&(VTA.entrega!=='delivery'||(!!VTA.zonaId&&!!VTA.repId));
    izq='<button class="b gh" data-paso="cliente">← Atrás</button>';
    inf=!VTA.canal?'Indique por dónde llegó la venta.'
      :(VTA.entrega==='delivery'&&!VTA.zonaId?'Elija la zona de delivery.'
      :(VTA.entrega==='delivery'&&!VTA.repId?'Indique quién lleva el delivery.':'Listo.'));
    der='<button class="b oro" id="b_arts"'+(ok?'':' disabled')+'>Continuar →</button>';
  }else if(VTA.paso==='arts'){
    izq='<button class="b gh" data-paso="canal">← Atrás</button>';
    inf=VTA.lineas.length?VTA.lineas.reduce((a,l)=>a+l.cant,0)+' unidades · USD '+fN(totalVenta()):'Agregue al menos un artículo.';
    der='<button class="b oro" id="b_cobro"'+(VTA.lineas.length?'':' disabled')+'>Ir al cobro →</button>';
  }else if(VTA.paso==='cobro'){
    izq='<button class="b gh" data-paso="arts">← Atrás</button>';
    inf=falta>0.005?'Falta cobrar USD '+fN(falta):(vue>0?'Hay que devolver USD '+fN(vue):'Listo para registrar.');
    der=vue>0?'<button class="b oro" id="c_ir2">Continuar al vuelto →</button>'
             :'<button class="b" id="c_reg2"'+(falta>0.005?' disabled':'')+'>Registrar y enviar el recibo</button>';
  }else{
    izq='<button class="b gh" data-paso="cobro">← Atrás</button>';
    inf=resta>0.005?'Quedará USD '+fN(resta)+' pendiente por entregar':(resta<-0.005?'Está entregando de más.':'Vuelto completo.');
    der='<button class="b oro" id="v_reg2"'+(resta<-0.005?' disabled':'')+'>'+(resta>0.005?'Registrar, dejar pendiente y enviar':'Entregar, registrar y enviar')+'</button>';
  }
  $('#barrain').innerHTML=(izq||'<span></span>')+'<span class="inf">'+esc(inf)+'</span>'+(der||'<span></span>');
}

/* ---------------------------------------------------------- EVENTOS ------ */
function buscaCli(){
  const d=(VTA.doc||'').replace(/\D/g,'');
  if(!valDoc(d)){VTA.cli=null;VTA.buscado=false;return;}
  const f=DB.clientes.find(c=>c.doc===d);
  if(f&&VTA.cli!==f){VTA.cli=f;VTA.buscado=true;aviso('Cliente: '+nomComp(f));}
  else if(!f){VTA.cli=null;VTA.buscado=true;}
}
document.addEventListener('click',e=>{
  if(e.target.closest('#m_dz')&&e.target.id!=='m_file'&&!e.target.closest('button')){
    const f=$('#m_file'); if(f) f.click(); return; }
  const pz=e.target.closest('.dzp');
  if(pz&&!e.target.closest('button')){ const f=pz.querySelector('input[type=file]'); if(f) f.click(); return; }
  const b=e.target.closest('button'); if(!b)return;
  if(b.dataset.tab){TAB=b.dataset.tab;PSEL=null;pinta();return;}
  if(b.dataset.sub){SUB=b.dataset.sub;PREV=null;pinta();return;}
  if(b.dataset.csub){CSUB=b.dataset.csub;pinta();return;}

  /* tasas */
  if(b.id==='t_g'){const f=$('#t_f').value,bv=num($('#t_b').value),pa=num($('#t_p').value);
    if(!f)return aviso('Indique la fecha.',true);
    if(!isFinite(bv)||bv<=0)return aviso('La tasa no es válida.',true);
    if(bv<1||bv>100000)return aviso('Esa tasa está fuera de rango razonable.',true);
    const ya=DB.tasas.find(x=>x.fecha===f);
    if(ya){ya.bcv=bv;ya.par=isFinite(pa)?pa:ya.par;ya.estado='por confirmar';}
    else DB.tasas.push({fecha:f,bcv:bv,par:isFinite(pa)?pa:null,estado:'por confirmar'});
    aviso('Tasa cargada. Confírmela abajo.');pinta();return;}
  if(b.dataset.conf){const x=DB.tasas.find(t=>t.fecha===b.dataset.conf);if(x){x.estado='confirmada';aviso('Confirmada.');}pinta();return;}
  if(b.id==='m_ej'){MTXT='25/08/2026\t857,55\t912,30\n22/08/2026\t851,10\t905,00\n21/08/2026\t848,72\n19/08/2026\t842,90\t894,00\n18/08/2026\t840,15\t891,20\n15/08/2026\tabc\n2026-08-14;836,44;886,00\n30/08/2026\t900,00';
    PREV=null;pinta();return;}
  if(b.id==='m_prev'){MTXT=$('#m_txt').value;if(!MTXT.trim())return aviso('Pegue primero el histórico.',true);
    PREV=parseMasivo(MTXT);pinta();return;}
  if(b.id==='m_can'){PREV=null;pinta();return;}
  if(b.id==='m_quita'){MFILE='';MTXT='';PREV=null;pinta();return;}
  if(b.dataset.quitap){const w=b.dataset.quitap;
    if(w==='c')VTA.print=null; else if(w==='v')VTA.vprint=null;
    else {const vp=DB.vpend.find(x=>x.id===PSEL); if(vp) vp._print=null;}
    pinta();return;}

  if(b.id==='m_imp'){let n=0;PREV.filter(r=>!r.mal&&r.tipo!=='igual').forEach(r=>{
      const ya=DB.tasas.find(t=>t.fecha===r.fecha);
      if(ya){ya.bcv=r.bcv;if(r.par)ya.par=r.par;ya.estado='confirmada';}
      else DB.tasas.push({fecha:r.fecha,bcv:r.bcv,par:r.par||null,estado:'confirmada'});n++;});
    PREV=null;MTXT='';aviso(n+' tasas importadas.');pinta();return;}

  /* accionista */
  if(b.id==='a_g'){const v=pila($('#a_m').value),met=$('#a_met').value,ref=$('#a_ref').value.trim(),
        bco=$('#a_banco')?$('#a_banco').value:'',s=saldoAcc();
    if(v<=0)return aviso('Escriba el monto.',true);
    if(v>s+0.005)return aviso('No puede reintegrar más de lo que se le debe (USD '+fN(s)+').',true);
    const mm=METODOS.find(x=>x.k===met);
    if(mm.banco&&!bco)return aviso('Indique desde qué banco se le repone.',true);
    if(mm.ref&&ref.length<3)return aviso('El reintegro por '+mm.n.toLowerCase()+' necesita referencia.',true);
    DB.accionista.push({fecha:hoy,tipo:'reintegro',
      concepto:'Reintegro al accionista por '+mm.n.toLowerCase()+(bco?' · '+bco:''),
      usd:-Math.round(v*100)/100,ref:ref,venta:''});
    aviso('Reintegro registrado desde tesorería.');pinta();return;}
  if(b.dataset.irtes){TAB='tes';TSUB=b.dataset.irtes;pinta();return;}
  if(b.dataset.tsub){TSUB=b.dataset.tsub;PSEL=null;pinta();return;}
  if(b.dataset.rsub){RSUB=b.dataset.rsub;pinta();return;}
  if(b.id==='ci_g'){
    if(pendAbiertos().length)return aviso('No puede cerrar con vueltos pendientes.',true);
    const esp=esperadoCaja(hoy);
    const dU=Math.round((pila(CIERRE.usd)-esp.efec_usd.esperado)*100)/100;
    const dB=Math.round((pila(CIERRE.bs)-esp.efec_bs.esperado)*100)/100;
    const cuadro=Math.abs(dU)<0.005&&Math.abs(dB)<0.005;
    if(!cuadro&&(CIERRE.motivo||'').trim().length<5)
      return aviso('Un cierre con diferencia necesita el motivo escrito.',true);
    DB.cierres.push({fecha:hoy,cajera:DB.turno,usd:pila(CIERRE.usd),bs:pila(CIERRE.bs),
      difUSD:dU,difBS:dB,cuadro:cuadro,motivo:CIERRE.motivo||'',autoriza:cuadro?'':'Administrador'});
    CIERRE=null;
    aviso(cuadro?'Caja cerrada · cuadró exacto.':'Caja cerrada con diferencia autorizada.');
    pinta();return;}

  /* navegación */
  if(b.dataset.paso){VTA.paso=b.dataset.paso;pinta();return;}
  if(b.id==='b_canal'){VTA.paso='canal';pinta();return;}
  if(b.id==='b_arts'){VTA.paso='arts';pinta();return;}
  if(b.id==='b_cobro'){VTA.paso='cobro';precarga('cobro');pinta();return;}
  if(b.id==='c_ir'||b.id==='c_ir2'){
    if(VTA.editC)return aviso('Termine de modificar ese cobro: guárdelo o cancele.',true);
    VTA.paso='vuelto';precarga('vuelto');pinta();return;}
  if(b.id==='c_reg'||b.id==='c_reg2'||b.id==='v_reg'||b.id==='v_reg2'){
    if(VTA.editC)return aviso('Termine de modificar ese cobro: guárdelo o cancele.',true);
    if(VTA.editV)return aviso('Termine de modificar esa entrega: guárdela o cancele.',true);
    registrar();return;}
  if(b.id==='h_otra'){nuevaVenta();pinta();return;}
  if(b.id==='cl_otro'){VTA.cli=null;VTA.doc='';VTA.buscado=false;pinta();return;}
  if(b.id==='cl_sigue'){if(!cliListo())return aviso('Complete los datos marcados en rojo.',true);
    VTA.paso='canal';pinta();return;}
  if(b.dataset.sug){VTA.nuevo.mail=b.dataset.sug;pinta();return;}
  if(b.dataset.gen){VTA.nuevo.gen=b.dataset.gen;pinta();return;}

  /* canal */
  if(b.dataset.canal){VTA.canal=b.dataset.canal;pinta();return;}
  if(b.dataset.vend){VTA.vendedorId=b.dataset.vend;pinta();return;}
  if(b.dataset.ent){VTA.entrega=b.dataset.ent;if(b.dataset.ent==='oficina'){VTA.zonaId=null;VTA.repId=null;}pinta();return;}
  if(b.dataset.zona){VTA.zonaId=b.dataset.zona;pinta();return;}
  if(b.dataset.rep){VTA.repId=b.dataset.rep;pinta();return;}

  /* artículos */
  if(b.dataset.cat){VTA.cat=b.dataset.cat;pinta();return;}
  if(b.dataset.add!==undefined&&b.dataset.add!==''){
    const p=DB.productos.find(x=>x.id===b.dataset.add),ta=b.dataset.t||'';
    const disp=p.tallas?(p.tallas.find(x=>x.t===ta)||{e:0}).e:p.exi;
    const k=p.id+'|'+ta,ya=VTA.lineas.find(l=>l.k===k);
    if(ya){if(ya.cant<disp)ya.cant++;else aviso('No hay más existencia.',true);}
    else VTA.lineas.push({k,id:p.id,sku:p.sku,nom:p.nom,talla:ta,precio:p.precio,cant:1,disp});
    pinta();return;}
  if(b.dataset.qp){const l=VTA.lineas.find(x=>x.k===b.dataset.qp);if(l.cant<l.disp)l.cant++;else aviso('No hay más existencia.',true);pinta();return;}
  if(b.dataset.qm){const l=VTA.lineas.find(x=>x.k===b.dataset.qm);l.cant--;if(l.cant<=0)VTA.lineas=VTA.lineas.filter(x=>x.k!==l.k);pinta();return;}
  if(b.dataset.del){VTA.lineas=VTA.lineas.filter(x=>x.k!==b.dataset.del);pinta();return;}

  /* cobro */
  if(b.dataset.met){VTA.met=b.dataset.met;VTA.ref='';VTA.banco='';VTA.print=null;precarga('cobro');pinta();return;}
  if(b.dataset.fu){VTA.fuente=b.dataset.fu;pinta();return;}
  if(b.dataset.climpia){VTA.buf='';pinta();return;}
  if(b.dataset.exacto){VTA.buf=Math.max(0,faltaUSD()).toFixed(2).replace('.',',');pinta();return;}
  if(b.id==='c_add'){const m=METODOS.find(x=>x.k===VTA.met),t=tasaVigente();
    const usd=pila($('#c_monto')?$('#c_monto').value:VTA.buf);
    if(usd<=0)return aviso('Escriba el monto en dólares.',true);
    if(m.mon==='BS'&&!t)return aviso('Sin tasa confirmada no se puede cobrar en bolívares.',true);
    const v=montoEn(m,usd,t);
    const ref=m.banco?($('#c_ref')?$('#c_ref').value.trim():''):'';
    const bco=m.banco?($('#c_banco')?$('#c_banco').value:''):'';
    if(m.banco&&!bco)return aviso(org(m).falta+' del '+m.n.toLowerCase()+'.',true);
    if(m.banco&&ref.length<3)return aviso('Falta '+org(m).ref.toLowerCase()+'.',true);
    const linea={met:m.k,mon:m.mon,monto:v,ref,banco:bco,fuente:m.banco?VTA.fuente:'empresa',print:VTA.print};
    const era=!!VTA.editC;
    if(era){VTA.cobros.splice(VTA.editC.i,0,linea);VTA.editC=null;}
    else VTA.cobros.push(linea);
    VTA.ref='';VTA.banco='';VTA.print=null;precarga('cobro');
    const f2=faltaUSD();
    aviso(era?'Cobro modificado.':(f2>0.005?'Cobro agregado · faltan USD '+fN(f2):'Cobro agregado.'));
    pinta();return;}
  if(b.dataset.qc!==undefined&&b.dataset.qc!==''){VTA.cobros.splice(+b.dataset.qc,1);precarga('cobro');pinta();return;}
  if(b.dataset.edc!==undefined&&b.dataset.edc!==''){
    if(VTA.editC){VTA.cobros.splice(VTA.editC.i,0,VTA.editC.c);VTA.editC=null;}
    const i=+b.dataset.edc, c=VTA.cobros.splice(i,1)[0], t=tasaVigente();
    const m=METODOS.find(x=>x.k===c.met);
    VTA.editC={i:i,c:c};
    VTA.met=c.met; VTA.banco=c.banco||''; VTA.ref=c.ref||'';
    VTA.fuente=c.fuente||'empresa'; VTA.print=c.print||null;
    VTA.buf=(m.mon==='BS'?(t?c.monto/t.bcv:0):c.monto).toFixed(2).replace('.',',');
    aviso('Modificando ese cobro · cámbielo y guarde.');
    pinta();return;}
  if(b.id==='c_cancel'){
    if(VTA.editC){VTA.cobros.splice(VTA.editC.i,0,VTA.editC.c);VTA.editC=null;}
    VTA.ref='';VTA.banco='';VTA.print=null;precarga('cobro');aviso('Cambio cancelado.');pinta();return;}

  /* vuelto */
  if(b.dataset.vmet){VTA.vmet=b.dataset.vmet;VTA.vref='';VTA.vbanco='';VTA.vprint=null;precarga('vuelto');pinta();return;}
  if(b.dataset.vfu){VTA.vfuente=b.dataset.vfu;pinta();return;}
  if(b.dataset.vlimpia){VTA.vbuf='';pinta();return;}
  if(b.dataset.vr){VTA.vbuf=Number(b.dataset.vr).toFixed(2).replace('.',',');pinta();return;}
  if(b.dataset.vexacto){VTA.vbuf=Math.max(0,vueltoResta()).toFixed(2).replace('.',',');pinta();return;}
  if(b.id==='v_add'){const m=METODOS.find(x=>x.k===VTA.vmet),t=tasaVigente();
    const usd=pila($('#v_monto')?$('#v_monto').value:VTA.vbuf);
    if(usd<=0)return aviso('Escriba el monto en dólares.',true);
    if(m.mon==='BS'&&!t)return aviso('Sin tasa confirmada no se puede entregar en bolívares.',true);
    const v=montoEn(m,usd,t);
    const ref=m.banco?($('#v_ref')?$('#v_ref').value.trim():''):'';
    const bco=m.banco?($('#v_banco')?$('#v_banco').value:''):'';
    if(m.banco&&!bco)return aviso(org(m).falta+' con la que se paga el vuelto.',true);
    if(m.banco&&ref.length<3)return aviso('Falta '+org(m).ref.toLowerCase()+' del vuelto.',true);
    if(m.k==='efec_usd'&&v>DB.fondoUSD-efUSDdado()+0.005)return aviso('El fondo en efectivo no alcanza.',true);
    const lin={met:m.k,mon:m.mon,monto:v,ref,banco:bco,fuente:m.banco?VTA.vfuente:'empresa',print:VTA.vprint};
    const eraV=!!VTA.editV;
    if(eraV){VTA.vueltos.splice(VTA.editV.i,0,lin);VTA.editV=null;}
    else VTA.vueltos.push(lin);
    VTA.vref='';VTA.vbanco='';VTA.vprint=null;precarga('vuelto');
    aviso(eraV?'Entrega modificada.':'Entrega agregada.');pinta();return;}
  if(b.dataset.qv!==undefined&&b.dataset.qv!==''){VTA.vueltos.splice(+b.dataset.qv,1);precarga('vuelto');pinta();return;}
  if(b.dataset.edv!==undefined&&b.dataset.edv!==''){
    if(VTA.editV){VTA.vueltos.splice(VTA.editV.i,0,VTA.editV.v);VTA.editV=null;}
    const i=+b.dataset.edv, x=VTA.vueltos.splice(i,1)[0], t=tasaVigente();
    const m=METODOS.find(y=>y.k===x.met);
    VTA.editV={i:i,v:x};
    VTA.vmet=x.met; VTA.vbanco=x.banco||''; VTA.vref=x.ref||'';
    VTA.vfuente=x.fuente||'empresa'; VTA.vprint=x.print||null;
    VTA.vbuf=(m.mon==='BS'?(t?x.monto/t.bcv:0):x.monto).toFixed(2).replace('.',',');
    aviso('Modificando esa entrega · cámbiela y guarde.');
    pinta();return;}
  if(b.id==='v_cancel'){
    if(VTA.editV){VTA.vueltos.splice(VTA.editV.i,0,VTA.editV.v);VTA.editV=null;}
    VTA.vref='';VTA.vbanco='';VTA.vprint=null;precarga('vuelto');aviso('Cambio cancelado.');pinta();return;}

  /* correo */
  if(b.id==='c_mail'){const c=VTA.cli;
    DB.correos.push({fecha:hoy,cli:nomComp(c),mail:c.mail,venta:VTA.hecha.num,
      arts:VTA.lineas.reduce((a,l)=>a+l.cant,0),tipo:'recibo',estado:'reenviado'});
    aviso('Recibo reenviado a '+c.mail);pinta();return;}

  /* vueltos pendientes */
  if(b.dataset.psel){PSEL=(PSEL===b.dataset.psel?null:b.dataset.psel);pinta();return;}
  if(b.dataset.pmet){const [id,k]=b.dataset.pmet.split('|');const v=DB.vpend.find(x=>x.id===id);
    v._met=k;v._buf='';v._ref='';pinta();return;}
  if(b.dataset.pfu){const [id,f]=b.dataset.pfu.split('|');const v=DB.vpend.find(x=>x.id===id);v._fu=f;pinta();return;}
  if(b.dataset.pex){const v=DB.vpend.find(x=>x.id===b.dataset.pex);
    v._buf=v.saldo.toFixed(2).replace('.',',');pinta();return;}
  if(b.dataset.pgo){
    const v=DB.vpend.find(x=>x.id===b.dataset.pgo),t=tasaVigente();
    const m=METODOS.find(x=>x.k===(v._met||'efec_usd'));
    const usd=Math.round(pila($('#p_monto')?$('#p_monto').value:v._buf)*100)/100;
    if(usd<=0)return aviso('Escriba el monto en dólares.',true);
    if(m.mon==='BS'&&!t)return aviso('Sin tasa confirmada no se puede entregar en bolívares.',true);
    const monto=montoEn(m,usd,t);
    const ref=m.banco?($('#p_ref')?$('#p_ref').value.trim():''):'';
    const bcoP=m.banco?($('#p_banco')?$('#p_banco').value:''):'';
    if(m.banco&&!bcoP)return aviso(org(m).falta+'.',true);
    if(m.banco&&ref.length<3)return aviso('Falta '+org(m).ref.toLowerCase()+'.',true);
    if(usd>v.saldo+0.005)return aviso('Está entregando más de lo que se le debe (USD '+fN(v.saldo)+').',true);
    if(m.k==='efec_usd'&&usd>DB.fondoUSD+0.005)return aviso('El fondo en efectivo no alcanza.',true);
    v.entregas.push({fecha:hoy,met:m.k,mon:m.mon,monto:monto,usd:usd,ref:ref,banco:bcoP,
      fuente:m.banco?(v._fu||'empresa'):'empresa',cajera:DB.turno});
    v.saldo=Math.round((v.saldo-usd)*100)/100;
    if(m.banco&&(v._fu==='accionista')) DB.accionista.push({fecha:hoy,tipo:'vuelto',
      concepto:'Vuelto pendiente de '+v.venta+' entregado con fondos del accionista',usd:usd,ref:ref,venta:v.venta});
    const c=DB.clientes.find(x=>x.id===v.cliId);
    DB.correos.push({fecha:hoy,cli:nomComp(c),mail:c.mail,venta:v.venta,arts:0,tipo:'vuelto',estado:'enviado'});
    v._buf='';v._ref='';v._banco='';
    aviso(v.saldo>0.005?'Entrega parcial · quedan USD '+fN(v.saldo)+' · correo enviado a '+c.mail
                       :'Vuelto saldado · correo enviado a '+c.mail);
    if(v.saldo<=0.005) PSEL=null;
    pinta();return;}

  /* configuración */
  if(b.id==='nv_g'){
    const nom=$('#nv_nom').value.trim(),ape=$('#nv_ape').value.trim(),ci=$('#nv_ci').value.trim(),
          com=pila($('#nv_com').value),banco=$('#nv_banco').value,op=$('#nv_op').value,tel=$('#nv_tel').value.trim();
    if(nom.length<2)return aviso('Escriba el nombre del vendedor.',true);
    if(ape.length<2)return aviso('Escriba el apellido del vendedor.',true);
    if(!/^\d{6,9}$/.test(ci))return aviso('La cédula debe tener entre 6 y 9 dígitos.',true);
    if(DB.cfg.vendedores.some(v=>v.ci===ci))return aviso('Ya hay un vendedor con esa cédula.',true);
    if(com<=0||com>50)return aviso('La comisión debe estar entre 0 y 50 %.',true);
    if(!banco)return aviso('Elija el banco de su pago móvil.',true);
    const vt=valTel(op,tel); if(vt)return aviso('Pago móvil: '+vt.toLowerCase(),true);
    DB.cfg.vendedores.push({id:nid('v'),nom,ape,ci,com,banco,op,tel,activo:true});
    aviso('Vendedor agregado con sus datos de pago.');pinta();return;}
  if(b.dataset.vtog){const v=DB.cfg.vendedores.find(x=>x.id===b.dataset.vtog);v.activo=!v.activo;pinta();return;}
  if(b.id==='nr_g'){
    const nom=$('#nr_nom').value.trim(),ape=$('#nr_ape').value.trim(),ci=$('#nr_ci').value.trim(),
          pct=pila($('#nr_pct').value),banco=$('#nr_banco').value,op=$('#nr_op').value,tel=$('#nr_tel').value.trim();
    if(nom.length<2)return aviso('Escriba el nombre del repartidor.',true);
    if(ape.length<2)return aviso('Escriba el apellido del repartidor.',true);
    if(!/^\d{6,9}$/.test(ci))return aviso('La cédula debe tener entre 6 y 9 dígitos.',true);
    if(DB.cfg.repartidores.some(r=>r.ci===ci))return aviso('Ya hay un repartidor con esa cédula.',true);
    if(pct<=0||pct>100)return aviso('El porcentaje debe estar entre 1 y 100.',true);
    if(!banco)return aviso('Elija el banco de su pago móvil.',true);
    const vt2=valTel(op,tel); if(vt2)return aviso('Pago móvil: '+vt2.toLowerCase(),true);
    DB.cfg.repartidores.push({id:nid('r'),nom,ape,ci,pct,banco,op,tel,activo:true});
    aviso('Repartidor agregado con sus datos de pago.');pinta();return;}
  if(b.dataset.rtog){const r=DB.cfg.repartidores.find(x=>x.id===b.dataset.rtog);r.activo=!r.activo;pinta();return;}
  if(b.id==='nz_g'){const nom=$('#nz_nom').value.trim(),usd=pila($('#nz_usd').value),t=$('#nz_t').value.trim();
    if(nom.length<3)return aviso('Escriba el nombre de la zona.',true);
    if(usd<=0)return aviso('La tarifa debe ser mayor que cero.',true);
    DB.cfg.zonas.push({id:nid('z'),nom,usd,t:t||'Por confirmar',activo:true});aviso('Zona agregada.');pinta();return;}
  if(b.dataset.ztog){const z=DB.cfg.zonas.find(x=>x.id===b.dataset.ztog);z.activo=!z.activo;pinta();return;}
  if(b.id==='nc_g'){const n=$('#nc_nom').value.trim();
    if(n.length<3)return aviso('Escriba el nombre del canal.',true);
    if(DB.cfg.canales.some(c=>c.toLowerCase()===n.toLowerCase()))return aviso('Ese canal ya existe.',true);
    DB.cfg.canales.push(n);aviso('Canal agregado.');pinta();return;}
  if(b.dataset.cdel!==undefined&&b.dataset.cdel!==''){
    if(DB.cfg.canales.length<=1)return aviso('Debe quedar al menos un canal.',true);
    DB.cfg.canales.splice(+b.dataset.cdel,1);pinta();return;}
  if(b.id==='nk_g'){const nom=$('#nk_nom').value.trim(),ape=$('#nk_ape').value.trim(),ci=$('#nk_ci').value.trim();
    if(nom.length<2)return aviso('Escriba el nombre de la cajera.',true);
    if(ape.length<2)return aviso('Escriba el apellido de la cajera.',true);
    if(!/^\d{6,9}$/.test(ci))return aviso('La cédula debe tener entre 6 y 9 dígitos.',true);
    if(DB.cfg.cajeras.some(k=>k.ci===ci))return aviso('Ya hay una cajera con esa cédula.',true);
    DB.cfg.cajeras.push({id:nid('k'),nom,ape,ci,activo:true});aviso('Cajera agregada.');pinta();return;}
  if(b.dataset.ktog){const k=DB.cfg.cajeras.find(x=>x.id===b.dataset.ktog);
    if(DB.turno===k.id)return aviso('No puede desactivar a la cajera en turno.',true);
    k.activo=!k.activo;pinta();return;}
  if(b.dataset.kturno){DB.turno=b.dataset.kturno;aviso('Turno de '+cajeraNom(DB.turno));pinta();return;}
});

document.addEventListener('input',e=>{
  const id=e.target.id, v=e.target.value;
  if(id==='cl_doc'){VTA.doc=v.replace(/\D/g,'');
    const s=e.target.selectionStart; buscaCli(); pinta();
    const n=$('#cl_doc'); if(n){n.focus();n.setSelectionRange(s,s);} return;}
  if(id==='cl_nom'){VTA.nuevo.nom=v;e.target.className=v.trim().length>1?'bien':'mal';refrescaValid();return;}
  if(id==='cl_ape'){VTA.nuevo.ape=v;e.target.className=v.trim().length>1?'bien':'mal';refrescaValid();return;}
  if(id==='cl_tel'){VTA.nuevo.tel=v.replace(/\D/g,'').slice(0,7);
    if(e.target.value!==VTA.nuevo.tel)e.target.value=VTA.nuevo.tel;
    e.target.className=VTA.nuevo.tel?(/^\d{7}$/.test(VTA.nuevo.tel)?'bien':'mal'):'';refrescaValid();return;}
  if(id==='cl_mail'){VTA.nuevo.mail=v;
    const r=valMail(v); e.target.className=v?(r.ok?'bien':'mal'):''; refrescaValid();return;}
  if(id==='c_q'){VTA.q=v;const s=e.target.selectionStart;pinta();
    const n=$('#c_q');if(n){n.focus();n.setSelectionRange(s,s);}return;}
  if(id==='m_txt'){MTXT=v;return;}
  if(id==='c_ref'){VTA.ref=v;return;}
  if(id==='v_ref'){VTA.vref=v;return;}
  if(id==='c_monto'){VTA.buf=v;const t=tasaVigente(),m=METODOS.find(x=>x.k===VTA.met);
    const n=$('#c_eq');if(n)n.textContent=eqTexto(v,m.mon==='BS',t);return;}
  if(id==='v_monto'){VTA.vbuf=v;const t=tasaVigente(),m=METODOS.find(x=>x.k===VTA.vmet);
    const n=$('#v_eq');if(n)n.textContent=eqTexto(v,m.mon==='BS',t);return;}
  if(id==='p_monto'){const vp=DB.vpend.find(x=>x.id===PSEL);if(!vp)return;vp._buf=v;
    const t=tasaVigente(),m=METODOS.find(x=>x.k===(vp._met||'efec_usd'));
    const n=$('#p_eq');if(n)n.textContent=eqTexto(v,m.mon==='BS',t);return;}
  if(id==='p_ref'){const vp=DB.vpend.find(x=>x.id===PSEL);if(vp)vp._ref=v;return;}
  if(id==='ci_usd'){CIERRE.usd=v;const s2=e.target.selectionStart;pinta();
    const n=$('#ci_usd');if(n){n.focus();n.setSelectionRange(s2,s2);}return;}
  if(id==='ci_bs'){CIERRE.bs=v;const s2=e.target.selectionStart;pinta();
    const n=$('#ci_bs');if(n){n.focus();n.setSelectionRange(s2,s2);}return;}
  if(id==='ci_mot'){CIERRE.motivo=v;return;}
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='m_file'){
    const f=e.target.files&&e.target.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{ MFILE=f.name; MTXT=String(r.result||'').replace(/^\uFEFF/,'');
      PREV=parseMasivo(MTXT); aviso('Archivo leído: '+PREV.length+' líneas.'); pinta(); };
    r.onerror=()=>aviso('No se pudo leer el archivo.',true);
    r.readAsText(f,'UTF-8'); return;
  }
  if(id==='c_print'||id==='v_print'||id==='p_print'){
    const f=e.target.files&&e.target.files[0]; if(!f)return;
    if(!/^image\//.test(f.type))return aviso('El comprobante debe ser una imagen.',true);
    if(f.size>3*1024*1024)return aviso('La imagen no puede pesar más de 3 MB.',true);
    const r=new FileReader();
    r.onload=()=>{ const d={nom:f.name,src:String(r.result)};
      if(id==='c_print')VTA.print=d; else if(id==='v_print')VTA.vprint=d;
      else { const vp=DB.vpend.find(x=>x.id===PSEL); if(vp) vp._print=d; }
      aviso('Comprobante adjuntado.'); pinta(); };
    r.readAsDataURL(f); return;
  }
  if(id==='cl_mkt'){VTA.nuevo.mkt=e.target.checked;return;}
  if(id==='cl_op'){VTA.nuevo.op=e.target.value;pinta();return;}
  if(id==='k_turno'){DB.turno=e.target.value;aviso('Turno de '+cajeraNom(DB.turno));pinta();return;}
  if(e.target.dataset.vcom){const v=DB.cfg.vendedores.find(x=>x.id===e.target.dataset.vcom);
    const n=pila(e.target.value); if(n<0||n>50){aviso('La comisión debe estar entre 0 y 50 %.',true);}else{v.com=n;aviso('Comisión actualizada.');}
    pinta();return;}
  if(e.target.dataset.zusd){const z=DB.cfg.zonas.find(x=>x.id===e.target.dataset.zusd);
    const n=pila(e.target.value); if(n<=0){aviso('La tarifa debe ser mayor que cero.',true);}else{z.usd=n;aviso('Tarifa actualizada.');}
    pinta();return;}
  if(e.target.dataset.rpct){const r=DB.cfg.repartidores.find(x=>x.id===e.target.dataset.rpct);
    const n=pila(e.target.value); if(n<=0||n>100){aviso('El porcentaje debe estar entre 1 y 100.',true);}else{r.pct=n;aviso('Porcentaje actualizado.');}
    pinta();return;}
  if(id==='c_banco'){VTA.banco=e.target.value;e.target.className=e.target.value?'':'mal';return;}
  if(id==='p_banco'){const vp=DB.vpend.find(x=>x.id===PSEL);if(vp)vp._banco=e.target.value;return;}
  if(id==='v_banco'){VTA.vbanco=e.target.value;e.target.className=e.target.value?'':'mal';return;}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const id=e.target.id;
  if(id==='c_monto'){e.preventDefault();const b=$('#c_add');if(b)b.click();}
  if(id==='v_monto'){e.preventDefault();const b=$('#v_add');if(b)b.click();}
});
pinta();
</script>
</body>
</html>
