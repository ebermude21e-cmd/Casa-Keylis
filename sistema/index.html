<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SICOM · Casa Keylis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --lienzo:#f7f3ea; --papel:#fffdf8; --tinta:#2e2621; --tenue:#7d7065;
  --linea:#e3d9c8; --dorado:#b08432; --marron:#5c4327;
  --verde:#2f6a4a; --rojo:#9b3024;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --lienzo:#17140f; --papel:#201c16; --tinta:#efe7d9; --tenue:#a3968a;
    --linea:#342d24; --dorado:#d4a549; --marron:#d4a549;
    --verde:#6fbf92; --rojo:#e07a6c;
  }
}
:root[data-theme="dark"]{
  --lienzo:#17140f; --papel:#201c16; --tinta:#efe7d9; --tenue:#a3968a;
  --linea:#342d24; --dorado:#d4a549; --marron:#d4a549;
  --verde:#6fbf92; --rojo:#e07a6c;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--lienzo); color:var(--tinta);
  font:400 16px/1.55 Inter,-apple-system,Segoe UI,sans-serif;
  display:flex; align-items:flex-start; justify-content:center;
  min-height:100vh; padding:48px 16px;
}
.caja{width:100%; max-width:560px}
h1{
  font:600 28px/1.2 Fraunces,Georgia,serif; letter-spacing:-.01em;
  margin:0 0 4px; color:var(--marron); text-wrap:balance;
}
.sub{color:var(--tenue); font-size:14px; margin:0 0 28px}
.tarjeta{
  background:var(--papel); border:1px solid var(--linea);
  border-radius:10px; padding:26px;
}
label{display:block; font-size:13px; font-weight:500; margin:16px 0 6px; color:var(--tenue)}
input{
  width:100%; padding:11px 13px; font:inherit; color:var(--tinta);
  background:var(--lienzo); border:1px solid var(--linea); border-radius:7px;
}
input:focus{outline:2px solid var(--dorado); outline-offset:1px; border-color:transparent}
button{
  margin-top:22px; width:100%; padding:12px; font:500 15px Inter,sans-serif;
  color:#fff; background:var(--marron); border:0; border-radius:7px; cursor:pointer;
}
button:hover{background:var(--dorado)}
button:disabled{opacity:.55; cursor:default}
.aviso{
  margin-top:18px; padding:11px 13px; border-radius:7px; font-size:14px;
  border:1px solid var(--linea); background:var(--lienzo);
}
.aviso.mal{border-color:var(--rojo); color:var(--rojo)}
.aviso.bien{border-color:var(--verde); color:var(--verde)}
dl{display:grid; grid-template-columns:auto 1fr; gap:9px 20px; margin:0}
dt{color:var(--tenue); font-size:14px}
dd{margin:0; font-size:14px; font-variant-numeric:tabular-nums; text-align:right}
.quien{
  display:flex; justify-content:space-between; align-items:baseline;
  gap:12px; padding-bottom:16px; margin-bottom:18px; border-bottom:1px solid var(--linea);
}
.quien b{font:600 17px Fraunces,Georgia,serif}
.papel{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dorado)}
.salir{
  margin-top:24px; background:transparent; color:var(--tenue);
  border:1px solid var(--linea);
}
.salir:hover{background:var(--lienzo); color:var(--tinta)}
.pie{margin-top:22px; font-size:12px; color:var(--tenue); text-align:center}
.oculto{display:none}
</style>
</head>
<body>
<main class="caja">

  <h1>SICOM</h1>
  <p class="sub">Casa Keylis Boutique Femine, C.A. · núcleo</p>

  <!-- ---------------- ENTRAR ---------------- -->
  <section id="puerta" class="tarjeta">
    <form id="forma" autocomplete="on">
      <label for="correo">Correo</label>
      <input id="correo" type="email" required autocomplete="username">

      <label for="clave">Contraseña</label>
      <input id="clave" type="password" required autocomplete="current-password">

      <button id="boton" type="submit">Entrar</button>
    </form>
    <div id="aviso" class="aviso oculto"></div>
  </section>

  <!-- ---------------- ADENTRO ---------------- -->
  <section id="adentro" class="tarjeta oculto">
    <div class="quien">
      <b id="nombre">—</b>
      <span class="papel" id="papel"></span>
    </div>
    <dl id="datos"></dl>
    <button class="salir" id="btnSalir" type="button">Cerrar sesión</button>
  </section>

  <p class="pie">
    La sesión vive sólo en esta pestaña. Al cerrarla no queda nada en este equipo.
  </p>

</main>

<script src="supabase.js"></script>
<script src="core_puente.js"></script>
<script src="core_transporte.js"></script>
<script>
(function(){
'use strict';

const URL_SRV = 'https://itotudruqzgupvybvdnj.supabase.co';
const LLAVE   = 'sb_publishable_HsD6FcXcGV9W5BTZG63xUw_ULtXNc9q';

const $ = function(id){ return document.getElementById(id); };
const nube = CORE_NUBE.crea({ url: URL_SRV, llave: LLAVE });

function avisa(texto, clase){
  const a = $('aviso');
  a.textContent = texto;
  a.className = 'aviso' + (clase ? ' ' + clase : '');
}

function fila(dl, titulo, valor){
  const dt = document.createElement('dt'); dt.textContent = titulo;
  const dd = document.createElement('dd'); dd.textContent = valor;
  dl.appendChild(dt); dl.appendChild(dd);
}

function cuantos(x){ return Array.isArray(x) ? x.length : 0; }

function muestra(r){
  const yo = r.yo || {};
  $('nombre').textContent = yo.nombre || yo.uid || 'sin nombre';
  $('papel').textContent  = yo.papel || 'sin papel asignado';

  const DB = r.DB || {};
  const emp = DB.empresa || {};
  const dl = $('datos');
  dl.textContent = '';

  fila(dl, 'Empresa',        emp.nom || '—');
  fila(dl, 'RIF',            emp.rif || '—');
  fila(dl, 'Plan de cuentas', cuantos(DB.cuentas) + ' cuentas');
  fila(dl, 'Modelos de asiento', cuantos(DB.modelos) + ' modelos');
  fila(dl, 'Artículos',      cuantos(DB.productos));
  fila(dl, 'Clientas',       cuantos(DB.clientes));
  fila(dl, 'Ventas',         cuantos(DB.ventas));
  fila(dl, 'Asientos de bitácora', cuantos(DB.bitacora));
  fila(dl, 'Leído del servidor', (r.leido || '').replace('T', ' ').replace('Z', ' UTC'));

  $('puerta').classList.add('oculto');
  $('adentro').classList.remove('oculto');
}

$('forma').addEventListener('submit', async function(e){
  e.preventDefault();
  $('boton').disabled = true;
  avisa('Entrando…');
  try{
    await nube.entra($('correo').value, $('clave').value);
    $('clave').value = '';
    avisa('Leyendo del servidor…');
    const r = await nube.carga();
    muestra(r);
  }catch(err){
    avisa(err.message || String(err), 'mal');
  }finally{
    $('boton').disabled = false;
  }
});

$('btnSalir').addEventListener('click', async function(){
  await nube.sale();
  location.reload();
});

})();
</script>
</body>
</html>
