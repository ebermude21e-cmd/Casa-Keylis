<!--
  ===========================================================================
  SICOM · LA PUERTA, QUE SÓLO LLEVA

  Esta página no inicia sesión, no habla con ningún servidor y no lleva
  ninguna llave dentro. Lo único que hace es llevar a `app.html`, que es el
  sistema, arrastrando tal cual lo que venga detrás de la dirección.

  QUÉ HABÍA AQUÍ ANTES, Y QUÉ COSTÓ (medido el 2/11/2026)

  Hasta hoy `index.html` eran 7 KB con un formulario de inicio propio, el
  conector de Supabase y la llave del proyecto escrita a mano. O sea: una
  SEGUNDA pantalla de inicio, la más delicada del sistema, duplicada. Tres
  cosas se juntaban en ese archivo, y las tres se midieron:

    · NO OFRECÍA RECUPERAR LA CLAVE. Las tres puertas que se construyeron el
      28/10 —crear la clave, «olvidé mi clave», poner la clave nueva—, con 8
      comprobaciones y 6 mutantes muertos, viven en `app.html`. El dueño
      abrió la dirección publicada el 2/11 para cambiar su clave y no tenía
      por dónde: el enlace no estaba. Se construyó la recuperación y la
      puerta por la que entra la gente no la ofrecía.

    · APUNTABA AL AMBIENTE EQUIVOCADO. `publica_sistema.yml` copia
      `core/` entero a `sistema/` con `rsync`, así que la llave de CALIDAD
      escrita dentro de este archivo viajaba igual a la dirección de la
      tienda. `casakeylis.com/sistema/` —la dirección que se le da a una
      cajera— le hablaba al banco de pruebas. Las comprobaciones de ese
      flujo miran el bloque `window.NUBE` de `app.html` y nada más: este
      archivo pasaba por debajo.

    · Y NINGUNA COMPROBACIÓN LO MIRABA. `prueba_pantalla.js` mide
      `app.html`. Este archivo no estaba ni siquiera en el repositorio del
      núcleo: vivía sólo en el repositorio publicado, sin versión y sin
      nadie que lo vigilara.

  La forma de que eso no vuelva a pasar no es acordarse de revisarlo: es que
  aquí dentro NO HAYA NADA QUE PUEDA ESTAR MAL. Sin servidor, sin llave y
  sin formulario, este archivo no tiene cómo apuntar al ambiente equivocado.

  EL ENLACE DEL CORREO VIAJA ENTERO, Y ESO ES LO DELICADO

  Supabase manda la recuperación y la invitación con la sesión en el
  FRAGMENTO —lo que va detrás de `#`—. Un `<meta refresh>` no lo arrastra, y
  un enlace escrito a mano tampoco: la persona llegaría a `app.html` sin
  sesión de recuperación y la pantalla le pediría la clave que justamente no
  recuerda. Por eso el salto se hace con `location.replace` pegando
  `search` y `hash` tal como vinieron.

  `replace` y no `href`, para que la flecha de volver no devuelva a esta
  página —que volvería a saltar—. **Y eso NO lo defiende ninguna
  comprobación, a propósito.** Se escribió una, y el mutante que ponía
  `href` en su sitio sobrevivió: medido el 2/11, el navegador trata como
  reemplazo cualquier salto que ocurra mientras la página todavía carga, así
  que aquí las dos formas se comportan igual y el renglón no podía ponerse
  rojo nunca. Un verde que no puede fallar no mide nada, así que se quitó en
  vez de dejarlo de adorno. `replace` se queda porque es lo correcto el día
  que este salto deje de ocurrir durante la carga.
  ===========================================================================
-->
