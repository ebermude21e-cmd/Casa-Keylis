function cardPorQue(tipo, solo){
  const rs = resumenMotivos(tipo);
  const nom = tipo === 'anul' ? 'Por qué anulamos' : 'Por qué nos devuelven';
  let h = '<div class="card"><h2>'+nom+'</h2>';
  if(!rs.length){
    h += '<div class="vacio"><div class="vi">📊</div>Todavía no hay '
      + (tipo === 'anul' ? 'anulaciones' : 'devoluciones')+' registradas.</div></div>';
    return h;
  }
  const tot = rs.reduce((a,x)=>a+x.n, 0), totUsd = rs.reduce((a,x)=>a+x.usd, 0);
  h += '<p class="cap">'+tot+' '+(tot === 1 ? 'caso' : 'casos')+' por USD '+fN(totUsd)+'. '
     + 'El motivo que más pesa es el que primero hay que atacar.</p>';
  h += '<div class="lineas">';
  rs.forEach(x=>{
    const pct = Math.round(x.n / tot * 100);
    h += '<div class="lin"><div class="li"><b>'+esc(x.nom)+'</b>'
      + '<div class="mini">'+esc(x.c)+' · '+x.n+' '+(x.n === 1 ? 'caso' : 'casos')
      + (x.uds ? ' · '+x.uds+' '+(x.uds === 1 ? 'unidad' : 'unidades') : '')+'</div>'
      + '<div class="bar" style="margin:7px 0 0"><div class="bt"><i style="width:'+Math.max(2,pct)+'%"></i></div></div></div>'
      + '<span class="lm">USD '+fN(x.usd)+'<div class="mini" style="text-align:right">'+pct+' %</div></span></div>';
  });
  h += '</div>';
  if(tipo === 'dev'){
    const top = rs[0];
    h += '<div class="nota az"><b>Qué hacer con esto.</b> Si lo que más se repite es «talla equivocada», el problema está '
       + 'en la tabla de tallas que publica. Si es «no era el color o el modelo pedido», está en las fotos. '
       + 'Si es «defecto de fábrica», está en el proveedor. Hoy el que más pesa es <b>'+esc(top.nom)+'</b>.</div>';
  }
  h += '</div>';
  return h;
}

/* ==========================================================================
   SICOM v5 · una sola puerta: el motivo decide si anula o si devuelve
   ==========================================================================
   La cajera nunca elige tratamiento contable. Elige qué pasó.
   El sistema sabe que «error al registrar» anula y «talla equivocada» devuelve,
   y por dentro conserva la diferencia, que es la que hace falta después para
   las estadísticas, las comisiones y la nota de crédito.
   ========================================================================== */

function MOTIVOS_BASE(){ return [
  /* la venta nunca debió existir → anula */
  {c:'AN-01', n:'Error al registrar la venta',        d:'Se cargó el artículo, la talla o la cantidad equivocada.', trato:'anula',    pide:false, activo:true},
  {c:'AN-02', n:'Error en el precio cobrado',         d:'Se cobró de más o de menos y hay que rehacer la venta.',   trato:'anula',    pide:false, activo:true},
  {c:'AN-03', n:'Venta duplicada',                    d:'La misma compra se registró dos veces.',                   trato:'anula',    pide:false, activo:true},
  {c:'AN-04', n:'El cliente desistió',                d:'Se arrepintió antes de llevarse la mercancía.',            trato:'anula',    pide:false, activo:true},
  {c:'AN-05', n:'El pago no se confirmó',             d:'El pago móvil o la transferencia nunca entró.',            trato:'anula',    pide:false, activo:true},
  {c:'AN-06', n:'Prueba del sistema',                 d:'Venta de ensayo, no es una operación real.',               trato:'anula',    pide:false, activo:true},
  {c:'AN-99', n:'Otro caso de venta mal registrada',  d:'Hay que explicarlo por escrito.',                          trato:'anula',    pide:true,  activo:true},
  /* la venta fue buena y la mercancía volvió → devuelve */
  {c:'DV-01', n:'Talla equivocada',                   d:'No le sirvió la talla que se llevó.',                      trato:'devuelve', pide:false, activo:true},
  {c:'DV-02', n:'Defecto de fábrica',                 d:'Costura, cierre, herraje o material en mal estado.',       trato:'devuelve', pide:false, activo:true},
  {c:'DV-03', n:'No era el color o el modelo pedido', d:'Llegó distinto a lo que encargó.',                         trato:'devuelve', pide:false, activo:true},
  {c:'DV-04', n:'No le gustó al verlo',               d:'Compró por foto y en persona cambió de opinión.',          trato:'devuelve', pide:false, activo:true},
  {c:'DV-05', n:'Llegó dañado en el traslado',        d:'Se estropeó en el delivery.',                              trato:'devuelve', pide:false, activo:true},
  {c:'DV-06', n:'Cambio por otro artículo',           d:'Devuelve este para llevarse otro.',                        trato:'devuelve', pide:false, activo:true},
  {c:'DV-07', n:'Entrega fuera de tiempo',            d:'Llegó tarde y ya no lo necesitaba.',                        trato:'devuelve', pide:false, activo:true},
  {c:'DV-99', n:'Otro motivo de devolución',          d:'Hay que explicarlo por escrito.',                          trato:'devuelve', pide:true,  activo:true}
]; }

/* migración: las dos listas viejas pasan a una, conservando los códigos
   para que las operaciones ya registradas sigan resolviendo su motivo */
function unificaMotivos(b){
  if(b.cfg.motivos && b.cfg.motivos.length) return;
  const out = [];
  (b.cfg.motAnul || []).forEach(m=>out.push({...m, trato:'anula'}));
  (b.cfg.motDev  || []).forEach(m=>out.push({...m, trato:'devuelve'}));
  b.cfg.motivos = out.length ? out : MOTIVOS_BASE();
}

/* ---------- la lista unificada, y los mismos nombres de antes ---------- */
function motivos(){ return DB.cfg.motivos || []; }
function motUni(cod){ return motivos().find(m=>m.c === cod) || null; }
function motActivosU(){ return motivos().filter(m=>m.activo); }
function motLista(tipo){
  if(tipo === 'anul') return motivos().filter(m=>m.trato === 'anula');
  if(tipo === 'dev')  return motivos().filter(m=>m.trato === 'devuelve');
  return motivos();
}
function motActivos(tipo){ return motLista(tipo).filter(m=>m.activo); }
function motDe(tipo, cod){ return motUni(cod); }
function motUsado(tipo, cod){
  if(DB.ventas.some(v=>v.anulada && v.anulada.motivoC === cod)) return true;
  return DB.ventas.some(v=>(v.devuelto||[]).some(d=>d.motivoC === cod));
}
function motProxCod(trato){
  const pre = trato === 'anula' ? 'AN-' : 'DV-';
  const ns = motivos().filter(m=>String(m.c).startsWith(pre))
    .map(m=>parseInt(String(m.c).replace(pre,''), 10))
    .filter(n=>isFinite(n) && n < 90);
  const n = (ns.length ? Math.max.apply(null, ns) : 0) + 1;
  return pre + String(n).padStart(2, '0');
}
function tratoDe(cod){ const m = motUni(cod); return m ? m.trato : 'devuelve'; }
function anulaCon(cod){ return tratoDe(cod) === 'anula'; }

function valMotivo(tipo, cod, det){
  if(!cod) return {ok:false, msg:'Elija el motivo de la lista.'};
  const m = motUni(cod);
  if(!m) return {ok:false, msg:'Ese motivo ya no existe en la lista.'};
  if(!m.activo) return {ok:false, msg:'Ese motivo está desactivado. Elija otro.'};
  if(m.pide && String(det||'').trim().length < 10)
    return {ok:false, msg:'Con «'+m.n+'» hay que explicar por escrito qué pasó.'};
  return {ok:true, msg:''};
}
function motTexto(tipo, cod, det){
  const m = motUni(cod);
  const base = m ? m.n : (cod || 'Sin motivo');
  const d = String(det || '').trim();
  return d ? base + ' · ' + d : base;
}

/* ---------- el plazo para devolver ---------- */
function plazoDias(){ const n = +((DB.cfg||{}).diasDev); return isFinite(n) && n > 0 ? n : 15; }
function diasDesde(v){ return dias(v.fecha); }
function dentroPlazo(v){ return diasDesde(v) <= plazoDias(); }

/* ---------- las compras que un cliente puede devolver ---------- */
function comprasDe(cliId){
  return DB.ventas.filter(v=>v.cliId === cliId && !anulada(v))
    .filter(v=>v.lineas.some((l,i)=>l.cant - devueltasDe(v, i) > 0))
    .sort((a,b)=> b.fecha === a.fecha
      ? String(b.hora).localeCompare(String(a.hora))
      : b.fecha.localeCompare(a.fecha));
}
/* unidades que todavía se pueden devolver de una venta */
function porDevolver(v){
  return v.lineas.reduce((a,l,i)=>a + (l.cant - devueltasDe(v, i)), 0);
}
/* ¿esta operación necesita la firma del administrador? */
function pideClave(v, cod){
  if(!v) return false;
  if(anulaCon(cod)) return true;      // dejar una venta sin efecto nunca es rutina
  if(!dentroPlazo(v)) return true;    // fuera del plazo es una excepción, no la norma
  return false;
}
function razonClave(v, cod){
  if(anulaCon(cod)) return 'Va a dejar la venta sin efecto: eso lo autoriza el administrador.';
  if(!dentroPlazo(v)) return 'Pasaron ' + diasDesde(v) + ' días y el plazo es de ' + plazoDias()
    + ': fuera de plazo lo autoriza el administrador.';
  return '';
}

let RV = null;
function nuevaRV(){
  RV = {doc:'', cliId:null, buscado:false, num:null, items:null, cod:'', det:'', clave:''};
}

function rvCliente(){
  if(!RV.cliId) return null;
  return DB.clientes.find(c=>c.id === RV.cliId) || null;
}
function rvVenta(){
  if(!RV.num) return null;
  return DB.ventas.find(v=>v.num === RV.num) || null;
}
function rvTotal(){
  const v = rvVenta(); if(!v || !RV.items) return 0;
  let t = 0;
  v.lineas.forEach((l,i)=>{ t += (RV.items[i] || 0) * l.precio; });
  return Math.round(t * 100) / 100;
}
/* con un motivo que anula, regresa la venta entera: no se negocia */
function rvSincroniza(){
  const v = rvVenta(); if(!v) return;
  if(!RV.items) RV.items = v.lineas.map(()=>0);
  if(anulaCon(RV.cod)) RV.items = v.lineas.map((l,i)=>l.cant - devueltasDe(v, i));
}

function rvBusca(){
  const d = (RV.doc || '').replace(/\D/g, '');
  if(!valDoc(d)){ RV.cliId = null; RV.buscado = false; RV.num = null; RV.items = null; return; }
  const c = DB.clientes.find(x=>x.doc === d);
  const antes = RV.cliId;
  RV.cliId = c ? c.id : null;
  RV.buscado = true;
  if(RV.cliId !== antes){ RV.num = null; RV.items = null; RV.cod = ''; RV.det = ''; RV.clave = ''; }
  if(c && c.id !== antes) aviso('Compras de ' + nomComp(c));
}

document.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;

  if(b.dataset.rvir){
    const v = DB.ventas.find(x=>x.num === b.dataset.rvir); if(!v) return;
    const c = DB.clientes.find(x=>x.id === v.cliId);
    nuevaRV();
    if(c){ RV.doc = c.doc; RV.cliId = c.id; RV.buscado = true; RV.num = v.num; }
    TAB = 'dev'; DSUB = 'dvr'; pinta(); window.scrollTo(0, 0);
    if(!c) aviso('Esa venta no tiene cliente registrado.', true);
    return;
  }
  if(b.id === 'rv_otro'){ nuevaRV(); pinta(); return; }
  if(b.id === 'rv_can'){ RV.num = null; RV.items = null; RV.cod = ''; RV.det = ''; RV.clave = ''; pinta(); return; }
  if(b.dataset.rvsel){
    RV.num = (RV.num === b.dataset.rvsel) ? null : b.dataset.rvsel;
    RV.items = null; RV.cod = ''; RV.det = ''; RV.clave = '';
    pinta(); window.scrollTo(0, document.body.scrollHeight); return;
  }
  if(b.dataset.rvp !== undefined && b.dataset.rvp !== ''){
    const v = rvVenta(); if(!v) return;
    const i = +b.dataset.rvp, max = v.lineas[i].cant - devueltasDe(v, i);
    if(!RV.items) RV.items = v.lineas.map(()=>0);
    if(RV.items[i] < max) RV.items[i]++;
    pinta(); return;
  }
  if(b.dataset.rvm !== undefined && b.dataset.rvm !== ''){
    const i = +b.dataset.rvm;
    if(RV.items && RV.items[i] > 0) RV.items[i]--;
    pinta(); return;
  }
  if(b.id === 'rv_g'){ rvEjecuta(); return; }

  /* ------------ configuración: plazo y motivos unificados ------------ */
  if(b.id === 'pl_g'){
    const n = Math.round(pila($('#pl_d').value));
    if(!(n > 0)) return aviso('El plazo tiene que ser de al menos un día.', true);
    if(n > 365) return aviso('Un plazo mayor a un año no es un plazo.', true);
    const antes = plazoDias();
    DB.cfg.diasDev = n;
    bitacora('cfg','Plazo de devolución cambiado', antes + ' → ' + n + ' días');
    aviso('El plazo quedó en ' + n + ' días.'); pinta(); return;
  }
  if(b.id === 'mo_g'){
    const n = ($('#mo_n').value || '').trim(), d = ($('#mo_d').value || '').trim(), tr = $('#mo_t').value;
    if(n.length < 4) return aviso('Escriba el motivo: al menos cuatro letras.', true);
    if(motivos().some(m=>m.n.toLowerCase() === n.toLowerCase()))
      return aviso('Ese motivo ya está en la lista.', true);
    const c = motProxCod(tr);
    motivos().push({c:c, n:n, d:d, trato:tr, pide:false, activo:true});
    bitacora('cfg','Motivo agregado', c + ' · ' + n + ' · ' + (tr === 'anula' ? 'anula la venta' : 'devuelve mercancía'));
    aviso('Motivo ' + c + ' agregado.'); pinta(); return;
  }
  if(b.dataset.motog){
    const m = motUni(b.dataset.motog); if(!m) return;
    if(m.activo && motActivos(m.trato === 'anula' ? 'anul' : 'dev').length === 1)
      return aviso('Es el último motivo activo de ese tipo: sin ninguno no se podría registrar el caso.', true);
    m.activo = !m.activo;
    bitacora('cfg', m.activo ? 'Motivo reactivado' : 'Motivo desactivado', m.c + ' · ' + m.n);
    aviso(m.activo ? 'Motivo reactivado.' : 'Motivo desactivado: deja de ofrecerse.');
    pinta(); return;
  }
  if(b.dataset.motdel){
    const cod = b.dataset.motdel;
    if(/-99$/.test(cod)) return aviso('Ese motivo no se elimina: es la salida para lo que no estaba previsto.', true);
    if(motUsado(null, cod)) return aviso('Ese motivo ya se usó: desactívelo en lugar de borrarlo.', true);
    const m = motUni(cod); if(!m) return;
    DB.cfg.motivos = motivos().filter(x=>x.c !== cod);
    bitacora('cfg','Motivo eliminado', cod + ' · ' + m.n);
    aviso('Motivo eliminado.'); pinta(); return;
  }
});

document.addEventListener('input', e=>{

/* ==========================================================================
   SICOM v6 · el módulo se abre en tres: registrar, devoluciones, anulaciones
   ==========================================================================
   El registro sigue siendo una sola puerta —la cajera dice qué pasó y el
   sistema decide—. Lo que se separa es la consulta, porque son dos preguntas
   distintas: las devoluciones hablan del producto, las anulaciones de la
   operación.
   ========================================================================== */
let DSUB = 'dvr';

/* ---------- todas las devoluciones, con su venta al lado ---------- */
function devTodas(){
  const out = [];
  DB.ventas.forEach(v=>(v.devuelto||[]).forEach((d,i)=>out.push({v:v, d:d, i:i})));
  return out.sort((a,b)=> b.d.fecha === a.d.fecha
    ? String(b.d.hora).localeCompare(String(a.d.hora))
    : b.d.fecha.localeCompare(a.d.fecha));
}

/* ==================================================== DEVOLUCIONES ======= */
function histDevoluciones(){
  const ls = devTodas(), pend = pendDev(), t = tasaVigente();
  const usd = ls.reduce((a,x)=>a+x.d.usd, 0);
  const uds = ls.reduce((a,x)=>a+x.d.lineas.reduce((b,l)=>b+l.cant, 0), 0);
  const vendido = DB.ventas.filter(v=>!anulada(v)).reduce((a,v)=>a+v.total, 0);

  let h = '<div class="hero">'
    + '<div class="h dest"><span class="k">Mercancía devuelta</span><span class="v">'+fN(usd)+' <small>USD</small></span>'
    + '<span class="s">'+ls.length+' '+(ls.length === 1 ? 'devolución' : 'devoluciones')+' · '+uds+' '+(uds === 1 ? 'unidad' : 'unidades')+'</span></div>'
    + '<div class="h"><span class="k">Sobre lo vendido</span><span class="v">'
    + (vendido > 0 ? fN(usd/vendido*100, 1) : '0,0')+' <small>%</small></span>'
    + '<span class="s">de USD '+fN(vendido)+' facturados</span></div>'
    + '<div class="h"><span class="k">Por pagarle al cliente</span><span class="v">'+pend.length+'</span>'
    + '<span class="s">USD '+fN(pend.reduce((a,p)=>a+p.saldo, 0))+' esperando en tesorería</span></div>'
    + '<div class="h"><span class="k">Artículo que más regresa</span><span class="v" style="font-size:19px;line-height:1.25">'
    + esc(artQueMasRegresa() || '—')+'</span><span class="s">por unidades devueltas</span></div></div>';

  if(pend.length) h += '<div class="card" style="margin-top:18px"><div class="nota rj" style="margin:0">'
    + '<b>Hay '+pend.length+' '+(pend.length === 1 ? 'devolución' : 'devoluciones')+' sin pagar</b>, por USD <b>'
    + fN(pend.reduce((a,p)=>a+p.saldo, 0))+'</b>. Ese dinero es del cliente y bloquea el cierre de caja hasta que se le entregue.</div>'
    + '<div class="acc"><button class="b oro" data-goto="tes|vueltos">Ir a pagarlas →</button></div></div>';

  h += '<div class="card" style="margin-top:18px"><h2>Todas las devoluciones</h2>';
  if(!ls.length){
    h += '<div class="vacio"><div class="vi">↩</div>Todavía no le han devuelto nada.</div></div>';
    return h + cardPorQue('dev');
  }
  h += '<table class="dat"><thead><tr><th>Cuándo</th><th>Venta</th><th>Cliente</th><th>Qué regresó</th>'
     + '<th>Por qué</th><th class="n">USD</th><th>Estado</th><th></th></tr></thead><tbody>';
  ls.slice(0, 80).forEach(x=>{
    const c = DB.clientes.find(y=>y.id === x.v.cliId) || {nom:'—', ape:''};
    const p = DB.vpend.find(y=>y.id === x.d.pendId);
    const sinPagar = p && p.saldo > 0.005 && !p.anulado;
    h += '<tr><td><b>'+fFecha(x.d.fecha)+'</b><div class="mini">'+esc(x.d.hora||'')+'</div></td>'
      + '<td><b>'+esc(x.v.num)+'</b><div class="mini">del '+fFecha(x.v.fecha)+'</div></td>'
      + '<td>'+esc(nomComp(c))+'</td>'
      + '<td class="mini">'+x.d.lineas.map(l=>l.cant+'× '+esc(l.nom)+(l.talla ? ' '+esc(l.talla) : '')).join('<br>')+'</td>'
      + '<td class="mini"><b>'+esc(x.d.motivoC||'')+'</b> · '+esc((motUni(x.d.motivoC)||{}).n || x.d.motivo)
      + (x.d.detalle ? '<div class="mini">'+esc(x.d.detalle)+'</div>' : '')+'</td>'
      + '<td class="n"><b>'+fN(x.d.usd)+'</b>'+(t ? '<div class="mini">Bs '+fN(x.d.usd*t.bcv, 0)+'</div>' : '')+'</td>'
      + '<td>'+(sinPagar ? '<span class="chip avi">por pagar</span>' : '<span class="chip ok">pagada</span>')+'</td>'
      + '<td class="n"><button class="b sm gh" data-rvir="'+esc(x.v.num)+'">Ver la orden</button></td></tr>';
  });
  h += '</tbody></table>';
  if(ls.length > 80) h += '<div class="nota">Se muestran las 80 más recientes de '+ls.length+'.</div>';
  h += '<div class="nota">La venta de una devolución sigue siendo válida: el vendedor la hizo y cuenta para su comisión. '
     + 'Lo devuelto se descuenta del neto, no borra la operación.</div></div>';

  return h + cardPorQue('dev');
}

function artQueMasRegresa(){
  const c = {};
  DB.ventas.forEach(v=>(v.devuelto||[]).forEach(d=>d.lineas.forEach(l=>{
    c[l.nom] = (c[l.nom] || 0) + l.cant;
  })));
  const ls = Object.keys(c).sort((a,b)=>c[b] - c[a]);
  return ls.length ? ls[0] : null;
}

/* ===================================================== ANULACIONES ======= */
function histAnulaciones(){
  const ls = DB.ventas.filter(anulada)
    .sort((a,b)=> b.anulada.fecha === a.anulada.fecha
      ? String(b.anulada.hora).localeCompare(String(a.anulada.hora))
      : b.anulada.fecha.localeCompare(a.anulada.fecha));
  const usd = ls.reduce((a,v)=>a+v.total, 0);
  const conCierre = ls.filter(v=>v.anulada.cierre);
  const rs = resumenMotivos('anul');
  const emitidas = DB.ventas.length;

  let h = '<div class="hero">'
    + '<div class="h dest"><span class="k">Ventas anuladas</span><span class="v">'+ls.length+'</span>'
    + '<span class="s">USD '+fN(usd)+' dejados sin efecto</span></div>'
    + '<div class="h"><span class="k">Sobre lo registrado</span><span class="v">'
    + (emitidas > 0 ? fN(ls.length/emitidas*100, 1) : '0,0')+' <small>%</small></span>'
    + '<span class="s">de '+emitidas+' ventas registradas</span></div>'
    + '<div class="h'+(conCierre.length ? '' : '')+'"><span class="k">Sobre cierres firmados</span><span class="v">'+conCierre.length+'</span>'
    + '<span class="s">'+(conCierre.length ? '<b style="color:var(--mal)">esos arqueos ya no cuadran</b>' : 'ninguna tocó un cierre')+'</span></div>'
    + '<div class="h"><span class="k">Motivo más frecuente</span><span class="v" style="font-size:19px;line-height:1.25">'
    + esc(rs.length ? rs[0].nom : '—')+'</span><span class="s">'+(rs.length ? rs[0].n+' de '+ls.length+' casos' : 'sin datos')+'</span></div></div>';

  if(conCierre.length) h += '<div class="card" style="margin-top:18px"><div class="nota rj" style="margin:0">'
    + '<b>'+conCierre.length+' '+(conCierre.length === 1 ? 'anulación cayó' : 'anulaciones cayeron')+' sobre '
    + (conCierre.length === 1 ? 'un cierre' : 'cierres')+' de caja ya firmado'+(conCierre.length === 1 ? '' : 's')+'.</b> '
    + 'El arqueo que se contó esos días sigue siendo el que se contó; lo que cambió es lo que debió haber. '
    + 'La diferencia acumulada es de USD <b>'+fN(conCierre.reduce((a,v)=>a+v.total, 0))+'</b>. '
    + 'Si esto se repite, el problema no son las anulaciones: es que se está cerrando la caja antes de tiempo.</div></div>';

  h += '<div class="card" style="margin-top:18px"><h2>Todas las anulaciones</h2>';
  if(!ls.length){
    h += '<div class="vacio"><div class="vi">✓</div>No se ha anulado ninguna venta.</div></div>';
    return h + cardPorQue('anul');
  }
  h += '<table class="dat"><thead><tr><th>Venta</th><th>Era del</th><th>Anulada el</th><th>Quién</th>'
     + '<th>Por qué</th><th class="n">USD</th><th>Cierre</th><th></th></tr></thead><tbody>';
  ls.slice(0, 80).forEach(v=>{
    const a = v.anulada, c = DB.clientes.find(y=>y.id === v.cliId) || {nom:'—', ape:''};
    h += '<tr><td><b>'+esc(v.num)+'</b><div class="mini">'+esc(nomComp(c))+'</div></td>'
      + '<td class="mini">'+fFecha(v.fecha)+'</td>'
      + '<td class="mini">'+fFecha(a.fecha)+'<div class="mini">'+esc(a.hora||'')+'</div></td>'
      + '<td class="mini">'+esc(a.por||'—')+'</td>'
      + '<td class="mini"><b>'+esc(a.motivoC||'')+'</b> · '+esc((motUni(a.motivoC)||{}).n || a.motivo)
      + (a.detalle ? '<div class="mini">'+esc(a.detalle)+'</div>' : '')+'</td>'
      + '<td class="n"><b>'+fN(v.total)+'</b></td>'
      + '<td>'+(a.cierre ? '<span class="chip mal">afectó el del '+fFecha(a.cierre)+'</span>'
                         : '<span class="chip">día abierto</span>')+'</td>'
      + '<td class="n"><button class="b sm gh" data-rvir="'+esc(v.num)+'">Ver la orden</button></td></tr>';
  });
  h += '</tbody></table>';
  if(ls.length > 80) h += '<div class="nota">Se muestran las 80 más recientes de '+ls.length+'.</div>';
  h += '<div class="nota">Ninguna venta anulada se borra. Esta es la tabla que hay que poder mostrar cuando alguien '
     + 'pregunte por qué el correlativo tiene huecos.</div></div>';

  return h + cardPorQue('anul');
}

/* ==========================================================================
   SICOM v6 · eventos del módulo abierto en tres
   ========================================================================== */
document.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.dsub){
    const antes = DSUB; DSUB = b.dataset.dsub;
    /* al saltar entre Devolver y Anular se conserva la cédula, pero la orden
       y la causa se limpian: son operaciones distintas, no la misma a medias */
    if(antes !== DSUB && (antes === 'dvr' || antes === 'anl') && (DSUB === 'dvr' || DSUB === 'anl')){
      RV.num = null; RV.items = null; RV.cod = ''; RV.det = ''; RV.clave = '';
    }
    pinta(); window.scrollTo(0, 0); return;
  }
  if(b.dataset.irdev){ TAB = 'dev'; DSUB = b.dataset.irdev; pinta(); window.scrollTo(0, 0); return; }
});

/* ==========================================================================
   SICOM v7 · dos caminos separados: Devolver y Anular
   ==========================================================================
   Devolver: cédula → orden → productos → causa.
   Anular:   cédula → orden → causa.
   Cada uno con sus propias causas. Si alguien entra por la puerta equivocada,
   el sistema no lo tranca: le ofrece cruzar sin perder lo que ya escribió.
   ========================================================================== */

function esDevolver(){ return DSUB === 'dvr'; }
function esAnular(){ return DSUB === 'anl'; }

/* las compras que se pueden tocar, según el camino */
function comprasPara(cliId, modo){
  const ls = DB.ventas.filter(v=>v.cliId === cliId && !anulada(v));
  const out = modo === 'anular'
    ? ls
    : ls.filter(v=>v.lineas.some((l,i)=>l.cant - devueltasDe(v, i) > 0));
  return out.sort((a,b)=> b.fecha === a.fecha
    ? String(b.hora).localeCompare(String(a.hora))
    : b.fecha.localeCompare(a.fecha));
}

/* ========================================================================== */
function vistaDevMod(){
  const np = pendDev().length, na = DB.ventas.filter(anulada).length;
  const nd = DB.ventas.reduce((a,v)=>a+(v.devuelto||[]).length, 0);
  let h = '<h1>Devoluciones y anulaciones</h1>'
    + '<p class="sub">Dos cosas distintas, cada una por su lado. <b>Devolver</b> es cuando la venta estuvo bien y la '
    + 'mercancía regresó. <b>Anular</b> es cuando la venta nunca debió existir. Las dos últimas pestañas son para consultar.</p>'
    + '<div class="subtabs">'
    + '<button data-dsub="dvr" class="'+(DSUB === 'dvr' ? 'on' : '')+'">↩ Devolver</button>'
    + '<button data-dsub="anl" class="'+(DSUB === 'anl' ? 'on' : '')+'">✕ Anular</button>'
    + '<span class="sepsub"></span>'
    + '<button data-dsub="dev" class="'+(DSUB === 'dev' ? 'on' : '')+'">Devoluciones'+(nd ? ' ('+nd+')' : '')
    + (np ? ' · '+np+' por pagar' : '')+'</button>'
    + '<button data-dsub="anu" class="'+(DSUB === 'anu' ? 'on' : '')+'">Anulaciones'+(na ? ' ('+na+')' : '')+'</button>'
    + '</div>';
  if(DSUB === 'dev') return h + histDevoluciones();
  if(DSUB === 'anu') return h + histAnulaciones();
  if(DSUB === 'anl') return h + flujoAnular();
  return h + flujoDevolver();
}

/* ============================================== 1 · quién, en los dos ===== */
function rvPasoCedula(){
  const c = rvCliente(), modo = esAnular() ? 'anular' : 'devolver';
  let h = '<div class="card"><h2>'+(esAnular() ? '¿De quién es la venta?' : '¿Quién devuelve?')+'</h2>'
    + '<p class="cap">'+(esAnular()
        ? 'La cédula del comprador de la venta que se va a dejar sin efecto.'
        : 'La cédula del comprador. Solo se puede devolver contra una compra registrada a su nombre.')+'</p>'
    + '<div class="fila"><div style="flex:0 1 280px"><label class="f">Cédula</label>'
    + '<input id="rv_doc" value="'+esc(RV.doc)+'" inputmode="numeric" maxlength="9" autocomplete="off" '
    + 'placeholder="Escriba la cédula"'+(RV.doc ? ' class="'+(valDoc(RV.doc) ? 'bien' : 'mal')+'"' : '')+'></div>';
  if(RV.doc && !valDoc(RV.doc))
    h += '<div style="align-self:flex-end"><div class="err" style="margin:0 0 12px">La cédula lleva entre 6 y 9 dígitos.</div></div>';
  h += '</div>';

  if(valDoc(RV.doc) && RV.buscado && !c)
    h += '<div class="nota rj" style="margin-top:14px"><b>No hay ningún cliente con esa cédula.</b> '
       + 'Si la compra se hizo a nombre de otra persona, busque con esa cédula.</div>';

  if(c){
    const cs = comprasPara(c.id, modo);
    h += '<div class="hallado" style="margin-top:14px"><span class="av">'+esc(ini(c))+'</span>'
      + '<div style="flex:1"><b>'+esc(nomComp(c))+'</b>'
      + '<div class="mini" style="margin-top:4px">V-'+esc(c.doc)+' · '+esc(telComp(c))+' · '+esc(c.mail||'sin correo')+'</div>'
      + '<div class="mini">'+cs.length+' '+(cs.length === 1 ? 'orden' : 'órdenes')+' '
      + (esAnular() ? 'que se pueden anular' : 'con artículos por devolver')+'</div></div>'
      + '<button class="b sm gh" id="rv_otro">Otra cédula</button></div>';
  }
  h += '</div>';
  return h;
}

/* ============================================ 2 · cuál orden, en los dos == */
function rvPasoOrdenes(){
  const c = rvCliente(), modo = esAnular() ? 'anular' : 'devolver';
  const cs = comprasPara(c.id, modo);
  let h = '<div class="card"><h2>¿Cuál orden?</h2>';

  if(esAnular()){
    h += '<p class="cap">Elija el número de orden que se va a dejar sin efecto. Se anula completa: no hay anulación a medias.</p>';
  }else{
    h += '<p class="cap">Elija el número de orden de la compra. El plazo para devolver es de <b>'+plazoDias()+' días</b>; '
       + 'lo que esté fuera sigue apareciendo, pero lo autoriza el administrador.</p>';
  }

  if(!cs.length){
    h += '<div class="vacio"><div class="vi">🧾</div>'+esc(c.nom)
       + (esAnular() ? ' no tiene órdenes que se puedan anular.' : ' no tiene compras con artículos por devolver.')
       + '</div></div>';
    return h;
  }

  h += '<div class="ordenes">';
  cs.forEach(v=>{
    const d = diasDesde(v), sel = RV.num === v.num;
    const bloq = esAnular() ? puedeAnular(v) : '';
    const fuera = !esAnular() && !dentroPlazo(v);
    h += '<button class="orden'+(sel ? ' on' : '')+(bloq ? ' no' : '')+'" data-rvsel="'+esc(v.num)+'"'
      + (bloq ? ' disabled' : '')+'>'
      + '<span class="onum">'+esc(v.num)+'</span>'
      + '<span class="oinf"><b>'+fFecha(v.fecha)+'</b> · '+(d === 0 ? 'hoy' : 'hace '+d+' '+(d === 1 ? 'día' : 'días'))
      + ' · '+esc(v.canal||'')+'<span class="omini">'
      + (esAnular()
          ? v.lineas.reduce((a,l)=>a+l.cant, 0)+' '+(v.lineas.reduce((a,l)=>a+l.cant, 0) === 1 ? 'artículo' : 'artículos')
            +' · '+v.lineas.map(l=>esc(l.nom)).slice(0,3).join(' · ')
          : porDevolver(v)+' '+(porDevolver(v) === 1 ? 'unidad' : 'unidades')+' por devolver · '
            +v.lineas.filter((l,i)=>l.cant - devueltasDe(v,i) > 0).map(l=>esc(l.nom)).slice(0,3).join(' · '))
      + '</span></span>'
      + '<span class="omonto">USD '+fN(v.total)+'</span>'
      + '<span class="oest">'+(bloq ? '<span class="chip mal">tiene devoluciones</span>'
          : fuera ? '<span class="chip avi">fuera de plazo</span>'
          : sel ? '<span class="chip ok">elegida</span>' : '<span class="chip">elegir</span>')+'</span>'
      + '</button>';
  });
  h += '</div>';
  if(cs.some(v=>esAnular() && puedeAnular(v)))
    h += '<div class="nota">Una orden con devoluciones ya registradas no se puede anular: el inventario quedaría descuadrado. '
       + 'Registre el resto como devolución.</div>';
  h += '</div>';
  return h;
}

/* ================================= 3a · DEVOLVER: productos y causa ======= */
function flujoDevolver(){
  if(!RV) nuevaRV();
  let h = '<div class="nota az" style="margin:0 0 18px"><b>La clienta trajo mercancía de vuelta.</b> '
    + 'La venta sigue siendo válida y el vendedor la hizo; solo se descuenta lo que regresó. '
    + 'Si lo que pasó es que la venta se registró mal, eso no se devuelve: se anula.</div>';
  h += rvPasoCedula();
  if(!RV.cliId) return h;
  h += rvPasoOrdenes();
  if(!RV.num) return h;

  const v = rvVenta(); if(!v) return h;
  if(!RV.items) RV.items = v.lineas.map(()=>0);
  const t = tasaVigente(), usd = rvTotal();
  const m = motUni(RV.cod);
  const fuera = !dentroPlazo(v);

  h += '<div class="card editando"><h2>¿Qué artículos regresan de la orden '+esc(v.num)+'?</h2>'
     + '<p class="cap">Marque cuántas unidades vuelven de cada artículo. Puede ser una parte de la compra.</p>'
     + '<div class="lineas">';
  v.lineas.forEach((l,i)=>{
    const ya = devueltasDe(v, i), max = l.cant - ya, n = RV.items[i] || 0;
    h += '<div class="lin"><div class="li"><b>'+esc(l.nom)+(l.talla ? ' · '+esc(l.talla) : '')+'</b>'
      + '<div class="mini">USD '+fN(l.precio)+' c/u · se llevó '+l.cant
      + (ya ? ' · ya devolvió '+ya : '')+(max <= 0 ? ' · <b>nada más por devolver</b>' : '')+'</div></div>'
      + '<button class="b sm gh" data-rvm="'+i+'"'+(n <= 0 ? ' disabled' : '')+'>−</button>'
      + '<b style="min-width:20px;text-align:center">'+n+'</b>'
      + '<button class="b sm gh" data-rvp="'+i+'"'+(n >= max ? ' disabled' : '')+'>+</button>'
      + '<span class="lm">'+fN(n*l.precio)+'</span></div>';
  });
  h += '</div>';

  h += '<div class="visor"><span class="vk">Se le devuelve</span><div class="vn">USD '+fN(usd)+'</div>'
     + (t ? '<span class="veq">Bs '+fN(usd*t.bcv)+' a la tasa de hoy · '+fN(t.bcv,2)+'</span>'
          : '<span class="veq">Sin tasa confirmada</span>')+'</div>';
  h += '<div class="nota az" style="margin-top:14px"><b>Por qué en dólares.</b> La compra se pactó en dólares, así que '
     + 'eso es lo que se le devuelve. Si se le paga en bolívares, se calcula a la tasa de hoy, no a la del día de la '
     + 'compra: es lo que le cuesta a ella reponer la prenda hoy.</div>';

  h += '<div class="fila" style="margin-top:16px">'
     + '<div><label class="f">Causa de la devolución</label>'
     + '<select id="rv_mot"><option value="">Elija la causa</option>'
     + motActivos('dev').map(x=>'<option value="'+esc(x.c)+'"'+(x.c === RV.cod ? ' selected' : '')+'>'
         + esc(x.n)+'</option>').join('')+'</select>'
     + '<div class="ayuda" id="rv_motayuda">'+(m ? esc(m.d) : 'De la lista, para que después se pueda contar.')+'</div></div>'
     + '<div style="flex:2 1 320px"><label class="f">Detalle'+(m && m.pide ? '' : ' (opcional)')+'</label>'
     + '<input id="rv_det" value="'+esc(RV.det)+'" maxlength="140" placeholder="'
     + (m && m.pide ? 'Obligatorio: explique qué pasó' : 'Opcional: agregue el detalle si hace falta')+'"></div>'
     + '</div>';

  if(fuera){
    if(!hayClave()){
      h += '<div class="nota rj" style="margin-top:16px"><b>Esta compra está fuera de plazo</b> —pasaron '+diasDesde(v)
         + ' días y el plazo es de '+plazoDias()+'— y no hay clave de administrador definida.</div>'
         + '<div class="acc"><button class="b oro" data-goto="ger|seg">Ir a definir la clave →</button></div></div>';
      return h;
    }
    h += '<div style="margin-top:16px"><label class="f">Clave de administrador</label>'
       + '<input id="rv_cla" type="password" value="'+esc(RV.clave)+'" maxlength="40" autocomplete="off" '
       + 'placeholder="Escriba la clave"><div class="ayuda">Pasaron '+diasDesde(v)+' días y el plazo es de '
       + plazoDias()+': fuera de plazo lo autoriza el administrador.</div></div>';
  }

  const listo = !!m && usd > 0.005;
  h += '<div class="acc"><button class="b oro" id="rv_g"'+(listo ? '' : ' disabled')+'>'
     + (usd < 0.005 ? 'Marque qué artículos regresan'
        : !m ? 'Elija la causa de la devolución'
        : 'Registrar la devolución de USD '+fN(usd))+'</button>'
     + '<button class="b gh" id="rv_can">← Elegir otra orden</button>'
     + '<button class="b gh" data-cruza="anl">Esto no es devolución, es anulación →</button></div></div>';
  return h;
}

/* ==================================== 3b · ANULAR: solo la causa ========== */
function flujoAnular(){
  if(!RV) nuevaRV();
  let h = '<div class="nota rj" style="margin:0 0 18px"><b>La venta nunca debió existir.</b> '
    + 'Anular la deja sin efecto: la mercancía vuelve completa al inventario y el cliente pierde esa compra de su '
    + 'historial. Si lo que pasó es que la clienta trajo mercancía de vuelta, eso no se anula: se devuelve.</div>';
  h += rvPasoCedula();
  if(!RV.cliId) return h;
  h += rvPasoOrdenes();
  if(!RV.num) return h;

  const v = rvVenta(); if(!v) return h;
  const c = rvCliente(), m = motUni(RV.cod);
  const cie = DB.cierres.find(x=>x.fecha === v.fecha);
  const vp = DB.vpend.filter(x=>x.venta === v.num && !x.anulado);
  const entregado = vp.reduce((a,x)=>a+(x.usd-x.saldo), 0);

  h += '<div class="card editando"><h2>¿Por qué se anula la orden '+esc(v.num)+'?</h2>'
     + '<p class="cap">La orden se anula completa, por USD '+fN(v.total)+'. Elija la causa.</p>';

  h += '<div class="lineas">'
     + '<div class="lin"><div class="li"><b>Vuelven al inventario</b><div class="mini">'
     + v.lineas.map(l=>l.cant+'× '+esc(l.nom)+(l.talla ? ' '+esc(l.talla) : '')).join(' · ')
     + '</div></div><span class="lm">'+v.lineas.reduce((a,l)=>a+l.cant, 0)+' und</span></div>'
     + '<div class="lin"><div class="li"><b>'+esc(nomComp(c))+' deja de acumular</b>'
     + '<div class="mini">una compra menos y USD '+fN(v.total)+' menos en su historial</div></div>'
     + '<span class="lm">−'+fN(v.total)+'</span></div>';
  if(DB.accionista.some(x=>x.venta === v.num))
    h += '<div class="lin"><div class="li"><b>Se revierte el movimiento del accionista</b>'
       + '<div class="mini">con un asiento contrario, no borrando el original</div></div></div>';
  if(vp.length)
    h += '<div class="lin"><div class="li"><b>Se cancela el vuelto pendiente</b><div class="mini">'
       + 'USD '+fN(vp.reduce((a,x)=>a+x.saldo, 0))+' que todavía no se le había entregado</div></div></div>';
  h += '</div>';

  if(cie) h += '<div class="nota rj" style="margin-top:14px"><b>Ojo: el '+fFecha(v.fecha)+' ya tiene cierre de caja '
     + 'firmado.</b> Anular esta orden cambia lo que ese día debió haber en caja, y el arqueo que se contó deja de '
     + 'coincidir. El sistema lo marca como afectado y deja constancia. Es lo correcto, pero sépalo antes.</div>';
  if(entregado > 0.005) h += '<div class="nota rj" style="margin-top:14px"><b>Ya se le entregó USD '+fN(entregado)
     + ' de vuelto.</b> Ese dinero salió de la caja y anular no lo trae de vuelta: hay que cobrárselo aparte.</div>';

  h += '<div class="fila" style="margin-top:16px">'
     + '<div><label class="f">Causa de la anulación</label>'
     + '<select id="rv_mot"><option value="">Elija la causa</option>'
     + motActivos('anul').map(x=>'<option value="'+esc(x.c)+'"'+(x.c === RV.cod ? ' selected' : '')+'>'
         + esc(x.n)+'</option>').join('')+'</select>'
     + '<div class="ayuda" id="rv_motayuda">'+(m ? esc(m.d) : 'De la lista, para que después se pueda contar.')+'</div></div>'
     + '<div style="flex:2 1 320px"><label class="f">Detalle'+(m && m.pide ? '' : ' (opcional)')+'</label>'
     + '<input id="rv_det" value="'+esc(RV.det)+'" maxlength="140" placeholder="'
     + (m && m.pide ? 'Obligatorio: explique qué pasó' : 'Opcional: agregue el detalle si hace falta')+'"></div>'
     + '</div>';

  if(!hayClave()){
    h += '<div class="nota rj" style="margin-top:16px"><b>Falta la clave de administrador.</b> '
       + 'Anular no debería poder hacerlo cualquiera. Defínala en Gerencial · Seguridad y vuelva.</div>'
       + '<div class="acc"><button class="b oro" data-goto="ger|seg">Ir a definir la clave →</button></div></div>';
    return h;
  }
  h += '<div style="margin-top:16px"><label class="f">Clave de administrador</label>'
     + '<input id="rv_cla" type="password" value="'+esc(RV.clave)+'" maxlength="40" autocomplete="off" '
     + 'placeholder="Escriba la clave"><div class="ayuda">Sin ella la anulación no procede.</div></div>';

  h += '<div class="acc"><button class="b oro" id="rv_g"'+(m ? '' : ' disabled')+'>'
     + (m ? 'Anular la orden '+esc(v.num) : 'Elija la causa de la anulación')+'</button>'
     + '<button class="b gh" id="rv_can">← Elegir otra orden</button>'
     + '<button class="b gh" data-cruza="dvr">Esto no es anulación, es devolución →</button></div></div>';
  return h;
}

/* ==========================================================================
   SICOM v7 · eventos de los dos caminos separados
   ========================================================================== */

/* ejecuta según el camino, no según el motivo */
function rvEjecuta(){
  const v = rvVenta(); if(!v) return aviso('Elija primero la orden.', true);
  const tipo = esAnular() ? 'anul' : 'dev';
  const vm = valMotivo(tipo, RV.cod, RV.det); if(!vm.ok) return aviso(vm.msg, true);

  /* la causa tiene que corresponder al camino: si no, se cruza, no se rompe */
  const debe = anulaCon(RV.cod) ? 'anl' : 'dvr';
  if((esAnular() ? 'anl' : 'dvr') !== debe){
    DSUB = debe; pinta();
    return aviso('Esa causa corresponde a ' + (debe === 'anl' ? 'una anulación' : 'una devolución')
      + '. Lo llevé al camino correcto.', true);
  }

  if(esAnular()){
    if(!hayClave()) return aviso('Primero defina la clave de administrador en Gerencial · Seguridad.', true);
    if(!claveOK(RV.clave)) return aviso('La clave de administrador no es correcta.', true);
    const no = puedeAnular(v); if(no) return aviso(no, true);
    anularVenta(v.num, RV.cod, RV.det, RV.clave);
    if(anulada(v)){ nuevaRV(); TAB = 'dev'; DSUB = 'anl'; pinta(); window.scrollTo(0, 0); }
    return;
  }

  /* devolver */
  if(!RV.items || rvTotal() < 0.005) return aviso('Marque qué artículos regresan.', true);
  if(!dentroPlazo(v)){
    if(!hayClave()) return aviso('Primero defina la clave de administrador en Gerencial · Seguridad.', true);
    if(!claveOK(RV.clave)) return aviso('La clave de administrador no es correcta.', true);
    bitacora('dev','Autorizada fuera de plazo',
      v.num + ' · ' + diasDesde(v) + ' días desde la compra, el plazo es de ' + plazoDias());
  }
  DEV = RV.items.slice();
  VSEL = v.num;
  /* registraDevolucion lleva a Tesorería con la devolución lista para pagar:
     ahí es donde tiene que estar la cajera enseguida, con el dinero en mano */
  registraDevolucion(v.num, RV.cod, RV.det);
  nuevaRV(); DSUB = 'dvr';
}

document.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  /* cruzar de camino conservando cédula y orden */
  if(b.dataset.cruza){
    DSUB = b.dataset.cruza;
    RV.cod = ''; RV.det = ''; RV.clave = ''; RV.items = null;
    const v = rvVenta();
    if(v && DSUB === 'anl' && puedeAnular(v)){ RV.num = null; }
    if(v && DSUB === 'dvr' && !comprasPara(RV.cliId, 'devolver').some(x=>x.num === v.num)){ RV.num = null; }
    pinta(); window.scrollTo(0, 0);
    aviso(DSUB === 'anl' ? 'Pasó al camino de anulación.' : 'Pasó al camino de devolución.');
    return;
  }
});

/* ==========================================================================
   Arranque
   ========================================================================== */
DB = cargar();
if(!DB.bitacora.length) bitacora('datos','Sistema iniciado','base de calidad con datos de prueba');
if(!DB.cfg.cajeras.some(k=>k.id===DB.turno)){ const a=DB.cfg.cajeras.find(k=>k.activo); if(a) DB.turno=a.id; }
nuevaVenta();
nuevaRV();
aplicaTema();
pinta();
/* ==========================================================================
   SICOM · CONTABILIDAD · eventos de los modelos de asiento
   ========================================================================== */
document.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;

  if(b.dataset.ksub){ KSUB = b.dataset.ksub; KMOD = null; pinta(); return; }
  if(b.dataset.kfam){ KFAM = b.dataset.kfam; KMOD = null; pinta(); window.scrollTo(0,0); return; }
  if(b.dataset.kmod){ KMOD = (KMOD === b.dataset.kmod) ? null : b.dataset.kmod; pinta(); return; }

  /* guardar las cuentas de un modelo */
  if(b.dataset.kgua){
    const m = modeloDe(b.dataset.kgua); if(!m) return;
    const nuevas = m.lineas.map((l,i)=>{ const s = $('#mo_c_'+m.c+'_'+i); return s ? s.value : l.cta; });
    /* el cuadre no depende de las cuentas, pero una cuenta vacía sí rompe */
    const vacia = nuevas.findIndex(c=>!c);
    if(vacia >= 0) return aviso('La línea '+(vacia+1)+' se quedó sin cuenta.', true);
    const cam = [];
    nuevas.forEach((c,i)=>{ if(c !== m.lineas[i].cta)
      cam.push('línea '+(i+1)+': '+m.lineas[i].cta+' → '+c); });
    if(!cam.length) return aviso('No cambió ninguna cuenta.');
    /* una cuenta que no existe se avisa, pero no se bloquea: puede que la vaya
       a crear enseguida. Lo que no se hace es dejarlo pasar en silencio. */
    const inex = nuevas.filter(c=>!esCtaDin(c) && !ctaNom(c));
    nuevas.forEach((c,i)=>{ m.lineas[i].cta = c; });
    m.ver = (m.ver || 1) + 1;
    bitacora('conta','Modelo de asiento modificado',
      m.c + ' · ' + m.n + ' · v' + (m.ver-1) + ' → v' + m.ver + ' · ' + cam.join(' · '));
    aviso(inex.length
      ? 'Guardado como v'+m.ver+', pero '+inex.join(', ')+' no está en el catálogo.'
      : 'Modelo '+m.c+' guardado como v'+m.ver+'.', inex.length ? true : false);
    pinta(); return;
  }

  /* activar o desactivar */
  if(b.dataset.kmtog){
    const m = modeloDe(b.dataset.kmtog); if(!m) return;
    m.activo = (m.activo === false);
    m.ver = (m.ver || 1) + 1;
    bitacora('conta', m.activo ? 'Modelo de asiento activado' : 'Modelo de asiento desactivado',
      m.c + ' · ' + m.n + ' · v' + m.ver);
    aviso(m.activo ? 'Modelo '+m.c+' activado.'
      : 'Modelo '+m.c+' desactivado: las operaciones de ese tipo dejan de generar asiento.', !m.activo);
    pinta(); return;
  }

  /* volver al de fábrica */
  if(b.dataset.krest){
    const m = modeloDe(b.dataset.krest); if(!m) return;
    const f = MODELOS_BASE().find(x=>x.c === m.c);
    if(!f) return aviso('Este modelo no tiene versión de fábrica.', true);
    const igual = JSON.stringify(f.lineas) === JSON.stringify(m.lineas) && m.activo !== false;
    if(igual) return aviso('Ya está igual al de fábrica.');
    if(!confirm('¿Devolver el modelo ' + m.c + ' a como venía de fábrica?\n\n'
      + 'Las cuentas que usted cambió se pierden. Los comprobantes ya generados no se tocan.')) return;
    m.lineas = JSON.parse(JSON.stringify(f.lineas));
    m.activo = true;
    m.ver = (m.ver || 1) + 1;
    bitacora('conta','Modelo de asiento restaurado', m.c + ' · ' + m.n + ' · v' + m.ver + ' · vuelto al de fábrica');
    aviso('Modelo '+m.c+' devuelto al de fábrica, como v'+m.ver+'.');
    pinta(); return;
  }
});

/* el selector de cuenta no debe repintar: si repinta, se pierden los demás
   cambios que la persona llevaba hechos en el mismo modelo */
document.addEventListener('change', e=>{
  if(e.target && e.target.dataset && e.target.dataset.ctasel) e.stopPropagation();
}, true);
