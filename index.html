/* ------------------------------------------------------------- VENTAS ---- */
function buscaVentas(){
  const q = VQ.toLowerCase().trim();
  let ls = DB.ventas.slice().sort((a,b)=>
    b.fecha === a.fecha ? String(b.hora).localeCompare(String(a.hora)) : b.fecha.localeCompare(a.fecha));
  if(q) ls = ls.filter(v=>{
    const c = DB.clientes.find(x=>x.id === v.cliId) || {};
    return v.num.toLowerCase().includes(q)
        || (c.nom ? nomComp(c).toLowerCase().includes(q) : false)
        || (c.doc || '').includes(q)
        || fFecha(v.fecha).includes(q)
        || v.fecha.includes(q)
        || v.lineas.some(l=>l.nom.toLowerCase().includes(q) || l.sku.toLowerCase().includes(q));
  });
  return ls;
}

function repVentas(){
  const ls = buscaVentas(), t = tasaVigente();
  const an = DB.ventas.filter(anulada), cd = DB.ventas.filter(v=>devueltoUSD(v) > 0.005 && !anulada(v));
  const valTot = DB.ventas.filter(v=>!anulada(v)).reduce((a,v)=>a+netoVenta(v), 0);

  let h = '<div class="hero">'
    + '<div class="h dest"><span class="k">Vendido neto</span><span class="v">'+fN(valTot)+' <small>USD</small></span>'
    + '<span class="s">'+DB.ventas.filter(v=>!anulada(v)).length+' ventas válidas</span></div>'
    + '<div class="h"><span class="k">Anuladas</span><span class="v">'+an.length+'</span>'
    + '<span class="s">USD '+fN(an.reduce((a,v)=>a+v.total,0))+' dejados sin efecto</span></div>'
    + '<div class="h"><span class="k">Con devolución</span><span class="v">'+cd.length+'</span>'
    + '<span class="s">USD '+fN(DB.ventas.reduce((a,v)=>a+devueltoUSD(v),0))+' regresados</span></div>'
    + '<div class="h"><span class="k">Devoluciones por pagar</span><span class="v">'
    + DB.vpend.filter(p=>p.tipo === 'devolucion' && p.saldo > 0.005 && !p.anulado).length+'</span>'
    + '<span class="s">esperando en tesorería</span></div></div>';

  h += '<div class="card" style="margin-top:18px"><h2>Buscar una venta</h2>'
     + '<p class="cap">Por número, cliente, cédula, fecha o artículo. Desde aquí se anula y se devuelve.</p>'
     + '<input id="vq" value="'+esc(VQ)+'" placeholder="Escriba el número de la venta, el nombre del cliente o la fecha" autocomplete="off">';

  if(!ls.length){
    h += '<div class="vacio"><div class="vi">⌕</div>'
       + (VQ ? 'Ninguna venta coincide con «'+esc(VQ)+'».' : 'Todavía no hay ventas registradas.')+'</div></div>';
    return h;
  }

  h += '<table class="dat" style="margin-top:16px"><thead><tr><th>Venta</th><th>Fecha</th><th>Cliente</th>'
     + '<th>Cédula</th><th>Artículos</th><th class="n">Total USD</th><th class="n">Neto</th><th>Estado</th><th></th></tr></thead><tbody>';
  ls.slice(0, 60).forEach(v=>{
    const c = DB.clientes.find(x=>x.id === v.cliId) || {nom:'—', ape:'', doc:''};
    const e = estadoVenta(v), sel = VSEL === v.num;
    h += '<tr'+(anulada(v) ? ' style="opacity:.62"' : '')+'>'
      + '<td><b>'+esc(v.num)+'</b><div class="mini">'+esc(v.hora)+'</div></td>'
      + '<td class="mini">'+fFecha(v.fecha)+'</td>'
      + '<td>'+esc(nomComp(c))+'</td>'
      + '<td class="codn">'+esc(c.doc || '—')+'</td>'
      + '<td class="mini">'+v.lineas.reduce((a,l)=>a+l.cant,0)+' und · '+esc(v.canal||'—')+'</td>'
      + '<td class="n"'+(anulada(v) ? ' style="text-decoration:line-through"' : '')+'>'+fN(v.total)+'</td>'
      + '<td class="n"><b>'+fN(netoVenta(v))+'</b></td>'
      + '<td><span class="chip '+e.c+'">'+e.t+'</span></td>'
      + '<td class="n"><button class="b sm '+(sel ? 'gh' : 'oro')+'" data-vsel="'+esc(v.num)+'">'
      + (sel ? 'Cerrar' : 'Ver')+'</button></td></tr>';
    if(sel) h += '<tr><td colspan="9" style="padding:0;background:var(--sup)">'+fichaVenta(v, c, t)+'</td></tr>';
  });
  h += '</tbody></table>';
  if(ls.length > 60) h += '<div class="nota">Se muestran las 60 más recientes de '+ls.length+'. Afine la búsqueda para ver el resto.</div>';
  h += '</div>';
  if(DB.ventas.some(v=>(v.devuelto||[]).length)) h += cardPorQue('dev');
  if(DB.ventas.some(anulada))                    h += cardPorQue('anul');
  return h;
}

function fichaVenta(v, c, t){
  let h = '<div style="padding:20px">';

  if(anulada(v)){
    const a = v.anulada;
    h += '<div class="nota rj" style="margin:0 0 18px"><b>Venta anulada el '+fFecha(a.fecha)+' a las '+esc(a.hora)+'</b> '
       + 'por '+esc(a.por)+'.<br>Motivo: '+(a.motivoC?'<b>'+esc(a.motivoC)+'</b> · ':'')+esc(a.motivo)
       + (a.cierre ? '<br>Afecta el cierre de caja del <b>'+fFecha(a.cierre)+'</b>, que ya estaba firmado.' : '')
       + (a.yaEntregado > 0.005 ? '<br>Ya se le había entregado USD <b>'+fN(a.yaEntregado)+'</b> de vuelto: ese dinero salió y no regresó solo.' : '')
       + '</div>';
  }

  h += '<div class="g2b"><div>';
  h += '<h3 style="font-size:14px;margin-bottom:10px">Lo que se llevó</h3><table class="dat"><tbody>';
  v.lineas.forEach((l,i)=>{
    const dv = devueltasDe(v, i);
    h += '<tr><td><b>'+esc(l.nom)+(l.talla ? ' · '+esc(l.talla) : '')+'</b>'
      + '<div class="mini">'+esc(l.sku)+' · '+esc(l.cat||'')+'</div></td>'
      + '<td class="n">'+l.cant+' × '+fN(l.precio)+(dv ? '<div class="mini" style="color:var(--avi)">'+dv+' devuelta'+(dv>1?'s':'')+'</div>' : '')+'</td>'
      + '<td class="n"><b>'+fN(l.cant*l.precio)+'</b></td></tr>';
  });
  if(v.deliv > 0) h += '<tr><td><b>🛵 Delivery</b><div class="mini">'+esc(v.repId ? repNom(v.repId) : '')+'</div></td>'
    + '<td class="n"></td><td class="n"><b>'+fN(v.deliv)+'</b></td></tr>';
  h += '<tr><td colspan="2" style="text-align:right"><b>Total de la venta</b></td>'
     + '<td class="n"><b>USD '+fN(v.total)+'</b></td></tr>';
  if(devueltoUSD(v) > 0.005) h += '<tr><td colspan="2" style="text-align:right">Devuelto</td>'
     + '<td class="n" style="color:var(--mal-ink)"><b>−'+fN(devueltoUSD(v))+'</b></td></tr>'
     + '<tr><td colspan="2" style="text-align:right"><b>Neto</b></td><td class="n"><b>USD '+fN(netoVenta(v))+'</b></td></tr>';
  h += '</tbody></table>';

  h += '<div class="mini" style="margin-top:12px">Cobrada por '+esc(cajeraNom(v.cajera))
     + ' · '+(v.vendedorId ? esc(vendNom(v.vendedorId)) : 'sin vendedor asignado')
     + ' · tasa Bs '+(v.tasa ? fN(v.tasa,2) : '—')+'</div>';
  h += '</div><div>';

  h += '<h3 style="font-size:14px;margin-bottom:10px">Cómo pagó</h3><table class="dat"><tbody>';
  v.cobros.forEach(x=>{ const m = METODOS.find(y=>y.k === x.met) || {};
    h += '<tr><td><b>'+(m.ic||'')+' '+esc(m.n||x.met)+'</b>'
      + (x.banco ? '<div class="mini">'+esc(x.banco)+(x.ref ? ' · '+esc(x.ref) : '')+'</div>' : '')
      + (x.fuente === 'accionista' ? '<div class="mini"><span class="chip acc">fondos del accionista</span></div>' : '')
      + '</td><td class="n"><b>'+(m.mon === 'BS' ? 'Bs ' : 'USD ')+fN(x.monto)+'</b>'
      + '<div class="mini">'+esc(ctaDe('cob_'+x.met) || 'sin cuenta')+'</div></td></tr>';
  });
  v.vueltos.forEach(x=>{ const m = METODOS.find(y=>y.k === x.met) || {};
    h += '<tr><td>Vuelto por '+esc((m.n||'').toLowerCase())+'</td>'
      + '<td class="n" style="color:var(--mal-ink)">−'+(m.mon === 'BS' ? 'Bs ' : 'USD ')+fN(x.monto)+'</td></tr>';
  });
  if(v.pend > 0.005) h += '<tr><td>Vuelto que quedó pendiente</td><td class="n"><b>USD '+fN(v.pend)+'</b></td></tr>';
  h += '</tbody></table>';

  if(devDe(v).length){
    h += '<h3 style="font-size:14px;margin:18px 0 10px">Devoluciones</h3><table class="dat"><tbody>';
    devDe(v).forEach(d=>{
      const p = DB.vpend.find(x=>x.id === d.pendId);
      h += '<tr><td><b>'+fFecha(d.fecha)+'</b><div class="mini">'+esc(d.motivo)+'</div>'
        + '<div class="mini">'+d.lineas.map(l=>l.cant+'× '+esc(l.nom)+(l.talla ? ' '+esc(l.talla) : '')).join(' · ')+'</div></td>'
        + '<td class="n"><b>USD '+fN(d.usd)+'</b><div class="mini">'
        + (p && p.saldo > 0.005 ? '<span class="chip avi">por entregar</span>' : '<span class="chip ok">entregada</span>')
        + '</div></td></tr>';
    });
    h += '</tbody></table>';
  }
  h += '</div></div>';

  /* acciones */
  if(!anulada(v)){
    h += '<div class="acc" style="margin-top:18px;border-top:1px solid var(--linea);padding-top:16px">'
       + '<button class="b sm oro" data-rvir="'+esc(v.num)+'">Devolver o anular esta venta →</button>'
       + '<span class="mini" style="align-self:center">Se hace en el módulo de Devoluciones, con la cédula del comprador.</span>'
       + '</div>';
  }
  h += '</div>';
  return h;
}

/* -------------------------------------------------------- DEVOLUCIÓN ----- */
function formDevolucion(v, t){
  if(!DEV) DEV = v.lineas.map(()=>0);
  const usd = totalDev(v);
  let h = '<div class="card editando" style="margin-top:16px"><h2>¿Qué regresa?</h2>'
    + '<p class="cap">Marque cuántas unidades vuelven. La mercancía entra otra vez al inventario y el dinero '
    + 'queda como devolución por entregar en tesorería.</p><div class="lineas">';
  v.lineas.forEach((l,i)=>{
    const ya = devueltasDe(v, i), max = l.cant - ya, n = DEV[i] || 0;
    h += '<div class="lin"><div class="li"><b>'+esc(l.nom)+(l.talla ? ' · '+esc(l.talla) : '')+'</b>'
      + '<div class="mini">USD '+fN(l.precio)+' c/u · llevó '+l.cant
      + (ya ? ' · ya devolvió '+ya : '')+(max <= 0 ? ' · <b>nada más por devolver</b>' : '')+'</div></div>'
      + '<button class="b sm gh" data-dvm="'+i+'"'+(n <= 0 ? ' disabled' : '')+'>−</button>'
      + '<b style="min-width:20px;text-align:center">'+n+'</b>'
      + '<button class="b sm gh" data-dvp="'+i+'"'+(n >= max ? ' disabled' : '')+'>+</button>'
      + '<span class="lm">'+fN(n*l.precio)+'</span></div>';
  });
  h += '</div>';
  h += '<div class="visor"><span class="vk">Se le devuelve</span><div class="vn">USD '+fN(usd)+'</div>'
     + (t ? '<span class="veq">Bs '+fN(usd*t.bcv)+' a la tasa de hoy · '+fN(t.bcv,2)+'</span>'
          : '<span class="veq">Sin tasa confirmada</span>')+'</div>';
  h += '<div class="nota az" style="margin-top:14px"><b>Por qué en dólares.</b> La compra se pactó en dólares, así que '
     + 'eso es lo que se le devuelve. Si se le paga en bolívares, se calcula a la tasa del día de hoy, no a la del día '
     + 'de la compra: es lo que le cuesta a ella reponer la prenda hoy.</div>';
  const mDev = motDe('dev', VMOTC);
  h += '<div class="fila" style="margin-top:14px">'
     + '<div><label class="f">¿Por qué la devuelve?</label>'+selMotivo('dev','dv_motc',VMOTC)
     + '<div id="dv_motayuda">'+ayudaMotivo('dev',VMOTC)+'</div></div>'
     + '<div style="flex:2 1 320px"><label class="f">Detalle'+(mDev&&mDev.pide?'':' (opcional)')+'</label>'
     + '<input id="dv_det" value="'+esc(VDET)+'" maxlength="90" placeholder="'
     + (mDev&&mDev.pide?'Obligatorio: explique qué pasó':'Opcional: agregue el detalle si hace falta')+'">'
     + '<div class="ayuda">El motivo se cuenta en el reporte; el detalle va en la bitácora y en el correo.</div></div>'
     + '</div>';
  h += '<div class="acc"><button class="b oro" id="dv_g"'+(usd < 0.005 ? ' disabled' : '')+'>'
     + (usd < 0.005 ? 'Indique qué regresa' : 'Registrar la devolución de USD '+fN(usd))+'</button></div>'
     + '<div class="nota">Con el motivo de lista, dentro de tres meses va a poder ver por qué le devuelven. '
     + 'Los motivos se administran en Configuración · Motivos.</div></div>';
  return h;
}

/* --------------------------------------------------------- ANULACIÓN ----- */
function formAnulacion(v){
  const no = puedeAnular(v);
  let h = '<div class="card editando" style="margin-top:16px"><h2>Anular la venta '+esc(v.num)+'</h2>';
  if(no) return h + '<div class="nota rj" style="margin:0">'+esc(no)+'</div></div>';

  const cie = DB.cierres.find(c=>c.fecha === v.fecha);
  const vp = DB.vpend.filter(p=>p.venta === v.num && !p.anulado);
  const entregado = vp.reduce((a,p)=>a+(p.usd-p.saldo), 0);

  h += '<p class="cap">Anular deja la venta sin efecto: la mercancía vuelve al inventario y el cliente deja de tener '
     + 'esa compra en su historial. La venta no se borra —queda marcada, con su motivo y su firma— porque el sistema '
     + 'es auditable.</p>';

  h += '<div class="lineas">'
     + '<div class="lin"><div class="li"><b>Vuelven al inventario</b><div class="mini">'
     + v.lineas.map(l=>l.cant+'× '+esc(l.nom)+(l.talla ? ' '+esc(l.talla) : '')).join(' · ')
     + '</div></div><span class="lm">'+v.lineas.reduce((a,l)=>a+l.cant,0)+' und</span></div>'
     + '<div class="lin"><div class="li"><b>El cliente deja de acumular</b><div class="mini">'
     + 'una compra menos y USD '+fN(v.total)+' menos en su historial</div></div>'
     + '<span class="lm">−'+fN(v.total)+'</span></div>';
  if(DB.accionista.some(m=>m.venta === v.num))
    h += '<div class="lin"><div class="li"><b>Se revierte el movimiento del accionista</b>'
       + '<div class="mini">con un asiento contrario, no borrando el original</div></div></div>';
  if(vp.length)
    h += '<div class="lin"><div class="li"><b>Se cancela el vuelto pendiente</b><div class="mini">'
       + 'USD '+fN(vp.reduce((a,p)=>a+p.saldo,0))+' que todavía no se le había entregado</div></div></div>';
  h += '</div>';

  if(cie) h += '<div class="nota rj" style="margin-top:14px"><b>Ojo: el '+fFecha(v.fecha)+' ya tiene cierre de caja firmado.</b> '
     + 'Anular esta venta cambia lo que ese día debió haber en caja, y el arqueo que se contó y se firmó deja de coincidir. '
     + 'El sistema va a marcar ese cierre como afectado y va a dejar constancia de la diferencia. Es lo correcto, pero '
     + 'sépalo antes de hacerlo.</div>';
  if(entregado > 0.005) h += '<div class="nota rj" style="margin-top:14px"><b>Ya se le entregó USD '+fN(entregado)+' de vuelto.</b> '
     + 'Ese dinero salió de la caja y anular no lo trae de vuelta: hay que cobrárselo al cliente aparte.</div>';

  const mAn = motDe('anul', VMOTC);
  h += '<div class="fila" style="margin-top:16px">'
     + '<div><label class="f">Motivo de la anulación</label>'+selMotivo('anul','an_motc',VMOTC)
     + '<div id="an_motayuda">'+ayudaMotivo('anul',VMOTC)+'</div></div>'
     + '<div style="flex:2 1 320px"><label class="f">Detalle'+(mAn&&mAn.pide?'':' (opcional)')+'</label>'
     + '<input id="an_det" value="'+esc(VDET)+'" maxlength="140" placeholder="'
     + (mAn&&mAn.pide?'Obligatorio: explique qué pasó':'Opcional: agregue el detalle si hace falta')+'">'
     + '<div class="ayuda">Queda firmado en la bitácora con su nombre.</div></div>'
     + '</div>';

  if(!hayClave()){
    h += '<div class="nota rj" style="margin-top:14px"><b>Falta la clave de administrador.</b> '
       + 'Anular una venta es una operación que no debería poder hacer cualquiera. '
       + 'Defina la clave en Gerencial · Seguridad y vuelva.</div>'
       + '<div class="acc"><button class="b oro" data-goto="ger|seg">Ir a definir la clave →</button></div></div>';
    return h;
  }
  h += '<div style="margin-top:14px"><label class="f">Clave de administrador</label>'
     + '<input id="an_cla" type="password" value="'+esc(VCLA)+'" placeholder="Escriba la clave" maxlength="40" autocomplete="off">'
     + '<div class="ayuda">Sin ella la anulación no procede.</div></div>'
     + '<div class="acc"><button class="b oro" id="an_g">Anular la venta '+esc(v.num)+'</button></div></div>';
  return h;
}

/* --------------------------------------------------------- SEGURIDAD ----- */

  const anu = DB.ventas.filter(anulada);
  let h = '<div class="card"><h2>Clave de administrador</h2>'
    + '<p class="cap">Hay operaciones que no debería poder hacer una cajera por su cuenta. Hoy es una: anular una venta. '
    + 'Más adelante serán también el cierre con diferencia y el cambio de precios.</p>';

  h += hayClave()
    ? '<div class="estado cuadra"><span class="et">Estado</span><span class="mt">Clave definida</span>'
      + '<span class="sb">Las anulaciones exigen escribirla.</span></div>'
    : '<div class="estado pend"><span class="et">Estado</span><span class="mt">Sin clave</span>'
      + '<span class="sb">Mientras no la defina, no se puede anular ninguna venta.</span></div>';

  h += '<div class="fila" style="margin-top:16px">';
  if(hayClave()) h += '<div><label class="f">Clave actual</label>'
    + '<input id="sg_act" type="password" placeholder="Escriba la clave actual" maxlength="40" autocomplete="off"></div>';
  h += '<div><label class="f">'+(hayClave() ? 'Clave nueva' : 'Clave')+'</label>'
     + '<input id="sg_n1" type="password" placeholder="Al menos 6 caracteres" maxlength="40" autocomplete="new-password"></div>'
     + '<div><label class="f">Repítala</label>'
     + '<input id="sg_n2" type="password" placeholder="La misma otra vez" maxlength="40" autocomplete="new-password"></div>'
     + '</div><div class="acc"><button class="b oro" id="sg_g">'+(hayClave() ? 'Cambiar la clave' : 'Definir la clave')+'</button></div>';

  h += '<div class="nota rj">Sea honesto consigo mismo sobre qué protege esto. La clave se guarda sellada, no en claro, '
     + 'pero el sistema entero vive en este navegador: quien tenga la computadora abierta puede llegarle a los datos. '
     + 'Sirve para que nadie anule una venta de paso, no para detener a alguien decidido. La seguridad de verdad '
     + '—usuario, contraseña y permisos por rol— llega cuando el sistema esté en el servidor.</div></div>';

  h += '<div class="card"><h2>Quién es quién, hoy</h2>'
     + '<p class="cap">Se lo digo aquí para que nadie lea la bitácora como si fuera prueba de autoría.</p>'
     + '<div class="estado pend"><span class="et">Usuarios y roles</span>'
     + '<span class="mt">Todavía no existen</span>'
     + '<span class="sb">Quien abre el sistema tiene acceso completo.</span></div>'
     + '<div class="nota rj" style="margin-top:16px">El selector «Cajera en turno» de la barra de arriba es una '
     + '<b>etiqueta, no una identidad</b>: cualquiera lo cambia sin clave. La bitácora firma con el nombre que diga '
     + 'ese selector en ese momento, así que sirve para saber <b>qué</b> pasó y <b>cuándo</b>, pero no prueba '
     + '<b>quién</b> lo hizo. Hoy la clave de administrador es lo único que separa una operación sensible del resto.'
     + '<br><br>Usuario y contraseña por persona, con permisos por rol —cajera, supervisor, administrador— y una '
     + 'firma que sí valga como prueba, llegan cuando el sistema esté en el servidor. Mientras tanto, opere sabiendo '
     + 'esto.</div></div>';

  const cc = anu.filter(v=>v.anulada.cierre).length;
  h += '<div class="card"><h2>Uso de la clave</h2>'
     + '<p class="cap">Lo que se ha autorizado con ella hasta ahora.</p><div class="hero">'
     + '<div class="h dest"><span class="k">Ventas anuladas</span><span class="v">'+anu.length+'</span>'
     + '<span class="s">USD '+fN(anu.reduce((a,v)=>a+v.total, 0))+' dejados sin efecto</span></div>'
     + '<div class="h"><span class="k">Sobre cierres firmados</span><span class="v">'+cc+'</span>'
     + '<span class="s">'+(cc ? '<b style="color:var(--mal)">revíselas</b>' : 'ninguna')+'</span></div>'
     + '<div class="h"><span class="k">Fuera de plazo</span><span class="v">'
     + (DB.bitacora||[]).filter(r=>r.accion === 'Autorizada fuera de plazo').length+'</span>'
     + '<span class="s">devoluciones autorizadas por excepción</span></div>'
     + '<div class="h"><span class="k">Plazo vigente</span><span class="v">'+plazoDias()+' <small>días</small></span>'
     + '<span class="s">desde la compra</span></div></div>'
     + '<div class="acc" style="margin-top:16px">'
     + '<button class="b sm oro" data-irdev="anu">Ver el detalle de las anulaciones →</button></div>'
     + '<div class="nota">El detalle vive en el módulo de Devoluciones y anulaciones, para no tener la misma tabla '
     + 'en dos sitios diciendo cosas distintas.</div></div>';
  return h;
}

/* -------------------------------------- devoluciones pendientes en tesorería */
function pendDev(){ return DB.vpend.filter(p=>p.tipo === 'devolucion' && p.saldo > 0.005 && !p.anulado); }
function pendVue(){ return DB.vpend.filter(p=>p.tipo !== 'devolucion' && p.saldo > 0.005 && !p.anulado); }

   SICOM v3 · eventos de ventas, seguridad y contabilidad
   ========================================================================== */
document.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;

  /* ---------------- ficha de la venta ---------------- */
  if(b.dataset.vsel){
    VSEL = (VSEL === b.dataset.vsel) ? null : b.dataset.vsel;
    VACC = null; DEV = null; VMOT = ''; VMOTC = ''; VDET = ''; VCLA = '';
    pinta(); return;
  }
  if(b.dataset.vacc){
    VACC = (VACC === b.dataset.vacc) ? null : b.dataset.vacc;
    DEV = null; VMOT = ''; VMOTC = ''; VDET = ''; VCLA = '';
    pinta(); return;
  }

  /* ---------------- devolución ---------------- */
  if(b.dataset.dvp !== undefined && b.dataset.dvp !== ''){
    const v = DB.ventas.find(x=>x.num === VSEL); if(!v) return;
    const i = +b.dataset.dvp, l = v.lineas[i];
    if(!DEV) DEV = v.lineas.map(()=>0);
    const max = l.cant - devueltasDe(v, i);
    if(DEV[i] < max) DEV[i]++;
    pinta(); return;
  }
  if(b.dataset.dvm !== undefined && b.dataset.dvm !== ''){
    const i = +b.dataset.dvm;
    if(DEV && DEV[i] > 0) DEV[i]--;
    pinta(); return;
  }
  if(b.id === 'dv_g'){ registraDevolucion(VSEL, VMOTC, VDET); return; }

  /* ---------------- anulación ---------------- */
  if(b.id === 'an_g'){ anularVenta(VSEL, VMOTC, VDET, VCLA); return; }

  /* ---------------- clave de administrador ---------------- */
  if(b.id === 'sg_g'){
    const n1 = ($('#sg_n1').value || ''), n2 = ($('#sg_n2').value || '');
    if(hayClave()){
      const act = ($('#sg_act').value || '');
      if(!claveOK(act)) return aviso('La clave actual no es correcta.', true);
    }
    if(n1.length < 6) return aviso('La clave debe tener al menos 6 caracteres.', true);
    if(n1 !== n2) return aviso('Las dos claves no coinciden. Escríbalas otra vez.', true);
    if(/^\d+$/.test(n1)) return aviso('No use solo números: mezcle letras.', true);
    const cambio = hayClave();
    DB.cfg.claveAdmin = selloClave(n1);
    bitacora('seguridad', cambio ? 'Clave de administrador cambiada' : 'Clave de administrador definida',
             'a partir de ahora las anulaciones la exigen');
    aviso(cambio ? 'Clave cambiada.' : 'Clave definida. Ya se pueden anular ventas.');
    pinta(); return;
  }

  /* ---------------- plan de cuentas ---------------- */
  if(b.id === 'ct_g'){
    const c = ($('#ct_c').value || '').trim(), n = ($('#ct_n').value || '').trim();
    const v = valCodigo(c);
    if(!v.ok) return aviso(v.msg, true);
    if(n.length < 3) return aviso('Escriba el nombre de la cuenta.', true);
    DB.cuentas.push({c:c, n:n, t:v.tipo});
    CTABUF = null;
    bitacora('contab','Cuenta agregada', c+' · '+n+' · '+v.tipo+' · '+nivelNom(c).toLowerCase());
    aviso('Cuenta '+c+' agregada como cuenta '+nivelNom(c).toLowerCase()+'.'); pinta(); return;
  }
  /* ---------------- asistente para abrir una cuenta ---------------- */
  if(b.dataset.ctwtipo){
    CTW.tipo = b.dataset.ctwtipo;
    CTW.rubroC = ''; CTW.rubroN = ''; CTW.rubroLibre = false;
    CTW.subC = ''; CTW.subN = ''; CTW.subLibre = false; CTW.subNinguno = false;
    CTW.nom = ''; pinta(); return;
  }
  if(b.dataset.ctwrub){
    CTW.rubroC = b.dataset.ctwrub; CTW.rubroN = ''; CTW.rubroLibre = false;
    CTW.subC = ''; CTW.subN = ''; CTW.subLibre = false; CTW.subNinguno = false;
    CTW.nom = ''; pinta(); return;
  }
  if(b.dataset.ctwrubn){
    CTW.rubroN = b.dataset.ctwrubn; CTW.rubroC = ''; CTW.rubroLibre = false;
    CTW.subC = ''; CTW.subN = ''; CTW.subLibre = false; CTW.subNinguno = false;
    CTW.nom = ''; pinta(); return;
  }
  if(b.dataset.ctwrubo){
    CTW.rubroLibre = true; CTW.rubroC = ''; CTW.rubroN = '';
    CTW.subC = ''; CTW.subN = ''; CTW.subLibre = false; CTW.subNinguno = false;
    CTW.nom = ''; pinta();
    const n = $('#ctw_rn'); if(n) n.focus();
    return;
  }
  if(b.dataset.ctwsub){
    CTW.subC = b.dataset.ctwsub; CTW.subN = ''; CTW.subLibre = false; CTW.subNinguno = false;
    CTW.nom = ''; pinta(); return;
  }
  if(b.dataset.ctwsubn){
    CTW.subN = b.dataset.ctwsubn; CTW.subC = ''; CTW.subLibre = false; CTW.subNinguno = false;
    CTW.nom = ''; pinta(); return;
  }
  if(b.dataset.ctwsubo){
    CTW.subLibre = true; CTW.subC = ''; CTW.subN = ''; CTW.subNinguno = false;
    CTW.nom = ''; pinta();
    const n = $('#ctw_sn'); if(n) n.focus();
    return;
  }
  if(b.dataset.ctwsubx){
    CTW.subNinguno = true; CTW.subC = ''; CTW.subN = ''; CTW.subLibre = false;
    CTW.nom = ''; pinta(); return;
  }
  if(b.dataset.ctwvol){
    const q = b.dataset.ctwvol;
    if(q === 'tipo'){ nuevoCTW(); }
    if(q === 'rubro'){ CTW.rubroC = ''; CTW.rubroN = ''; CTW.rubroLibre = false;
      CTW.subC = ''; CTW.subN = ''; CTW.subLibre = false; CTW.subNinguno = false; CTW.nom = ''; }
    if(q === 'sub'){ CTW.subC = ''; CTW.subN = ''; CTW.subLibre = false;
      CTW.subNinguno = false; CTW.nom = ''; }
    pinta(); return;
  }
  if(b.id === 'ctw_limpiar'){ nuevoCTW(); pinta(); return; }
  if(b.id === 'ctw_crear'){
    const P = ctwPlan(), nuevas = P.filter(x=>x.nueva);
    if(!ctwListo()) return aviso('Escriba cómo se llama la cuenta.', true);
    /* se crean de arriba abajo: cada una necesita que su padre ya exista */
    const hechas = [];
    for(let i = 0; i < nuevas.length; i++){
      const x = nuevas[i], v = valCodigo(x.cod);
      if(!v.ok){
        /* nada a medias: lo que se alcanzó a crear se deshace */
        DB.cuentas = DB.cuentas.filter(c=>hechas.indexOf(c.c) < 0);
        return aviso(v.msg, true);
      }
      DB.cuentas.push({c:x.cod, n:x.nom, t:v.tipo});
      hechas.push(x.cod);
    }
    DB.cuentas.sort((x,y)=>cmpCod(x.c, y.c));
    const fin = P[P.length-1];
    bitacora('contab', nuevas.length > 1 ? 'Cuentas agregadas' : 'Cuenta agregada',
      P.map(x=>x.cod + ' · ' + x.nom).join('  →  ')
      + ' · ' + nuevas.length + (nuevas.length === 1 ? ' cuenta nueva' : ' cuentas nuevas'));
    aviso(nuevas.length > 1
      ? nuevas.length + ' cuentas creadas · ' + fin.cod + ' · ' + fin.nom + ' recibe movimiento.'
      : 'Cuenta ' + fin.cod + ' · ' + fin.nom + ' creada.');
    nuevoCTW(); pinta(); window.scrollTo(0, 0); return;
  }
  if(b.id === 'ct_avz'){ CTAVZ = !CTAVZ; pinta(); return; }
  if(b.dataset.ctred !== undefined){ CTAED = b.dataset.ctred || null; pinta(); return; }
  if(b.dataset.ctrg){
    const c = b.dataset.ctrg, o = ctaObj(c), n = (($('#ct_rn')||{}).value || '').trim();
    if(!o) return aviso('Esa cuenta ya no está.', true);
    if(n.length < 3) return aviso('Escriba el nombre de la cuenta.', true);
    if(n === o.n){ CTAED = null; pinta(); return; }
    bitacora('contab','Cuenta renombrada', c+' · «'+o.n+'» → «'+n+'»');
    o.n = n; CTAED = null;
    aviso('Cuenta '+c+' renombrada.'); pinta(); return;
  }
  if(b.dataset.ctdel){
    const c = b.dataset.ctdel;
    if(hijasDe(c).length)
      return aviso('De '+c+' cuelgan '+hijasDe(c).length+' cuentas. Elimine primero las de abajo.', true);
    if(OPS.some(o=>ctaDe(o.k) === c)) return aviso('Esa cuenta está asignada a una operación: desasígnela primero.', true);
    if(modelos().some(m=>(m.lineas||[]).some(l=>l.cta === c)))
      return aviso('Esa cuenta está usada en un modelo de asiento: quítela de ahí primero.', true);
    DB.cuentas = DB.cuentas.filter(x=>x.c !== c);
    bitacora('contab','Cuenta eliminada', c);
    aviso('Cuenta eliminada.'); pinta(); return;
  }
});

]; }

function motLista(tipo){ return (tipo === 'anul' ? DB.cfg.motAnul : DB.cfg.motDev) || []; }
function motActivos(tipo){ return motLista(tipo).filter(m=>m.activo); }
function motDe(tipo, cod){ return motLista(tipo).find(m=>m.c === cod) || null; }
function motTexto(tipo, cod, det){
  const m = motDe(tipo, cod);
  const base = m ? m.n : (cod || 'Sin motivo');
  const d = String(det || '').trim();
  return d ? base + ' · ' + d : base;
}
/* ¿está en uso? entonces no se borra, se desactiva */
function motUsado(tipo, cod){
  if(tipo === 'anul') return DB.ventas.some(v=>v.anulada && v.anulada.motivoC === cod);
  return DB.ventas.some(v=>(v.devuelto||[]).some(d=>d.motivoC === cod));
}
function motProxCod(tipo){
  const pre = tipo === 'anul' ? 'AN-' : 'DV-';
  const ns = motLista(tipo).map(m=>parseInt(String(m.c).replace(pre,''), 10))
    .filter(n=>isFinite(n) && n < 90);
  const n = (ns.length ? Math.max.apply(null, ns) : 0) + 1;
  return pre + String(n).padStart(2, '0');
}
/* valida la elección antes de dejar seguir */
function valMotivo(tipo, cod, det){
  if(!cod) return {ok:false, msg:'Elija el motivo de la lista.'};
  const m = motDe(tipo, cod);
  if(!m) return {ok:false, msg:'Ese motivo ya no existe en la lista.'};
  if(!m.activo) return {ok:false, msg:'Ese motivo está desactivado. Elija otro.'};
  if(m.pide && String(det||'').trim().length < 10)
    return {ok:false, msg:'Con «'+m.n+'» hay que explicar por escrito qué pasó.'};
  return {ok:true, msg:''};
}

/* ---------- por qué anulamos y por qué nos devuelven ---------- */
function resumenMotivos(tipo){
  const r = {};
  if(tipo === 'anul'){
    DB.ventas.filter(v=>v.anulada).forEach(v=>{
      const c = v.anulada.motivoC || 'AN-99';
      if(!r[c]) r[c] = {c:c, n:0, usd:0};
      r[c].n++; r[c].usd += v.total;
    });
  }else{
    DB.ventas.forEach(v=>(v.devuelto||[]).forEach(d=>{
      const c = d.motivoC || 'DV-99';
      if(!r[c]) r[c] = {c:c, n:0, usd:0, uds:0};
      r[c].n++; r[c].usd += d.usd;
      r[c].uds = (r[c].uds||0) + d.lineas.reduce((a,l)=>a+l.cant, 0);
    }));
  }
  return Object.values(r)
    .map(x=>({...x, nom:(motDe(tipo, x.c)||{}).n || x.c, usd:Math.round(x.usd*100)/100}))
    .sort((a,b)=>b.n - a.n || b.usd - a.usd);
}

let MOTTIPO = 'dev';

/* selector de motivo, compartido por anulación y devolución */
function selMotivo(tipo, id, cod){
  const ls = motActivos(tipo);
  if(!ls.length) return '<div class="nota rj" style="margin:0">No hay motivos cargados. '
    + 'Agréguelos en Configuración · Motivos.</div>';
  return '<select id="'+id+'"><option value="">Elija el motivo</option>'
    + ls.map(m=>'<option value="'+esc(m.c)+'"'+(m.c === cod ? ' selected' : '')+'>'
        + esc(m.c)+' · '+esc(m.n)+'</option>').join('') + '</select>';
}
function ayudaMotivo(tipo, cod){
  const m = motDe(tipo, cod);
  if(!m) return '<div class="ayuda">De la lista, para que después se pueda contar.</div>';
  return '<div class="ayuda">'+esc(m.d)+'</div>';
}

  });
  h += '</tbody></table>'
     + '<div class="nota">Un motivo que ya se usó no se elimina: se desactiva. Deja de ofrecerse en las pantallas, '
     + 'pero las anulaciones y devoluciones viejas conservan el suyo y siguen contando en el reporte.</div></div>';

  /* el porqué, que es para lo que sirve todo esto */
  h += cardPorQue(tipo, true);
  return h;
}

function cardPorQue(tipo, solo){
  const rs = resumenMotivos(tipo);
  const nom = tipo === 'anul' ? 'Por qué anulamos' : 'Por qué nos devuelven';
  let h = '<div class="card"><h2>'+nom+'</h2>';
  if(!rs.length){
    h += '<div class="vacio"><div class="vi">📊</div>Todavía no hay '
      + (tipo === 'anul' ? 'anulaciones' : 'devoluciones')+' registradas.</div></div>';
    return h;
  }
  const tot = rs.reduce((a,x)=>a+x.n, 0), totUsd = rs.reduce((a,x)=>a+x.usd, 0);
  h += '<p class="cap">'+tot+' '+(tot === 1 ? 'caso' : 'casos')+' por USD '+fN(totUsd)+'. '
     + 'El motivo que más pesa es el que primero hay que atacar.</p>';
  h += '<div class="lineas">';
  rs.forEach(x=>{
    const pct = Math.round(x.n / tot * 100);
    h += '<div class="lin"><div class="li"><b>'+esc(x.nom)+'</b>'
      + '<div class="mini">'+esc(x.c)+' · '+x.n+' '+(x.n === 1 ? 'caso' : 'casos')
      + (x.uds ? ' · '+x.uds+' '+(x.uds === 1 ? 'unidad' : 'unidades') : '')+'</div>'
      + '<div class="bar" style="margin:7px 0 0"><div class="bt"><i style="width:'+Math.max(2,pct)+'%"></i></div></div></div>'
      + '<span class="lm">USD '+fN(x.usd)+'<div class="mini" style="text-align:right">'+pct+' %</div></span></div>';
  });
  h += '</div>';
  if(tipo === 'dev'){
    const top = rs[0];
    h += '<div class="nota az"><b>Qué hacer con esto.</b> Si lo que más se repite es «talla equivocada», el problema está '
       + 'en la tabla de tallas que publica. Si es «no era el color o el modelo pedido», está en las fotos. '
       + 'Si es «defecto de fábrica», está en el proveedor. Hoy el que más pesa es <b>'+esc(top.nom)+'</b>.</div>';
  }
  h += '</div>';
  return h;
}

    const d = $('#' + (tipo === 'dev' ? 'dv' : 'an') + '_det');
    if(d) d.placeholder = (m && m.pide)
      ? 'Obligatorio: explique qué pasó'
      : 'Opcional: agregue el detalle si hace falta';
    return;
  }
});

/* ==========================================================================
   SICOM v5 · una sola puerta: el motivo decide si anula o si devuelve
   ==========================================================================
   La cajera nunca elige tratamiento contable. Elige qué pasó.
   El sistema sabe que «error al registrar» anula y «talla equivocada» devuelve,
   y por dentro conserva la diferencia, que es la que hace falta después para
   las estadísticas, las comisiones y la nota de crédito.
   ========================================================================== */

function MOTIVOS_BASE(){ return [
  /* la venta nunca debió existir → anula */
  {c:'AN-01', n:'Error al registrar la venta',        d:'Se cargó el artículo, la talla o la cantidad equivocada.', trato:'anula',    pide:false, activo:true},
  {c:'AN-02', n:'Error en el precio cobrado',         d:'Se cobró de más o de menos y hay que rehacer la venta.',   trato:'anula',    pide:false, activo:true},
  {c:'AN-03', n:'Venta duplicada',                    d:'La misma compra se registró dos veces.',                   trato:'anula',    pide:false, activo:true},
  {c:'AN-04', n:'El cliente desistió',                d:'Se arrepintió antes de llevarse la mercancía.',            trato:'anula',    pide:false, activo:true},
  {c:'AN-05', n:'El pago no se confirmó',             d:'El pago móvil o la transferencia nunca entró.',            trato:'anula',    pide:false, activo:true},
  {c:'AN-06', n:'Prueba del sistema',                 d:'Venta de ensayo, no es una operación real.',               trato:'anula',    pide:false, activo:true},
  {c:'AN-99', n:'Otro caso de venta mal registrada',  d:'Hay que explicarlo por escrito.',                          trato:'anula',    pide:true,  activo:true},
  /* la venta fue buena y la mercancía volvió → devuelve */
  {c:'DV-01', n:'Talla equivocada',                   d:'No le sirvió la talla que se llevó.',                      trato:'devuelve', pide:false, activo:true},
  {c:'DV-02', n:'Defecto de fábrica',                 d:'Costura, cierre, herraje o material en mal estado.',       trato:'devuelve', pide:false, activo:true},
  {c:'DV-03', n:'No era el color o el modelo pedido', d:'Llegó distinto a lo que encargó.',                         trato:'devuelve', pide:false, activo:true},
  {c:'DV-04', n:'No le gustó al verlo',               d:'Compró por foto y en persona cambió de opinión.',          trato:'devuelve', pide:false, activo:true},
  {c:'DV-05', n:'Llegó dañado en el traslado',        d:'Se estropeó en el delivery.',                              trato:'devuelve', pide:false, activo:true},
  {c:'DV-06', n:'Cambio por otro artículo',           d:'Devuelve este para llevarse otro.',                        trato:'devuelve', pide:false, activo:true},
  {c:'DV-07', n:'Entrega fuera de tiempo',            d:'Llegó tarde y ya no lo necesitaba.',                        trato:'devuelve', pide:false, activo:true},
  {c:'DV-99', n:'Otro motivo de devolución',          d:'Hay que explicarlo por escrito.',                          trato:'devuelve', pide:true,  activo:true}
]; }

/* migración: las dos listas viejas pasan a una, conservando los códigos
   para que las operaciones ya registradas sigan resolviendo su motivo */
function unificaMotivos(b){
  if(b.cfg.motivos && b.cfg.motivos.length) return;
  const out = [];
  (b.cfg.motAnul || []).forEach(m=>out.push({...m, trato:'anula'}));
  (b.cfg.motDev  || []).forEach(m=>out.push({...m, trato:'devuelve'}));
  b.cfg.motivos = out.length ? out : MOTIVOS_BASE();
}

/* ---------- la lista unificada, y los mismos nombres de antes ---------- */
function motivos(){ return DB.cfg.motivos || []; }
function motUni(cod){ return motivos().find(m=>m.c === cod) || null; }
function motActivosU(){ return motivos().filter(m=>m.activo); }
function motLista(tipo){
  if(tipo === 'anul') return motivos().filter(m=>m.trato === 'anula');
  if(tipo === 'dev')  return motivos().filter(m=>m.trato === 'devuelve');
  return motivos();
}
function motActivos(tipo){ return motLista(tipo).filter(m=>m.activo); }
function motDe(tipo, cod){ return motUni(cod); }
function motUsado(tipo, cod){
  if(DB.ventas.some(v=>v.anulada && v.anulada.motivoC === cod)) return true;
  return DB.ventas.some(v=>(v.devuelto||[]).some(d=>d.motivoC === cod));
}
function motProxCod(trato){
  const pre = trato === 'anula' ? 'AN-' : 'DV-';
  const ns = motivos().filter(m=>String(m.c).startsWith(pre))
    .map(m=>parseInt(String(m.c).replace(pre,''), 10))
    .filter(n=>isFinite(n) && n < 90);
  const n = (ns.length ? Math.max.apply(null, ns) : 0) + 1;
  return pre + String(n).padStart(2, '0');
}
function tratoDe(cod){ const m = motUni(cod); return m ? m.trato : 'devuelve'; }
function anulaCon(cod){ return tratoDe(cod) === 'anula'; }

function valMotivo(tipo, cod, det){
  if(!cod) return {ok:false, msg:'Elija el motivo de la lista.'};
  const m = motUni(cod);
  if(!m) return {ok:false, msg:'Ese motivo ya no existe en la lista.'};
  if(!m.activo) return {ok:false, msg:'Ese motivo está desactivado. Elija otro.'};
  if(m.pide && String(det||'').trim().length < 10)
    return {ok:false, msg:'Con «'+m.n+'» hay que explicar por escrito qué pasó.'};
  return {ok:true, msg:''};
}
function motTexto(tipo, cod, det){
  const m = motUni(cod);
  const base = m ? m.n : (cod || 'Sin motivo');
  const d = String(det || '').trim();
  return d ? base + ' · ' + d : base;
}

/* ---------- el plazo para devolver ---------- */
function plazoDias(){ const n = +((DB.cfg||{}).diasDev); return isFinite(n) && n > 0 ? n : 15; }
function diasDesde(v){ return dias(v.fecha); }
function dentroPlazo(v){ return diasDesde(v) <= plazoDias(); }

/* ---------- las compras que un cliente puede devolver ---------- */
function comprasDe(cliId){
  return DB.ventas.filter(v=>v.cliId === cliId && !anulada(v))
    .filter(v=>v.lineas.some((l,i)=>l.cant - devueltasDe(v, i) > 0))
    .sort((a,b)=> b.fecha === a.fecha
      ? String(b.hora).localeCompare(String(a.hora))
      : b.fecha.localeCompare(a.fecha));
}
/* unidades que todavía se pueden devolver de una venta */
function porDevolver(v){
  return v.lineas.reduce((a,l,i)=>a + (l.cant - devueltasDe(v, i)), 0);
}
/* ¿esta operación necesita la firma del administrador? */
function pideClave(v, cod){
  if(!v) return false;
  if(anulaCon(cod)) return true;      // dejar una venta sin efecto nunca es rutina
  if(!dentroPlazo(v)) return true;    // fuera del plazo es una excepción, no la norma
  return false;
}
function razonClave(v, cod){
  if(anulaCon(cod)) return 'Va a dejar la venta sin efecto: eso lo autoriza el administrador.';
  if(!dentroPlazo(v)) return 'Pasaron ' + diasDesde(v) + ' días y el plazo es de ' + plazoDias()
    + ': fuera de plazo lo autoriza el administrador.';
  return '';
}

/* ==========================================================================
   SICOM v5 · pantalla de devoluciones y anulaciones, por cédula
   ========================================================================== */
let RV = null;
function nuevaRV(){
  RV = {doc:'', cliId:null, buscado:false, num:null, items:null, cod:'', det:'', clave:''};
}

function rvCliente(){
  if(!RV.cliId) return null;
  return DB.clientes.find(c=>c.id === RV.cliId) || null;
}
function rvVenta(){
  if(!RV.num) return null;
  return DB.ventas.find(v=>v.num === RV.num) || null;
}
function rvTotal(){
  const v = rvVenta(); if(!v || !RV.items) return 0;
  let t = 0;
  v.lineas.forEach((l,i)=>{ t += (RV.items[i] || 0) * l.precio; });
  return Math.round(t * 100) / 100;
}
/* con un motivo que anula, regresa la venta entera: no se negocia */
function rvSincroniza(){
  const v = rvVenta(); if(!v) return;
  if(!RV.items) RV.items = v.lineas.map(()=>0);
  if(anulaCon(RV.cod)) RV.items = v.lineas.map((l,i)=>l.cant - devueltasDe(v, i));
}

/* ==========================================================================

function rvBusca(){
  const d = (RV.doc || '').replace(/\D/g, '');
  if(!valDoc(d)){ RV.cliId = null; RV.buscado = false; RV.num = null; RV.items = null; return; }
  const c = DB.clientes.find(x=>x.doc === d);
  const antes = RV.cliId;
  RV.cliId = c ? c.id : null;
  RV.buscado = true;
  if(RV.cliId !== antes){ RV.num = null; RV.items = null; RV.cod = ''; RV.det = ''; RV.clave = ''; }
  if(c && c.id !== antes) aviso('Compras de ' + nomComp(c));
}

document.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;

  if(b.dataset.rvir){
    const v = DB.ventas.find(x=>x.num === b.dataset.rvir); if(!v) return;
    const c = DB.clientes.find(x=>x.id === v.cliId);
    nuevaRV();
    if(c){ RV.doc = c.doc; RV.cliId = c.id; RV.buscado = true; RV.num = v.num; }
    TAB = 'vta'; VSUB = 'dev'; DSUB = 'dvr'; pinta(); window.scrollTo(0, 0);
    if(!c) aviso('Esa venta no tiene cliente registrado.', true);
    return;
  }
  if(b.id === 'rv_otro'){ nuevaRV(); pinta(); return; }
  if(b.id === 'rv_can'){ RV.num = null; RV.items = null; RV.cod = ''; RV.det = ''; RV.clave = ''; pinta(); return; }
  if(b.dataset.rvsel){
    RV.num = (RV.num === b.dataset.rvsel) ? null : b.dataset.rvsel;
    RV.items = null; RV.cod = ''; RV.det = ''; RV.clave = '';
    pinta(); window.scrollTo(0, document.body.scrollHeight); return;
  }
  if(b.dataset.rvp !== undefined && b.dataset.rvp !== ''){
    const v = rvVenta(); if(!v) return;
    const i = +b.dataset.rvp, max = v.lineas[i].cant - devueltasDe(v, i);
    if(!RV.items) RV.items = v.lineas.map(()=>0);
    if(RV.items[i] < max) RV.items[i]++;
    pinta(); return;
  }
  if(b.dataset.rvm !== undefined && b.dataset.rvm !== ''){
    const i = +b.dataset.rvm;
    if(RV.items && RV.items[i] > 0) RV.items[i]--;
    pinta(); return;
  }
  if(b.id === 'rv_g'){ rvEjecuta(); return; }

  /* ------------ configuración: plazo y motivos unificados ------------ */
  if(b.id === 'pl_g'){
    const n = Math.round(pila($('#pl_d').value));
    if(!(n > 0)) return aviso('El plazo tiene que ser de al menos un día.', true);
    if(n > 365) return aviso('Un plazo mayor a un año no es un plazo.', true);
    const antes = plazoDias();
    DB.cfg.diasDev = n;
    bitacora('cfg','Plazo de devolución cambiado', antes + ' → ' + n + ' días');
    aviso('El plazo quedó en ' + n + ' días.'); pinta(); return;
  }
  if(b.id === 'mo_g'){
    const n = ($('#mo_n').value || '').trim(), d = ($('#mo_d').value || '').trim(), tr = $('#mo_t').value;
    if(n.length < 4) return aviso('Escriba el motivo: al menos cuatro letras.', true);
    if(motivos().some(m=>m.n.toLowerCase() === n.toLowerCase()))
      return aviso('Ese motivo ya está en la lista.', true);
    const c = motProxCod(tr);
    motivos().push({c:c, n:n, d:d, trato:tr, pide:false, activo:true});
    bitacora('cfg','Motivo agregado', c + ' · ' + n + ' · ' + (tr === 'anula' ? 'anula la venta' : 'devuelve mercancía'));
    aviso('Motivo ' + c + ' agregado.'); pinta(); return;
  }
  if(b.dataset.motog){
    const m = motUni(b.dataset.motog); if(!m) return;
    if(m.activo && motActivos(m.trato === 'anula' ? 'anul' : 'dev').length === 1)
      return aviso('Es el último motivo activo de ese tipo: sin ninguno no se podría registrar el caso.', true);
    m.activo = !m.activo;
    bitacora('cfg', m.activo ? 'Motivo reactivado' : 'Motivo desactivado', m.c + ' · ' + m.n);
    aviso(m.activo ? 'Motivo reactivado.' : 'Motivo desactivado: deja de ofrecerse.');
    pinta(); return;
  }
  if(b.dataset.motdel){
    const cod = b.dataset.motdel;
    if(/-99$/.test(cod)) return aviso('Ese motivo no se elimina: es la salida para lo que no estaba previsto.', true);
    if(motUsado(null, cod)) return aviso('Ese motivo ya se usó: desactívelo en lugar de borrarlo.', true);
    const m = motUni(cod); if(!m) return;
    DB.cfg.motivos = motivos().filter(x=>x.c !== cod);
    bitacora('cfg','Motivo eliminado', cod + ' · ' + m.n);
    aviso('Motivo eliminado.'); pinta(); return;
  }
});

/* ==========================================================================

   El registro sigue siendo una sola puerta —la cajera dice qué pasó y el
   sistema decide—. Lo que se separa es la consulta, porque son dos preguntas

    ? String(b.d.hora).localeCompare(String(a.d.hora))
    : b.d.fecha.localeCompare(a.d.fecha));
}

function artQueMasRegresa(){
  const c = {};

    + esc(rs.length ? rs[0].nom : '—')+'</span><span class="s">'+(rs.length ? rs[0].n+' de '+ls.length+' casos' : 'sin datos')+'</span></div></div>';

  if(conCierre.length) h += '<div class="card" style="margin-top:18px"><div class="nota rj" style="margin:0">'
    + '<b>'+conCierre.length+' '+(conCierre.length === 1 ? 'anulación cayó' : 'anulaciones cayeron')+' sobre '
    + (conCierre.length === 1 ? 'un cierre' : 'cierres')+' de caja ya firmado'+(conCierre.length === 1 ? '' : 's')+'.</b> '
    + 'El arqueo que se contó esos días sigue siendo el que se contó; lo que cambió es lo que debió haber. '

    return h + cardPorQue('anul');

  h += '<table class="dat"><thead><tr><th>Venta</th><th>Era del</th><th>Anulada el</th><th>Quién</th>'
     + '<th>Por qué</th><th class="n">USD</th><th>Cierre</th><th></th></tr></thead><tbody>';
  ls.slice(0, 80).forEach(v=>{
    const a = v.anulada, c = DB.clientes.find(y=>y.id === v.cliId) || {nom:'—', ape:''};
    h += '<tr><td><b>'+esc(v.num)+'</b><div class="mini">'+esc(nomComp(c))+'</div></td>'
      + '<td class="mini">'+fFecha(v.fecha)+'</td>'
      + '<td class="mini">'+fFecha(a.fecha)+'<div class="mini">'+esc(a.hora||'')+'</div></td>'
      + '<td class="mini">'+esc(a.por||'—')+'</td>'

/* ==========================================================================
   SICOM v6 · eventos del módulo abierto en tres
   ========================================================================== */
document.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.dsub){
    const antes = DSUB; DSUB = b.dataset.dsub;
    /* al saltar entre Devolver y Anular se conserva la cédula, pero la orden
       y la causa se limpian: son operaciones distintas, no la misma a medias */
    if(antes !== DSUB && (antes === 'dvr' || antes === 'anl') && (DSUB === 'dvr' || DSUB === 'anl')){
      RV.num = null; RV.items = null; RV.cod = ''; RV.det = ''; RV.clave = '';
    }
    pinta(); window.scrollTo(0, 0); return;
  }
  if(b.dataset.irdev){ TAB = 'vta'; VSUB = 'dev'; DSUB = b.dataset.irdev; pinta(); window.scrollTo(0, 0); return; }
});

/* ==========================================================================
   SICOM v7 · dos caminos separados: Devolver y Anular
   ==========================================================================
   Devolver: cédula → orden → productos → causa.
   Anular:   cédula → orden → causa.
   Cada uno con sus propias causas. Si alguien entra por la puerta equivocada,
   el sistema no lo tranca: le ofrece cruzar sin perder lo que ya escribió.
   ========================================================================== */

function esDevolver(){ return DSUB === 'dvr'; }
function esAnular(){ return DSUB === 'anl'; }
function t2Anu(){ const t = tasaVigente(); return t ? t.bcv : 0; }

/* las compras que se pueden tocar, según el camino */
function comprasPara(cliId, modo){
  const ls = DB.ventas.filter(v=>v.cliId === cliId && !anulada(v));
  const out = modo === 'anular'
    ? ls
    : ls.filter(v=>v.lineas.some((l,i)=>l.cant - devueltasDe(v, i) > 0));
  return out.sort((a,b)=> b.fecha === a.fecha
    ? String(b.hora).localeCompare(String(a.hora))
    : b.fecha.localeCompare(a.fecha));
}

/* ========================================================================== */
function vistaDevMod(){
  const np = pendDev().length, na = DB.ventas.filter(anulada).length;
  const nd = DB.ventas.reduce((a,v)=>a+(v.devuelto||[]).length, 0);
  let h = '<h1>Devoluciones y anulaciones</h1>'
    + '<p class="sub">Dos cosas distintas, cada una por su lado. <b>Devolver</b> es cuando la venta estuvo bien y la '
    + 'mercancía regresó. <b>Anular</b> es cuando la venta nunca debió existir. Las dos últimas pestañas son para consultar.</p>'
    + '<div class="subtabs">'
    + '<button data-dsub="dvr" class="'+(DSUB === 'dvr' ? 'on' : '')+'">↩ Devolver</button>'
    + '<button data-dsub="anl" class="'+(DSUB === 'anl' ? 'on' : '')+'">✕ Anular</button>'
    + '<span class="sepsub"></span>'
    + '<button data-dsub="dev" class="'+(DSUB === 'dev' ? 'on' : '')+'">Devoluciones'+(nd ? ' ('+nd+')' : '')
    + (np ? ' · '+np+' por pagar' : '')+'</button>'
    + '<button data-dsub="anu" class="'+(DSUB === 'anu' ? 'on' : '')+'">Anulaciones'+(na ? ' ('+na+')' : '')+'</button>'
    + '</div>';
  if(DSUB === 'dev') return h + histDevoluciones();

  return h + flujoDevolver();
}

/* ============================================== 1 · quién, en los dos ===== */
function rvPasoCedula(){
  const c = rvCliente(), modo = esAnular() ? 'anular' : 'devolver';
  let h = '<div class="card"><h2>'+(esAnular() ? '¿De quién es la venta?' : '¿Quién devuelve?')+'</h2>'
    + '<p class="cap">'+(esAnular()
        ? 'La cédula del comprador de la venta que se va a dejar sin efecto.'
        : 'La cédula del comprador. Solo se puede devolver contra una compra registrada a su nombre.')+'</p>'
    + '<div class="fila"><div style="flex:0 1 280px"><label class="f">Cédula</label>'
    + '<input id="rv_doc" value="'+esc(RV.doc)+'" inputmode="numeric" maxlength="9" autocomplete="off" '
    + 'placeholder="Escriba la cédula"'+(RV.doc ? ' class="'+(valDoc(RV.doc) ? 'bien' : 'mal')+'"' : '')+'></div>';
  if(RV.doc && !valDoc(RV.doc))
    h += '<div style="align-self:flex-end"><div class="err" style="margin:0 0 12px">La cédula lleva entre 6 y 9 dígitos.</div></div>';
  h += '</div>';

  if(valDoc(RV.doc) && RV.buscado && !c)
    h += '<div class="nota rj" style="margin-top:14px"><b>No hay ningún cliente con esa cédula.</b> '
       + 'Si la compra se hizo a nombre de otra persona, busque con esa cédula.</div>';

  if(c){
    const cs = comprasPara(c.id, modo);
    h += '<div class="hallado" style="margin-top:14px"><span class="av">'+esc(ini(c))+'</span>'
      + '<div style="flex:1"><b>'+esc(nomComp(c))+'</b>'
      + '<div class="mini" style="margin-top:4px">V-'+esc(c.doc)+' · '+esc(telComp(c))+' · '+esc(c.mail||'sin correo')+'</div>'
      + '<div class="mini">'+(esAnular()
          ? cs.filter(v=>!puedeAnular(v)).length + ' ' + (cs.filter(v=>!puedeAnular(v)).length === 1
              ? 'orden que se puede anular' : 'órdenes que se pueden anular')
          : cs.filter(v=>!puedeDevolver(v)).length + ' ' + (cs.filter(v=>!puedeDevolver(v)).length === 1
              ? 'orden con artículos por devolver' : 'órdenes con artículos por devolver'))+'</div></div>'
      + '<button class="b sm gh" id="rv_otro">Otra cédula</button></div>';

/* ============================================ 2 · cuál orden, en los dos == */
function rvPasoOrdenes(){
  const c = rvCliente(), modo = esAnular() ? 'anular' : 'devolver';
  const cs = comprasPara(c.id, modo);
  let h = '<div class="card"><h2>¿Cuál orden?</h2>';

  if(esAnular()){
    h += '<p class="cap">Elija el número de orden que se va a dejar sin efecto. Se anula completa: no hay anulación a medias.</p>';
  }else{
    h += '<p class="cap">Elija el número de orden de la compra. El plazo para devolver es de <b>'+plazoDias()+' días</b>; '
       + 'lo que esté fuera sigue apareciendo, pero lo autoriza el administrador.</p>';
  }

  if(!cs.length){
    h += '<div class="vacio"><div class="vi">🧾</div>'+esc(c.nom)
       + (esAnular() ? ' no tiene órdenes que se puedan anular.' : ' no tiene compras con artículos por devolver.')
       + '</div></div>';
    return h;
  }

  h += '<div class="ordenes">';
  cs.forEach(v=>{
    const d = diasDesde(v), sel = RV.num === v.num;
    const bloq = esAnular() ? puedeAnular(v) : puedeDevolver(v);
    const porVue = !esAnular() && vueltoPendDe(v) > 0.005;
    const fuera = !esAnular() && !dentroPlazo(v);
    h += '<button class="orden'+(sel ? ' on' : '')+(bloq ? ' no' : '')+'" data-rvsel="'+esc(v.num)+'"'
      + (bloq ? ' disabled' : '')+'>'
      + '<span class="onum">'+esc(v.num)+'</span>'
      + '<span class="oinf"><b>'+fFecha(v.fecha)+'</b> · '+(d === 0 ? 'hoy' : 'hace '+d+' '+(d === 1 ? 'día' : 'días'))
      + ' · '+esc(v.canal||'')+'<span class="omini">'
      + (esAnular()
          ? v.lineas.reduce((a,l)=>a+l.cant, 0)+' '+(v.lineas.reduce((a,l)=>a+l.cant, 0) === 1 ? 'artículo' : 'artículos')
            +' · '+v.lineas.map(l=>esc(l.nom)).slice(0,3).join(' · ')
          : porDevolver(v)+' '+(porDevolver(v) === 1 ? 'unidad' : 'unidades')+' por devolver · '
            +v.lineas.filter((l,i)=>l.cant - devueltasDe(v,i) > 0).map(l=>esc(l.nom)).slice(0,3).join(' · '))
      + '</span></span>'
      + '<span class="omonto">USD '+fN(v.total)+'</span>'
      + '<span class="oest">'+(porVue ? '<span class="chip mal">vuelto pendiente</span>'
          : bloq ? '<span class="chip mal">tiene devoluciones</span>'
          : fuera ? '<span class="chip avi">fuera de plazo</span>'
          : sel ? '<span class="chip ok">elegida</span>' : '<span class="chip">elegir</span>')+'</span>'
      + '</button>';
  });
  h += '</div>';
  if(cs.some(v=>esAnular() && puedeAnular(v)))
    h += '<div class="nota">Una orden con devoluciones ya registradas no se puede anular: el inventario quedaría descuadrado. '
       + 'Registre el resto como devolución.</div>';
  const cv = cs.filter(v=>!esAnular() && vueltoPendDe(v) > 0.005);
  if(cv.length)
    h += '<div class="nota rj"><b>'+cv.length+' '+(cv.length===1?'orden tiene':'órdenes tienen')
       + ' un vuelto pendiente y no admite'+(cv.length===1?'':'n')+' devolución.</b> '
       + 'Mientras se le deba dinero de esa misma venta, devolver parte de la mercancía deja dos deudas cruzadas '
       + 'sobre una sola operación. Entréguele el vuelto en <b>Tesorería · Vueltos y devoluciones</b> y la orden '
       + 'se libera, o anule la venta completa.'
       + '<div style="margin-top:10px"><button class="b sm gh" data-irtes="vueltos">Ir a entregar el vuelto</button> '
       + '<button class="b sm gh" data-cruza="anl">Pasar a anulación</button></div></div>';
  h += '</div>';
  return h;
}

/* ================================= 3a · DEVOLVER: productos y causa ======= */
function flujoDevolver(){
  if(!RV) nuevaRV();
  let h = '<div class="nota az" style="margin:0 0 18px"><b>La clienta trajo mercancía de vuelta.</b> '
    + 'La venta sigue siendo válida y el vendedor la hizo; solo se descuenta lo que regresó. '
    + 'Si lo que pasó es que la venta se registró mal, eso no se devuelve: se anula.</div>';
  h += rvPasoCedula();
  if(!RV.cliId) return h;
  h += rvPasoOrdenes();
  if(!RV.num) return h;

  const v = rvVenta(); if(!v) return h;
  if(!RV.items) RV.items = v.lineas.map(()=>0);
  const t = tasaVigente(), usd = rvTotal();
  const m = motUni(RV.cod);
  const fuera = !dentroPlazo(v);

  h += '<div class="card editando"><h2>¿Qué artículos regresan de la orden '+esc(v.num)+'?</h2>'
     + '<p class="cap">Marque cuántas unidades vuelven de cada artículo. Puede ser una parte de la compra.</p>'
     + '<div class="lineas">';
  v.lineas.forEach((l,i)=>{
    const ya = devueltasDe(v, i), max = l.cant - ya, n = RV.items[i] || 0;
    h += '<div class="lin"><div class="li"><b>'+esc(l.nom)+(l.talla ? ' · '+esc(l.talla) : '')+'</b>'
      + '<div class="mini">USD '+fN(l.precio)+' c/u · se llevó '+l.cant
      + (ya ? ' · ya devolvió '+ya : '')+(max <= 0 ? ' · <b>nada más por devolver</b>' : '')+'</div></div>'
      + '<button class="b sm gh" data-rvm="'+i+'"'+(n <= 0 ? ' disabled' : '')+'>−</button>'
      + '<b style="min-width:20px;text-align:center">'+n+'</b>'
      + '<button class="b sm gh" data-rvp="'+i+'"'+(n >= max ? ' disabled' : '')+'>+</button>'
      + '<span class="lm">'+fN(n*l.precio)+'</span></div>';
  });
  h += '</div>';

  h += '<div class="visor"><span class="vk">Se le devuelve</span><div class="vn">USD '+fN(usd)+'</div>'
     + (t ? '<span class="veq">Bs '+fN(usd*t.bcv)+' a la tasa de hoy · '+fN(t.bcv,2)+'</span>'
          : '<span class="veq">Sin tasa confirmada</span>')+'</div>';
  h += '<div class="nota az" style="margin-top:14px"><b>Por qué en dólares.</b> La compra se pactó en dólares, así que '
     + 'eso es lo que se le devuelve. Si se le paga en bolívares, se calcula a la tasa de hoy, no a la del día de la '
     + 'compra: es lo que le cuesta a ella reponer la prenda hoy.</div>';

  h += '<div class="fila" style="margin-top:16px">'
     + '<div><label class="f">Causa de la devolución</label>'
     + '<select id="rv_mot"><option value="">Elija la causa</option>'
     + motActivos('dev').map(x=>'<option value="'+esc(x.c)+'"'+(x.c === RV.cod ? ' selected' : '')+'>'
         + esc(x.n)+'</option>').join('')+'</select>'
     + '<div class="ayuda" id="rv_motayuda">'+(m ? esc(m.d) : 'De la lista, para que después se pueda contar.')+'</div></div>'
     + '<div style="flex:2 1 320px"><label class="f">Detalle'+(m && m.pide ? '' : ' (opcional)')+'</label>'
     + '<input id="rv_det" value="'+esc(RV.det)+'" maxlength="140" placeholder="'
     + (m && m.pide ? 'Obligatorio: explique qué pasó' : 'Opcional: agregue el detalle si hace falta')+'"></div>'
     + '</div>';

  if(fuera){
    if(!hayClave()){
      h += '<div class="nota rj" style="margin-top:16px"><b>Esta compra está fuera de plazo</b> —pasaron '+diasDesde(v)
         + ' días y el plazo es de '+plazoDias()+'— y no hay clave de administrador definida.</div>'
         + '<div class="acc"><button class="b oro" data-goto="ger|seg">Ir a definir la clave →</button></div></div>';
      return h;
    }
    h += '<div style="margin-top:16px"><label class="f">Clave de administrador</label>'
       + '<input id="rv_cla" type="password" value="'+esc(RV.clave)+'" maxlength="40" autocomplete="off" '
       + 'placeholder="Escriba la clave"><div class="ayuda">Pasaron '+diasDesde(v)+' días y el plazo es de '
       + plazoDias()+': fuera de plazo lo autoriza el administrador.</div></div>';
  }

  const listo = !!m && usd > 0.005;
  h += '<div class="acc"><button class="b oro" id="rv_g"'+(listo ? '' : ' disabled')+'>'
     + (usd < 0.005 ? 'Marque qué artículos regresan'
        : !m ? 'Elija la causa de la devolución'
        : 'Registrar la devolución de USD '+fN(usd))+'</button>'
     + '<button class="b gh" id="rv_can">← Elegir otra orden</button>'
     + '<button class="b gh" data-cruza="anl">Esto no es devolución, es anulación →</button></div></div>';
  return h;
}

/* ==================================== 3b · ANULAR: solo la causa ========== */
function flujoAnular(){
  if(!RV) nuevaRV();
  let h = '<div class="nota rj" style="margin:0 0 18px"><b>La venta nunca debió existir.</b> '
    + 'Anular la deja sin efecto: la mercancía vuelve completa al inventario y el cliente pierde esa compra de su '
    + 'historial. Si lo que pasó es que la clienta trajo mercancía de vuelta, eso no se anula: se devuelve.</div>';
  h += rvPasoCedula();
  if(!RV.cliId) return h;
  h += rvPasoOrdenes();
  if(!RV.num) return h;

  const v = rvVenta(); if(!v) return h;
  const c = rvCliente(), m = motUni(RV.cod);
  const cie = DB.cierres.find(x=>x.fecha === v.fecha);
  const vp = DB.vpend.filter(x=>x.venta === v.num && !x.anulado);
  const entregado = vp.reduce((a,x)=>a+(x.usd-x.saldo), 0);

  const aDevolver = devolverAlAnular(v);
  const cobrado = (v.fis && v.fis.cobrado) ? v.fis.cobrado : v.total;
  h += '<div class="card editando"><h2>¿Por qué se anula la orden '+esc(v.num)+'?</h2>'
     + '<p class="cap">La orden se anula completa, por USD '+fN(v.total)+'. Elija la causa.</p>';

  h += '<div class="visor visor-anu"><span class="vk">Devuélvale ahora mismo</span>'
     + '<div class="vn">USD '+fN(aDevolver)+'</div>'
     + (t2Anu(v) ? '<span class="veq">Bs '+fN(aDevolver * t2Anu(v))+' a la tasa de hoy</span>' : '')
     + '</div>';
  h += '<div class="nota" style="margin-top:12px">'
     + 'Es lo que la clienta puso sobre el mostrador y todavía está en la caja. '
     + 'La cuenta era de USD '+fN(cobrado)+'.'
     + (entregado > 0.005 ? ' Ya se le habían entregado USD '+fN(entregado)+', y eso está descontado.' : '')
     + ' Anular reversa la operación completa: entregado esto, no queda deuda con nadie.</div>';

  h += '<div class="lineas">'
     + '<div class="lin"><div class="li"><b>Vuelven al inventario</b><div class="mini">'
     + v.lineas.map(l=>l.cant+'× '+esc(l.nom)+(l.talla ? ' '+esc(l.talla) : '')).join(' · ')
     + '</div></div><span class="lm">'+v.lineas.reduce((a,l)=>a+l.cant, 0)+' und</span></div>'
     + '<div class="lin"><div class="li"><b>'+esc(nomComp(c))+' deja de acumular</b>'
     + '<div class="mini">una compra menos y USD '+fN(v.total)+' menos en su historial</div></div>'
     + '<span class="lm">−'+fN(v.total)+'</span></div>';
  if(DB.accionista.some(x=>x.venta === v.num))
    h += '<div class="lin"><div class="li"><b>Se revierte el movimiento del accionista</b>'
       + '<div class="mini">con un asiento contrario, no borrando el original</div></div></div>';
  if(vp.length)
    h += '<div class="lin"><div class="li"><b>Se cancela el vuelto pendiente</b><div class="mini">'
       + 'USD '+fN(vp.reduce((a,x)=>a+x.saldo, 0))+' que todavía no se le había entregado</div></div></div>';
  h += '</div>';

  if(cie) h += '<div class="nota rj" style="margin-top:14px"><b>Ojo: el '+fFecha(v.fecha)+' ya tiene cierre de caja '
     + 'firmado.</b> Anular esta orden cambia lo que ese día debió haber en caja, y el arqueo que se contó deja de '
     + 'coincidir. El sistema lo marca como afectado y deja constancia. Es lo correcto, pero sépalo antes.</div>';
  if(entregado > 0.005) h += '<div class="nota" style="margin-top:14px"><b>Ya se le había entregado USD '
     + fN(entregado)+' de vuelto.</b> Ese dinero ya salió, así que está descontado de lo que hay que '
     + 'devolverle ahora. No hay que cobrarle nada aparte.</div>';

  h += '<div class="fila" style="margin-top:16px">'
     + '<div><label class="f">Causa de la anulación</label>'
     + '<select id="rv_mot"><option value="">Elija la causa</option>'
     + motActivos('anul').map(x=>'<option value="'+esc(x.c)+'"'+(x.c === RV.cod ? ' selected' : '')+'>'
         + esc(x.n)+'</option>').join('')+'</select>'
     + '<div class="ayuda" id="rv_motayuda">'+(m ? esc(m.d) : 'De la lista, para que después se pueda contar.')+'</div></div>'
     + '<div style="flex:2 1 320px"><label class="f">Detalle'+(m && m.pide ? '' : ' (opcional)')+'</label>'
     + '<input id="rv_det" value="'+esc(RV.det)+'" maxlength="140" placeholder="'
     + (m && m.pide ? 'Obligatorio: explique qué pasó' : 'Opcional: agregue el detalle si hace falta')+'"></div>'
     + '</div>';

  if(!hayClave()){
    h += '<div class="nota rj" style="margin-top:16px"><b>Falta la clave de administrador.</b> '
       + 'Anular no debería poder hacerlo cualquiera. Defínala en Gerencial · Seguridad y vuelva.</div>'
       + '<div class="acc"><button class="b oro" data-goto="ger|seg">Ir a definir la clave →</button></div></div>';
    return h;
  }
  h += '<div style="margin-top:16px"><label class="f">Clave de administrador</label>'
     + '<input id="rv_cla" type="password" value="'+esc(RV.clave)+'" maxlength="40" autocomplete="off" '
     + 'placeholder="Escriba la clave"><div class="ayuda">Sin ella la anulación no procede.</div></div>';

  h += '<div class="acc"><button class="b oro" id="rv_g"'+(m ? '' : ' disabled')+'>'
     + (m ? 'Anular y devolver USD '+fN(aDevolver) : 'Elija la causa de la anulación')+'</button>'
     + '<button class="b gh" id="rv_can">← Elegir otra orden</button>'
     + '<button class="b gh" data-cruza="dvr">Esto no es anulación, es devolución →</button></div></div>';
  return h;
}

/* ==========================================================================
   SICOM v7 · eventos de los dos caminos separados
   ========================================================================== */

/* ejecuta según el camino, no según el motivo */
function rvEjecuta(){
  if(trancaTasa(esAnular() ? 'anular la venta' : 'registrar la devolución')) return;
  const v = rvVenta(); if(!v) return aviso('Elija primero la orden.', true);
  const tipo = esAnular() ? 'anul' : 'dev';
  const vm = valMotivo(tipo, RV.cod, RV.det); if(!vm.ok) return aviso(vm.msg, true);

  /* la causa tiene que corresponder al camino: si no, se cruza, no se rompe */
  const debe = anulaCon(RV.cod) ? 'anl' : 'dvr';
  if((esAnular() ? 'anl' : 'dvr') !== debe){
    DSUB = debe; pinta();
    return aviso('Esa causa corresponde a ' + (debe === 'anl' ? 'una anulación' : 'una devolución')
      + '. Lo llevé al camino correcto.', true);
  }

  if(esAnular()){
    if(!hayClave()) return aviso('Primero defina la clave de administrador en Gerencial · Seguridad.', true);
    if(!claveOK(RV.clave)) return aviso('La clave de administrador no es correcta.', true);
    const no = puedeAnular(v); if(no) return aviso(no, true);
    anularVenta(v.num, RV.cod, RV.det, RV.clave);
    if(anulada(v)){ nuevaRV(); TAB = 'vta'; VSUB = 'dev'; DSUB = 'anl'; pinta(); window.scrollTo(0, 0); }
    return;
  }

  /* devolver */
  const nod = puedeDevolver(v); if(nod) return aviso(nod, true);
  if(!RV.items || rvTotal() < 0.005) return aviso('Marque qué artículos regresan.', true);
  if(!dentroPlazo(v)){
    if(!hayClave()) return aviso('Primero defina la clave de administrador en Gerencial · Seguridad.', true);
    if(!claveOK(RV.clave)) return aviso('La clave de administrador no es correcta.', true);
    bitacora('dev','Autorizada fuera de plazo',
      v.num + ' · ' + diasDesde(v) + ' días desde la compra, el plazo es de ' + plazoDias());
  }
  DEV = RV.items.slice();
  VSEL = v.num;
  /* registraDevolucion lleva a Tesorería con la devolución lista para pagar:
     ahí es donde tiene que estar la cajera enseguida, con el dinero en mano */
  registraDevolucion(v.num, RV.cod, RV.det);
  nuevaRV(); DSUB = 'dvr';
}

document.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  /* cruzar de camino conservando cédula y orden */
  if(b.dataset.cruza){
    DSUB = b.dataset.cruza;
    RV.cod = ''; RV.det = ''; RV.clave = ''; RV.items = null;
    const v = rvVenta();
    if(v && DSUB === 'anl' && puedeAnular(v)){ RV.num = null; }
    if(v && DSUB === 'dvr' && (puedeDevolver(v)
        || !comprasPara(RV.cliId, 'devolver').some(x=>x.num === v.num))){ RV.num = null; }
    pinta(); window.scrollTo(0, 0);
    aviso(DSUB === 'anl' ? 'Pasó al camino de anulación.' : 'Pasó al camino de devolución.');
    return;
  }
});

/* ==========================================================================
   SICOM · CONTABILIDAD · eventos de los modelos de asiento
   ========================================================================== */
document.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;

  if(b.dataset.ksub){ KSUB = b.dataset.ksub; KMOD = null; pinta(); return; }
  if(b.dataset.kfam){ KFAM = b.dataset.kfam; KMOD = null; pinta(); window.scrollTo(0,0); return; }
  if(b.dataset.kmod){ KMOD = (KMOD === b.dataset.kmod) ? null : b.dataset.kmod; pinta(); return; }

  /* guardar las cuentas de un modelo */
  if(b.dataset.kgua){
    const m = modeloDe(b.dataset.kgua); if(!m) return;
    const nuevas = m.lineas.map((l,i)=>{ const s = $('#mo_c_'+m.c+'_'+i); return s ? s.value : l.cta; });
    /* los modelos nacen en blanco: obligar a llenar las seis líneas de una
       vez impediría guardar el avance. Se permite ir de a poco y la pantalla
       lleva la cuenta de lo que falta. */
    const faltan = nuevas.filter(c=>!c).length;
    /* una cuenta que aparece en el debe y en el haber del mismo asiento se
       cancela sola: el asiento cuadra pero no mueve nada. Las líneas todavía
       sin asignar no cuentan: dos vacías no son «la misma cuenta». */
    const dd = {}, hh = {};
    m.lineas.forEach((l,i)=>{ if(nuevas[i]) (l.nat === 'D' ? dd : hh)[nuevas[i]] = true; });
    const ambas = Object.keys(dd).filter(c=>hh[c]);
    if(ambas.length) return aviso('La cuenta ' + ambas[0]
      + ' quedaría en el debe y en el haber del mismo asiento: se cancelaría sola.', true);
    const cam = [];
    nuevas.forEach((c,i)=>{ if(c !== m.lineas[i].cta)
      cam.push('línea '+(i+1)+': '+(m.lineas[i].cta || 'sin cuenta')+' → '+(c || 'sin cuenta')); });
    if(!cam.length) return aviso('No cambió ninguna cuenta.');
    /* una cuenta que no existe se avisa, pero no se bloquea: puede que la vaya
       a crear enseguida. Lo que no se hace es dejarlo pasar en silencio. */
    const inex = nuevas.filter(c=>c && !esCtaDin(c) && !ctaNom(c));
    nuevas.forEach((c,i)=>{ m.lineas[i].cta = c; });
    m.ver = (m.ver || 1) + 1;
    bitacora('conta','Modelo de asiento modificado',
      m.c + ' · ' + m.n + ' · v' + (m.ver-1) + ' → v' + m.ver + ' · ' + cam.join(' · '));
    aviso(inex.length
      ? 'Guardado como v'+m.ver+', pero '+inex.join(', ')+' no está en el catálogo.'
      : faltan
        ? 'Modelo '+m.c+' guardado como v'+m.ver+' · quedan '+faltan+' '
          +(faltan===1?'línea':'líneas')+' por asignar.'
        : 'Modelo '+m.c+' guardado como v'+m.ver+' · completo.', inex.length ? true : false);
    pinta(); return;
  }

  /* activar o desactivar */
  if(b.dataset.kmtog){
    const m = modeloDe(b.dataset.kmtog); if(!m) return;
    m.activo = (m.activo === false);
    m.ver = (m.ver || 1) + 1;
    bitacora('conta', m.activo ? 'Modelo de asiento activado' : 'Modelo de asiento desactivado',
      m.c + ' · ' + m.n + ' · v' + m.ver);
    aviso(m.activo ? 'Modelo '+m.c+' activado.'
      : 'Modelo '+m.c+' desactivado: las operaciones de ese tipo dejan de generar asiento.', !m.activo);
    pinta(); return;
  }

  /* volver al de fábrica */
  if(b.dataset.krest){
    const m = modeloDe(b.dataset.krest); if(!m) return;
    const f = MODELOS_BASE().find(x=>x.c === m.c);
    if(!f) return aviso('Este modelo no tiene versión de fábrica.', true);
    const igual = JSON.stringify(f.lineas) === JSON.stringify(m.lineas) && m.activo !== false;
    if(igual) return aviso('Ya está en blanco.');
    if(!confirm('¿Dejar el modelo ' + m.c + ' sin cuentas asignadas?\n\n'
      + 'La estructura del asiento se conserva; las cuentas que usted asignó se pierden. '
      + 'Los comprobantes ya generados no se tocan.')) return;
    m.lineas = JSON.parse(JSON.stringify(f.lineas));
    m.activo = true;
    m.ver = (m.ver || 1) + 1;
    bitacora('conta','Modelo de asiento restaurado', m.c + ' · ' + m.n + ' · v' + m.ver + ' · sin cuentas asignadas');
    aviso('Modelo '+m.c+' quedó sin cuentas, como v'+m.ver+'.');
    pinta(); return;
  }
});

/* ==========================================================================
   SICOM v18 · eventos de la nueva navegación
   ========================================================================== */
function bajaArchivo(nombre, texto, tipo){
  const b = new Blob([texto], {type: (tipo||'text/csv') + ';charset=utf-8'});
  const u = URL.createObjectURL(b), a = document.createElement('a');
  a.href = u; a.download = nombre; document.body.appendChild(a); a.click();
  document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(u), 1500);
}

    DB.fisc.iaeAlic = r2(a); DB.fisc.iaeMin = r2(m);
    bitacora('trib','Alícuota de actividades económicas',
      fN(r2(a),2) + ' %' + (m > 0 ? ' · mínimo USD ' + fN(r2(m)) : ''));
    aviso('Alícuota guardada: ' + fN(r2(a),2) + ' %.');
    pinta(); return;
  }
  if(b.dataset.irtrib){ TAB='trib'; BSUB=b.dataset.irtrib; pinta(); window.scrollTo(0,0); return; }
});
