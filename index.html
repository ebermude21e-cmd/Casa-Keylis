  if(v.delivUSD>0) h += 'Delivery ' + fN(v.delivUSD) + '<br>';
  h += '<b>TOTAL USD ' + fN(v.totalUSD) + '</b><br>';
  if(t) h += 'TOTAL Bs ' + fN(v.totalUSD*t) + '<br>Tasa BCV ' + fN(t) + '<br>';
  h += '<hr>';
  v.cobros.forEach(c=>{ const m=METODOS.find(x=>x.k===c.met); h += esc(m.n)+' '+(c.mon==='BS'?'Bs ':'USD ')+fN(c.monto)+(c.ref?' ref.'+esc(c.ref):'')+'<br>'; });
  if(v.vuelto){ const m=METODOS.find(x=>x.k===v.vuelto.met); h += 'Vuelto '+esc(m.n)+' USD '+fN(v.vuelto.usd)+'<br>'; }
  h += '<hr><div style="text-align:center" class="mini">Gracias por su compra</div>';
  h += '</div></div></div>';
  return h;
}

/* ==========================================================================
   Ventas · detalle y trazabilidad completa, con foco en el vuelto
   ========================================================================== */
let verVenta = null;

function nomMet(k){ const m = METODOS.find(x=>x.k===k); return m ? m.n : k; }
function vueltosDe(ls){ return ls.filter(v=>v.vuelto).reduce((a,v)=>a+v.vuelto.usd, 0); }

PANT.vtas = function(){
  const ls = DB.ventas.slice().reverse();
  let h = '<h1>Ventas</h1>';
  if(!ls.length){
    return h + '<p class="sub">Todavía no se ha registrado ninguna venta.</p>'
      + '<div class="card"><div class="vacio"><div class="vi">⌕</div><p class="note" style="margin:0">Sin ventas registradas.</p>'
      + (listoParaVender()?'<button class="b" data-ir="caja" style="margin-top:14px">Registrar la primera venta</button>':'')+'</div></div>';
  }
  const hoy = ls.filter(v=>v.fecha.slice(0,10)===hoyISO());
  const tot = a => a.reduce((x,v)=>x+v.totalUSD,0);
  const marg= a => a.reduce((x,v)=>x+(v.margenUSD||0),0);
  const conVuelto = ls.filter(v=>v.vuelto);

  h += '<p class="sub">Toque cualquier venta para ver su detalle completo: qué se llevó, cómo pagó, cuánto se le devolvió y con qué referencia.</p>'
    + '<div class="grid4">'
    + '<div class="card"><div class="k">Hoy</div><div class="v">'+fN(tot(hoy))+'<span class="u">USD</span></div><div class="d">'+hoy.length+' '+(hoy.length===1?'venta':'ventas')+'</div></div>'
    + '<div class="card"><div class="k">Acumulado</div><div class="v">'+fN(tot(ls))+'<span class="u">USD</span></div><div class="d">'+ls.length+' ventas</div></div>'
    + '<div class="card"><div class="k">Margen acumulado</div><div class="v">'+fN(marg(ls))+'<span class="u">USD</span></div><div class="d">'+(tot(ls)>0?fN(marg(ls)/tot(ls)*100)+' % sobre venta':'—')+'</div></div>'
    + '<div class="card"><div class="k">Vueltos entregados</div><div class="v">'+fN(vueltosDe(ls))+'<span class="u">USD</span></div><div class="d">en '+conVuelto.length+' de '+ls.length+' ventas</div></div>'
    + '</div>';

  h += '<div class="card"><table class="dat"><thead><tr><th>N°</th><th>Fecha</th><th>Cliente</th><th>Canal</th><th>Vendedor</th><th class="n">Unid.</th><th class="n">Total USD</th><th>Vuelto</th><th class="n">Margen</th></tr></thead><tbody>';
  ls.forEach(v=>{
    const c = DB.clientes.find(x=>x.id===v.clienteId);
    const vd = DB.vendedores.find(x=>x.id===v.vendedorId);
    h += '<tr class="filaclic'+(verVenta===v.id?' on':'')+'" data-vventa="'+v.id+'">'
      + '<td class="mono">'+esc(v.num)+'</td><td>'+fFecha(v.fecha)+' <span class="mini">'+fHora(v.fecha)+'</span></td>'
      + '<td>'+(c?esc(c.nom):'Ocasional')+'</td><td>'+esc(v.canal)+'</td><td>'+(vd?esc(vd.nom):'—')+'</td>'
      + '<td class="n">'+v.lineas.reduce((a,l)=>a+l.cant,0)+'</td><td class="n"><b>'+fN(v.totalUSD)+'</b></td>'
      + '<td>'+(v.vuelto
          ? '<span class="badge" style="background:var(--warn-bg);color:var(--warn-ink)">USD '+fN(v.vuelto.usd)+'</span>'
            +'<div class="mini">'+esc(nomMet(v.vuelto.met))+(v.vuelto.ref?' · ref. '+esc(v.vuelto.ref):'')+'</div>'
          : '<span class="mini">—</span>')+'</td>'
      + '<td class="n">'+fN(v.margenUSD||0)+'</td></tr>';
  });
  h += '</tbody></table></div>';

  if(verVenta){
    const v = DB.ventas.find(x=>x.id===verVenta);
    if(v) h += detalleVenta(v);
  }
  return h;
};

/* ------------------------- detalle de una venta ------------------------- */
function detalleVenta(v){
  const c = DB.clientes.find(x=>x.id===v.clienteId);
  const vd = DB.vendedores.find(x=>x.id===v.vendedorId);
  const z = v.zonaId ? DB.delivery.zonas.find(x=>x.id===v.zonaId) : null;
  const t = v.tasaBCV;
  const pagado = v.cobros.reduce((a,x)=>a + (x.mon==='BS' ? x.monto/(t||1) : x.monto), 0);

  let h = '<div class="card detalle"><h2 style="margin-top:0">Venta '+esc(v.num)+'</h2>'
    + '<p class="note" style="margin-top:0">Registrada el '+fFecha(v.fecha)+' a las '+fHora(v.fecha)
    + (t?' · tasa BCV '+fN(t):'')+'. Ninguna venta se puede borrar ni editar: si hay un error, se anula con su motivo y se emite el reverso.</p>';

  h += '<div class="grid2" style="align-items:start;margin-top:16px">';

  /* qué se llevó */
  h += '<div><h3 style="font-size:14.5px;margin:0 0 9px">Qué se llevó</h3>'
    + '<table class="dat"><thead><tr><th>Artículo</th><th class="n">Cant.</th><th class="n">Precio</th><th class="n">Subtotal</th></tr></thead><tbody>';
  v.lineas.forEach(l=>{
    h += '<tr><td><b>'+esc(l.nom)+'</b>'+(l.talla?' <span class="tal">'+esc(l.talla)+'</span>':'')
      + '<div class="mini">'+esc(l.sku)+' · costo USD '+fN(l.costo)+'</div></td>'
      + '<td class="n">'+l.cant+'</td><td class="n">'+fN(l.precio)+'</td><td class="n"><b>'+fN(l.precio*l.cant)+'</b></td></tr>';
  });
  h += '</tbody></table>'
    + '<table class="dat" style="margin-top:10px"><tbody>'
    + '<tr><td>Canal</td><td class="n">'+esc(v.canal)+'</td></tr>'
    + '<tr><td>Entrega</td><td class="n">'+(v.entrega==='delivery'
        ? (z?esc(z.nom):'Delivery')+' · USD '+fN(v.delivUSD)+(v.exoDeliv?' <span class="badge ok">exonerado</span>':'')
        : 'Retiro en la tienda')+'</td></tr>'
    + '<tr><td>Vendedor</td><td class="n">'+(vd?esc(vd.nom)+' · comisión USD '+fN(v.comision):'Autoservicio · sin comisión')+'</td></tr>'
    + '<tr><td>Margen bruto</td><td class="n">USD '+fN(v.margenUSD)+'</td></tr>'
    + '<tr><td><b>Total</b></td><td class="n"><b>USD '+fN(v.totalUSD)+'</b>'+(t?'<div class="mini">Bs '+fN(v.totalUSD*t)+'</div>':'')+'</td></tr>'
    + '</tbody></table></div>';

  /* el dinero: entró, salió */
  h += '<div><h3 style="font-size:14.5px;margin:0 0 9px">El dinero</h3><ul class="hilo">';
  h += '<li class="ent"><b>Cliente: '+(c?esc(c.nom):'Ocasional')+'</b>'
     + '<span>'+(c?esc(c.tipoDoc+'-'+c.doc)+(c.tel?' · '+esc((c.cod||'')+'-'+c.tel):''):'sin identificar')+'</span></li>';
  v.cobros.forEach((x,i)=>{
    h += '<li class="ent"><b>Entró · '+esc(nomMet(x.met))+'</b>'
      + '<span>'+(x.mon==='BS'?'Bs '+fN(x.monto)+' · equivale a USD '+fN(x.monto/(t||1)):'USD '+fN(x.monto))
      + (x.ref?' · referencia '+esc(x.ref):' · sin referencia (efectivo)')+'</span></li>';
  });
  h += '<li><b>Total recibido</b><span>USD '+fN(pagado)+' contra un total de USD '+fN(v.totalUSD)+'</span></li>';
  if(v.vuelto){
    h += '<li class="sal"><b>Salió · vuelto por '+esc(nomMet(v.vuelto.met))+'</b>'
      + '<span>USD '+fN(v.vuelto.usd)+(v.vuelto.bs?' · Bs '+fN(v.vuelto.bs):'')
      + (v.vuelto.ref?' · referencia '+esc(v.vuelto.ref):' · efectivo del fondo de vueltos')+'</span></li>'
      + '<li><b>Queda en caja por esta venta</b><span>USD '+fN(v.totalUSD)+' — el vuelto ya salió</span></li>';
  }else{
    h += '<li><b>Sin vuelto</b><span>El cliente pagó el monto exacto.</span></li>';
  }
  h += '</ul></div></div>';

  /* bitácora de esta venta */
  const reg = DB.bitacora.filter(r=> r.detalle.includes(v.num)
      || (r.ts >= v.fecha && new Date(r.ts) - new Date(v.fecha) < 4000 && ['CAJA','INVENTARIO','CLIENTES'].includes(r.modulo)));
  if(reg.length){
    h += '<div style="margin-top:20px"><h3 style="font-size:14.5px;margin:0 0 9px">Lo que quedó en la bitácora</h3>'
      + '<table class="dat"><thead><tr><th>Hora</th><th>Módulo</th><th>Acción</th><th>Detalle</th><th>Hash</th></tr></thead><tbody>';
    reg.forEach(r=>{
      h += '<tr><td class="mono" style="white-space:nowrap">'+fHora(r.ts)+'</td>'
        + '<td><span class="badge">'+esc(r.modulo)+'</span></td><td><b>'+esc(r.accion)+'</b></td>'
        + '<td>'+esc(r.detalle)+'</td><td class="mono mini">'+esc(r.h)+'</td></tr>';
    });
    h += '</tbody></table>'
      + '<p class="note" style="margin:11px 0 0">Cada línea está encadenada con la anterior por su hash. Alterar cualquiera rompe la cadena y el verificador de Auditoría señala el punto exacto.</p></div>';
  }

  h += '<div class="acc" style="margin-top:18px"><button class="b gh" id="v_cerrar">Cerrar el detalle</button></div>';
  return h + '</div>';
}

/* ==========================================================================
   Apertura de caja + cableado de eventos por pantalla
   ========================================================================== */
function faltantesSinCaja(){ return pasos().filter(p=>p.ob && p.k!=='caja' && !p.ok); }

function pantApertura(){
  return '<h1>Abrir la caja</h1>'
  + '<p class="sub">La caja abre con un fondo fijo en efectivo sencillo para dar los vueltos. Ese dinero no es una venta: es un aporte que se mantiene entre turnos y se cuenta aparte en cada cierre.</p>'
  + '<div class="card"><div class="frm">'
  + '<div class="fila">'
    + '<div><label>Fondo en efectivo (USD)</label><input id="a_fondo" inputmode="decimal" value="100" placeholder="100,00"><div class="ayuda">Lo habitual son USD 100 en billetes pequeños.</div></div>'
    + '<div><label>Turno</label><input value="N° '+((DB.corr.turno||0)+1)+'" readonly><div class="ayuda">Se numera solo.</div></div>'
  + '</div>'
  + '<div class="acc"><button class="b" id="a_abrir">Abrir la caja</button></div>'
  + '</div></div>';
}

/* la pantalla de caja decide qué mostrar */
const cajaWizard = PANT.caja;
PANT.caja = function(){
  const f = faltantesSinCaja();
  if(f.length){
    return '<h1>Caja de ventas</h1>'
      + '<div class="card"><div class="vacio"><div class="vi">⌕</div>'
      + '<p class="note" style="margin:0 0 8px"><b>La caja todavía no está habilitada.</b></p>'
      + '<p class="note" style="margin:0">Falta configurar: '+f.map(p=>esc(p.t)).join(' · ')+'</p>'
      + '<button class="b" data-ir="ini" style="margin-top:16px">Ir a la puesta en marcha</button></div></div>';
  }
  if(!DB.caja.abierta) return pantApertura();
  return cajaWizard();
};

/* ------------------------------ enlaces -------------------------------- */
function enlaza(){
  enlazaComunes();

  /* ---- empresa ---- */
  if(cur==='empresa'){
    $('#e_guardar').addEventListener('click', ()=>{
      const nom = $('#e_nom').value.trim(), rif = $('#e_rif').value.replace(/\D/g,'');
      if(nom.length<3){ aviso('Falta la razón social.', true); return; }
      if(rif.length<8){ aviso('El RIF lleva al menos 8 dígitos.', true); return; }
      DB.empresa = { nom, rif, tipoRif:$('#e_trif').value, dir:$('#e_dir').value.trim(),
                     tel:$('#e_tel').value.trim(), mail:$('#e_mail').value.trim(),
                     logo: DB.empresa.logo || '' };
      if(!DB.creado) DB.creado = ahora();
      bitacora('EMPRESA','MODIFICAR','Datos fiscales · '+nom+' · '+$('#e_trif').value+'-'+rif);
      guardar(); aviso('Datos de la empresa guardados.'); pinta();
    });
  }

  /* ---- tasas ---- */
  if(cur==='tasas'){
    $('#t_guardar').addEventListener('click', ()=>{
      const f = $('#t_fecha').value;
      const bcv = num($('#t_bcv').value), par = num($('#t_par').value);
      if(!f){ aviso('Falta la fecha.', true); return; }
      if(!(bcv>0)){ aviso('La tasa BCV tiene que ser mayor que cero.', true); return; }
      const ya = DB.tasas.find(t=>t.fecha===f);
      if(ya){ ya.bcv=bcv; ya.paralelo=par||null; ya.estado='por confirmar'; }
      else DB.tasas.push({fecha:f, bcv, paralelo:par||null, estado:'por confirmar', fuente:'bcv.org.ve'});
      bitacora('TASA','CREAR','Tasa del '+fFecha(f)+' · BCV '+fN(bcv)+(par?' · paralelo '+fN(par):'')+' · por confirmar');
      guardar(); aviso('Tasa cargada. Falta confirmarla.'); pinta();
    });
    $$('[data-conf]').forEach(b=> b.addEventListener('click', ()=>{
      const t = DB.tasas.find(x=>x.fecha===b.dataset.conf);
      t.estado='confirmada';
      bitacora('TASA','APROBAR','Tasa del '+fFecha(t.fecha)+' confirmada · BCV '+fN(t.bcv));
      guardar(); aviso('Tasa confirmada.'); pinta();
    }));
  }

  /* ---- vendedores ---- */
  if(cur==='vend'){
    $('#v_guardar').addEventListener('click', ()=>{
      const nom = $('#v_nom').value.trim(), ci = $('#v_ci').value.replace(/\D/g,''), com = num($('#v_com').value);
      if(nom.length<3){ aviso('Falta el nombre del vendedor.', true); return; }
      if(!(com>=0 && com<=100)){ aviso('La comisión va de 0 a 100 %.', true); return; }
      DB.vendedores.push({id:'v'+(DB.vendedores.length+1)+'-'+Date.now().toString(36), nom, ci, com, activo:true});
      bitacora('VENDEDORES','CREAR', nom+' · comisión '+fN(com)+' % del margen');
      guardar(); aviso('Vendedor agregado.'); pinta();
    });
    $$('[data-vtog]').forEach(b=> b.addEventListener('click', ()=>{
      const v = DB.vendedores.find(x=>x.id===b.dataset.vtog);
      v.activo = !v.activo;
      bitacora('VENDEDORES','MODIFICAR', v.nom+' · '+(v.activo?'activado':'desactivado'));
      guardar(); pinta();
    }));
  }

  /* ---- delivery ---- */
  if(cur==='deli'){
    $('#d_guardar').addEventListener('click', ()=>{
      const nom = $('#d_nom').value.trim(), usd = num($('#d_usd').value);
      if(nom.length<3){ aviso('Falta el nombre de la zona.', true); return; }
      if(!(usd>=0)){ aviso('La tarifa no puede ser negativa.', true); return; }
      DB.delivery.zonas.push({id:'z'+(DB.delivery.zonas.length+1)+'-'+Date.now().toString(36), nom, usd, t:$('#d_t').value.trim(), activa:true});
      bitacora('DELIVERY','CREAR', nom+' · USD '+fN(usd));
      guardar(); aviso('Zona agregada.'); pinta();
    });
    $('#d_reglas').addEventListener('click', ()=>{
      DB.delivery.gratisDesde = num($('#d_gratis').value)||0;
      DB.delivery.exonerable = $('#d_exo').value==='1';
      bitacora('DELIVERY','MODIFICAR','Reglas · gratis desde USD '+fN(DB.delivery.gratisDesde)+' · exoneración manual '+(DB.delivery.exonerable?'permitida':'bloqueada'));
      guardar(); aviso('Reglas guardadas.'); pinta();
    });
    $$('[data-ztog]').forEach(b=> b.addEventListener('click', ()=>{
      const z = DB.delivery.zonas.find(x=>x.id===b.dataset.ztog);
      z.activa = !z.activa;
      bitacora('DELIVERY','MODIFICAR', z.nom+' · '+(z.activa?'activada':'desactivada'));
      guardar(); pinta();
    }));
  }

  /* ---- productos y categorías ---- */
  if(cur==='prod') enlazaProd();

  /* ---- ventas: abrir el detalle ---- */
  if(cur==='vtas'){
    $$('[data-vventa]').forEach(r=> r.addEventListener('click', ()=>{
      verVenta = (verVenta===r.dataset.vventa) ? null : r.dataset.vventa;
      pinta();
      if(verVenta){ const d=document.querySelector('.detalle'); if(d) d.scrollIntoView({behavior:'smooth', block:'start'}); }
    }));
    const vc = $('#v_cerrar'); if(vc) vc.addEventListener('click', ()=>{ verVenta=null; pinta(); });
  }

  /* ---- clientes ---- */
  if(cur==='cli'){
    const q = $('#cli_q');
    if(q) q.addEventListener('input', ()=>{ $('#cli_tabla').innerHTML = tablaClientes(q.value); });
  }

  /* ---- logo y colores ---- */
  if(cur==='marca'){
    const arch = $('#m_arch');
    if(arch) arch.addEventListener('change', e=>{
      leeLogo(e.target.files[0], (dataUrl, pal, med)=>{
        DB.empresa.logo = dataUrl;
        DB.paleta = pal;
        if(pal.length && (!DB.tema || DB.tema.auto !== false)){
          DB.tema = Object.assign(temaDesde(mejorBase(pal), med.bg), {auto:true});
        }else if(DB.tema){
          DB.tema.logoBg = med.bg || null;
        }
        bitacora('MARCA','MODIFICAR','Logo cargado · recortado a '+med.final[0]+'×'+med.final[1]+' desde '+med.orig[0]+'×'+med.orig[1]+(med.bg?' · fondo '+med.bg:' · fondo transparente')+' · '+pal.length+' colores'+(pal.length?': '+pal.join(' '):''));
        guardar(); aviso('Logo recortado y ajustado. Los colores se tomaron de la imagen.'); pinta();
      });
    });
    const qu = $('#m_quitar');
    if(qu) qu.addEventListener('click', ()=>{
      if(!confirm('¿Quitar el logo?')) return;
      DB.empresa.logo = ''; DB.paleta = [];
      bitacora('MARCA','MODIFICAR','Logo eliminado');
      guardar(); pinta();
    });
    $$('[data-col]').forEach(b=> b.addEventListener('click', ()=>{
      DB.tema = Object.assign(temaDesde(b.dataset.col, DB.tema?DB.tema.logoBg:null), {auto:false});
      bitacora('MARCA','MODIFICAR','Color principal '+b.dataset.col);
      guardar(); aviso('Colores aplicados.'); pinta();
    }));
    const ap = $('#m_aplicar');
    if(ap) ap.addEventListener('click', ()=>{
      const c = $('#m_color').value;
      DB.tema = Object.assign(temaDesde(c, DB.tema?DB.tema.logoBg:null), {auto:false});
      bitacora('MARCA','MODIFICAR','Color principal '+c);
      guardar(); aviso('Colores aplicados.'); pinta();
    });
    const rs = $('#m_reset');
    if(rs) rs.addEventListener('click', ()=>{
      DB.tema = Object.assign(temaPorDefecto(), {auto:false, logoBg: DB.tema?DB.tema.logoBg:null});
      bitacora('MARCA','MODIFICAR','Colores restablecidos al azul original');
      guardar(); pinta();
    });
    const col = $('#m_color');
    if(col) col.addEventListener('input', ()=>{
      const t = temaDesde(col.value);
      const pv = document.querySelectorAll('.prev>span');
      if(pv.length===3){ pv[0].style.background=t.nav1; pv[1].style.background=t.nav2; pv[2].style.background=t.s1; }
      const tx = document.querySelector('.prev .tx');
      if(tx){ tx.style.color = t.navTx; }
    });
  }

  /* ---- datos y respaldo ---- */
  if(cur==='datos'){
    $('#x_bajar').addEventListener('click', ()=>{
      const a = document.createElement('a');
      const blob = new Blob([JSON.stringify(DB,null,1)], {type:'application/json'});
      a.href = URL.createObjectURL(blob);
      a.download = 'sicom-respaldo-'+hoyISO()+'.json';
      a.click(); URL.revokeObjectURL(a.href);
      aviso('Respaldo descargado.');
    });
    $('#x_arch').addEventListener('change', e=>{
      const f = e.target.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = ()=>{
        try{
          const d = JSON.parse(r.result);
          if(!d || typeof d!=='object' || !('empresa' in d)) throw new Error('formato');
          if(!confirm('Esto reemplaza TODOS los datos actuales. ¿Continuar?')) return;
          DB = d; normaliza();
          bitacora('DATOS','MODIFICAR','Respaldo restaurado desde archivo');
          guardar(); aviso('Respaldo restaurado.'); irA('ini');
        }catch(err){ aviso('Ese archivo no es un respaldo válido de SICOM.', true); }
      };
      r.readAsText(f);
    });
    $('#x_borrar').addEventListener('click', ()=>{
      if(!confirm('Se borra TODO: empresa, productos, clientes, ventas y bitácora. ¿Seguro?')) return;
      if(!confirm('Última confirmación. Esto no se puede deshacer.')) return;
      DB = baseVacia(); VTA = null;
      guardar(); aviso('Sistema reiniciado.'); irA('ini');
    });
  }

  /* ---- apertura de caja ---- */
  if(cur==='caja' && !DB.caja.abierta && !faltantesSinCaja().length){
    const ab = $('#a_abrir');
    if(ab) ab.addEventListener('click', ()=>{
      const fondo = num($('#a_fondo').value);
      if(!(fondo>=0)){ aviso('El fondo no puede ser negativo.', true); return; }
      DB.corr.turno = (DB.corr.turno||0)+1;
      DB.caja = { abierta:true, turno:DB.corr.turno, fondoUSD:fondo, aperturaISO:ahora(), movimientos:[] };
      bitacora('CAJA','CREAR','Apertura del turno N° '+DB.caja.turno+' · fondo USD '+fN(fondo));
      guardar(); aviso('Caja abierta. Turno N° '+DB.caja.turno+'.'); nuevaVenta(); pinta();
    });
  }

  /* ---- caja: recorrido de venta ---- */
  if(cur==='caja' && DB.caja.abierta && VTA){
    $$('[data-paso]').forEach(b=> b.addEventListener('click', ()=>{ VTA.paso = b.dataset.paso; pinta(); }));
    $$('[data-atras]').forEach(b=> b.addEventListener('click', ()=>{ VTA.paso = b.dataset.atras; pinta(); }));

    if(VTA.paso==='cliente'){
      $('#k_doc').addEventListener('input', pintaResCliente);
      $('#k_tipo').addEventListener('change', pintaResCliente);
      pintaResCliente();
      $('#k_doc').focus();
      $('#k_sigue').addEventListener('click', ()=>{ VTA.paso='canal'; pinta(); });
    }

    if(VTA.paso==='canal'){
      $$('[data-canal]').forEach(b=> b.addEventListener('click', ()=>{ VTA.canal=b.dataset.canal; pinta(); }));
      $$('[data-ent]').forEach(b=> b.addEventListener('click', ()=>{ VTA.entrega=b.dataset.ent; if(VTA.entrega!=='delivery'){VTA.zonaId=null;VTA.exoDeliv=false;} pinta(); }));
      $$('[data-zona]').forEach(b=> b.addEventListener('click', ()=>{ VTA.zonaId=b.dataset.zona; pinta(); }));
      $$('[data-vend]').forEach(b=> b.addEventListener('click', ()=>{ VTA.vendedorId=b.dataset.vend; pinta(); }));
      const ex = $('#k_exo'); if(ex) ex.addEventListener('click', ()=>{ VTA.exoDeliv=!VTA.exoDeliv; pinta(); });
      const sg = $('#k_sigue'); if(sg && !sg.disabled) sg.addEventListener('click', ()=>{ VTA.paso='arts'; pinta(); });
    }

    if(VTA.paso==='arts'){
      const q = $('#k_q');
      q.addEventListener('input', ()=>{ VTA.q = q.value; const c=q.selectionStart; pinta(); const n=$('#k_q'); n.focus(); n.setSelectionRange(c,c); });
      $$('[data-add]').forEach(b=> b.addEventListener('click', ()=>{
        const p = DB.productos.find(x=>x.id===b.dataset.add);
        const talla = b.dataset.talla || '';
        const k = keyLinea(p.id, talla);
        const disp = dispDe(p, talla);
        const l = VTA.lineas.find(x=>x.k===k);
        if(l){ if(l.cant < disp) l.cant++; else aviso('No hay más existencia'+(talla?' en la talla '+talla:'')+'.', true); }
        else if(disp>0) VTA.lineas.push({k, id:p.id, sku:p.sku, nom:p.nom, talla, precio:p.precio, costo:p.costo, cant:1, disp});
        else aviso('Sin existencia'+(talla?' en la talla '+talla:'')+'.', true);
        pinta();
      }));
      $$('[data-qp]').forEach(b=> b.addEventListener('click', ()=>{
        const l = VTA.lineas.find(x=>x.k===b.dataset.qp);
        if(l.cant < l.disp) l.cant++; else aviso('No hay más existencia'+(l.talla?' en la talla '+l.talla:'')+'.', true);
        pinta();
      }));
      $$('[data-qm]').forEach(b=> b.addEventListener('click', ()=>{
        const l = VTA.lineas.find(x=>x.k===b.dataset.qm);
        l.cant--; if(l.cant<=0) VTA.lineas = VTA.lineas.filter(x=>x.k!==l.k);
        pinta();
      }));
      $$('[data-del]').forEach(b=> b.addEventListener('click', ()=>{ VTA.lineas = VTA.lineas.filter(x=>x.k!==b.dataset.del); pinta(); }));
      const sg = $('#k_sigue'); if(sg && !sg.disabled) sg.addEventListener('click', ()=>{ VTA.paso='cobro'; pinta(); });
    }

    if(VTA.paso==='cobro'){
      $$('[data-met]').forEach(b=> b.addEventListener('click', ()=>{
        $$('[data-met]').forEach(x=>x.classList.remove('on')); b.classList.add('on');
        formCobro(b.dataset.met);
      }));
      $$('[data-qcob]').forEach(b=> b.addEventListener('click', ()=>{ VTA.cobros.splice(+b.dataset.qcob,1); pinta(); }));
      $$('[data-vmet]').forEach(b=> b.addEventListener('click', ()=>{
        if(!VTA.vuelto) VTA.vuelto = {met:'efec_usd', ref:''};
        VTA.vuelto.met = b.dataset.vmet; pinta();
      }));
      const vr = $('#k_vueref'); if(vr) vr.addEventListener('input', ()=>{ VTA.vuelto.ref = vr.value.trim(); });
      const rg = $('#k_reg'); if(rg && !rg.disabled) rg.addEventListener('click', registrarVenta);
    }

    if(VTA.paso==='hecha'){
      $('#k_otra').addEventListener('click', ()=>{ nuevaVenta(); pinta(); });
    }
  }
}

function num(v){
  if(v==null) return 0;
  const s = String(v).trim().replace(/\s/g,'');
  if(!s) return 0;
  // acepta "1.234,56" y "1234.56"
  const esES = /,\d{1,2}$/.test(s);
  const n = parseFloat(esES ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,''));
  return isFinite(n) ? n : 0;
}

/* --------- puesta al día: temas y logos guardados por versiones previas -------- */
function migra(){
  let cambio = false;
  /* el tema viejo no traía los colores del menú */
  if(DB.tema && DB.tema.base && !DB.tema.navTx){
    const auto = DB.tema.auto !== false, bg = DB.tema.logoBg || null, hecho = DB.tema.logoAjustado;
    DB.tema = Object.assign(temaDesde(DB.tema.base, bg), {auto, logoAjustado: hecho});
    cambio = true;
  }
  /* el logo viejo no estaba recortado: se reajusta solo, una sola vez */
  if(DB.empresa.logo && (!DB.tema || !DB.tema.logoAjustado)){
    const img = new Image();
    img.onload = ()=>{
      try{
        const rec = recorta(img);
        const MAXW = 560, MAXH = 280;
        const e = Math.min(1, MAXW/rec.w, MAXH/rec.h);
        const W = Math.max(1, Math.round(rec.w*e)), H = Math.max(1, Math.round(rec.h*e));
        const out = document.createElement('canvas');
        out.width = W; out.height = H;
        const ox = out.getContext('2d'); ox.imageSmoothingQuality='high';
        ox.drawImage(rec.cv, rec.x0, rec.y0, rec.w, rec.h, 0, 0, W, H);
        DB.empresa.logo = out.toDataURL('image/png');
        if(!DB.tema) DB.tema = temaPorDefecto();
        DB.tema.logoBg = rec.bgHex || null;
        DB.tema.logoAjustado = true;
        bitacora('MARCA','MODIFICAR','Logo reajustado solo a '+W+'×'+H+(rec.bgHex?' · fondo '+rec.bgHex:' · fondo transparente'));
        guardar(); pinta();
      }catch(err){ console.warn('No se pudo reajustar el logo:', err); }
    };
    img.src = DB.empresa.logo;
  }
  if(cambio) guardar();
}

/* ------------------------------- arranque ------------------------------- */
cargar();
migra();
if(!DB.bitacora.length && !DB.creado){
  DB.creado = ahora();
  bitacora('SISTEMA','CREAR','Instalación creada · sistema vacío');
  guardar();
}
pinta();
