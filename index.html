.firma{text-align:center;color:var(--muted);font-size:12px;border-top:1px solid var(--hair);padding-top:16px;margin-top:20px}
.barra{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--linea);
  box-shadow:0 -4px 20px rgba(74,56,38,.08);z-index:20}
.barrain{max-width:1240px;margin:0 auto;padding:13px 22px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.barrain .inf{font-size:13.5px;color:var(--ink2);flex:1;min-width:150px}
.subtabs{display:flex;gap:4px;background:var(--sup);padding:4px;border-radius:999px;margin-bottom:18px;width:fit-content;flex-wrap:wrap}
.subtabs button{border:0;background:transparent;padding:8px 17px;border-radius:999px;font-size:13.5px;font-weight:650;
  color:var(--ink2);cursor:pointer;transition:.15s}
.subtabs button.on{background:var(--panel);color:var(--ink);box-shadow:var(--sh1)}
.prev{max-height:300px;overflow:auto;border:1px solid var(--linea);border-radius:var(--r1);margin-top:14px}
.res{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13px}
.toast{position:fixed;right:22px;bottom:96px;transform:translateY(14px);background:var(--marron);color:#fff;
  padding:12px 22px;border-radius:999px;box-shadow:var(--sh3);font-size:14px;font-weight:600;z-index:60;
  opacity:0;visibility:hidden;transition:.22s;max-width:76vw;pointer-events:none}
.toast.ver{opacity:1;visibility:visible;transform:translateY(0)}
.toast.mal{background:var(--mal)}
.pend{border:1px solid var(--linea);border-left:4px solid var(--avi);border-radius:var(--r2);padding:16px 18px;margin-bottom:12px;background:var(--panel)}
.pend.viejo{border-left-color:var(--mal)}
.pendhd{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.pendhd .pm{margin-left:auto;text-align:right;white-space:nowrap}
.pendhd .pm b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.bar{margin-bottom:14px}
.bar .bl{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;margin-bottom:5px}
.bar .bl span{color:var(--ink2)}
.bar .bl b{font-variant-numeric:tabular-nums;white-space:nowrap}
.bar .bt{height:9px;border-radius:999px;background:var(--sup2);overflow:hidden}
.bar .bt i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--oro-cl),var(--oro-os))}
.volver{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--linea);background:var(--panel);
  border-radius:999px;padding:7px 15px 7px 11px;font-size:13px;font-weight:650;color:var(--marron);cursor:pointer;
  margin-bottom:14px;transition:.14s;box-shadow:var(--sh1)}
.volver:hover{border-color:var(--oro);background:var(--sup)}
.dz{border:2px dashed var(--linea);border-radius:var(--r2);padding:26px 20px;text-align:center;background:var(--sup);
  transition:.15s;cursor:pointer}
.dz.hover{border-color:var(--oro);background:var(--crema)}
.dz .di{font-size:30px;opacity:.5}
.dz b{display:block;margin-top:8px;font-size:14.5px}
.dz span{display:block;font-size:12.5px;color:var(--muted);margin-top:4px}
.print{display:flex;gap:12px;align-items:center;margin-top:12px;padding:11px 13px;border:1px solid var(--linea);
  border-radius:var(--r1);background:var(--sup)}
.print img{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--linea);background:#fff}
.print .pn{flex:1;min-width:0;font-size:13px}
.mininota{font-size:11.5px;color:var(--muted)}

/* ============ SICOM v7 · elegir la orden, en grande ==================== */
.subtabs .sepsub{display:inline-block;width:1px;height:22px;background:var(--linea);
  margin:0 6px;align-self:center;flex:0 0 auto}
.ordenes{display:flex;flex-direction:column;gap:10px}
.orden{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
  background:var(--panel);border:1px solid var(--linea);border-radius:var(--r2);
  padding:14px 16px;transition:.14s;font:inherit;color:var(--ink)}
.orden:hover:not(:disabled){border-color:var(--oro);box-shadow:var(--sh2);transform:translateY(-1px)}
.orden.on{border-color:var(--oro);background:linear-gradient(160deg,#fffdf7,var(--crema));box-shadow:var(--ring)}
.orden.no{opacity:.5;cursor:not-allowed}
.orden .onum{flex:0 0 auto;font-size:17px;font-weight:800;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;background:var(--sup);border:1px solid var(--linea);
  border-radius:var(--r1);padding:9px 13px;color:var(--marron)}
.orden.on .onum{background:var(--oro);color:var(--oro-tx,#33261a);border-color:var(--oro)}
.orden .oinf{flex:1;min-width:0;font-size:13.5px;color:var(--ink2)}
.orden .oinf .omini{display:block;font-size:12px;color:var(--muted);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orden .omonto{flex:0 0 auto;font-weight:800;font-variant-numeric:tabular-nums;font-size:15px}
.orden .oest{flex:0 0 auto;min-width:104px;text-align:right}
@media(max-width:720px){
  .orden{flex-wrap:wrap}
  .orden .oinf{flex:1 1 100%;order:3}
  .orden .oest{min-width:0}
}

/* ===================== SICOM v3 · ventas, anulación y devolución ========== */
.card.editando{border-color:var(--oro);box-shadow:var(--ring),var(--sh2)}
table.dat td .chip{white-space:nowrap}
.dat tr td[colspan] .card{margin:0}
/* la ficha de una venta abierta dentro de la tabla */
.dat .card{box-shadow:none}
.dat .card h2{font-size:15px}
/* clave: nunca se ve lo que se escribe */
input[type=password]{letter-spacing:.18em;font-family:ui-monospace,monospace}
input[type=password]::placeholder{letter-spacing:normal;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}

/* ===================== SICOM v2 · identidad configurable ================== */
/* estas reglas van después de las originales: mismo peso, ganan por posición */
.top{background:linear-gradient(135deg,var(--marron) 0%,var(--marron-os,#2f2318) 100%)}
.b.oro{color:var(--oro-tx,#33261a)}
.tabs button.on{color:var(--oro-tx,#33261a)}
.tabs button.on .pip{background:var(--marron-os,#33261a);color:var(--oro-cl)}
.mono{color:var(--oro-tx,#3a2c1c)}

/* logo en el encabezado */
.mklogo{height:40px;max-width:190px;display:block;object-fit:contain;flex:0 0 auto;
  background:var(--logo-bg,transparent);border-radius:9px;padding:3px 5px}
/* el monograma es dorado y va sobre la barra oscura: ni fondo ni relleno */
.mklogo.mkmono{height:38px;max-width:44px;background:transparent;padding:0}

/* pantalla de identidad visual */
.logobox{display:grid;place-items:center;min-height:150px;padding:20px;border-radius:var(--r2);
  border:1px solid var(--linea);background:var(--logo-bg,var(--sup))}
.logobox img{max-width:100%;max-height:190px;display:block}
.paleta{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.paleta .sw{width:46px;height:46px;border-radius:12px;border:2px solid var(--linea);cursor:pointer;
  box-shadow:var(--sh1);transition:.14s;padding:0}
.paleta .sw:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.paleta .sw.on{border-color:var(--ink);box-shadow:var(--ring)}
.prevcol{display:flex;gap:0;align-items:stretch;border:1px solid var(--linea);border-radius:var(--r1);
  overflow:hidden;height:46px}
.prev span{flex:1}
.prev .tx{flex:0 0 auto;display:grid;place-items:center;padding:0 16px;font-size:13px;font-weight:700}

/* existencia por talla en el catálogo */
.tall-ed{gap:10px}
.tall-ed .tal{display:flex;flex-direction:column;gap:5px;align-items:center;
  border:1px solid var(--linea);border-radius:var(--r1);padding:8px 9px;background:var(--sup)}
.tall-ed .tal span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);font-weight:700}
.tall-ed .tal input{width:62px;text-align:center;padding:7px 6px;font-weight:700}

/* aviso de que la caja no está lista */
.aviso-setup{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--avi-bg);
  border:1px solid var(--avi);border-radius:var(--r2);padding:14px 16px;margin-bottom:18px}
.aviso-setup b{display:block;font-size:14.5px}
.aviso-setup span{font-size:13px;color:var(--ink2)}
.aviso-setup .b{margin-left:auto}

/* logo de la tienda dentro del recibo por correo */
.mailbd .logo.logoimg{width:auto;max-width:180px;height:56px;object-fit:contain;
  background:var(--logo-bg,transparent);border-radius:12px;padding:4px 8px;display:block;margin:0 auto}

/* .pend también existe como tarjeta suelta, y .acc como fila de botones:
   ninguna de las dos debe colarse en el visor ni en la píldora */
.estado.pend{border:0;padding:18px 20px;margin-bottom:0;
  background:var(--avi-bg);color:var(--avi-ink)}
.chip.acc{margin-top:0}
.chip.avi{background:var(--avi-bg);color:var(--avi-ink)}

.visor.visor-anu{
  margin-top:16px;border:1px solid var(--mal);
  background:color-mix(in srgb, var(--mal) 7%, var(--panel))
}
.visor.visor-anu .vk{color:var(--mal-ink)}
.visor.visor-anu .vn{color:var(--mal-ink)}
.visor.visor-anu .veq{color:var(--mal-ink);opacity:.72}

/* Las 33 tablas anteriores a la integración contable nunca se envolvieron en
   .tabwrap, así que en pantalla estrecha desbordaban el cuerpo entero y se
   iba de lado el encabezado con ellas. Que scrollee la tabla, no la página. */
@media (max-width:900px){
  .card table.dat{display:block;width:100%;overflow-x:auto}
}
/* el plan son seis tablas apiladas que el ojo lee como una sola */
table.dat.plan{table-layout:fixed}
table.dat.plan td:nth-child(1){width:130px}
/* la sangría es la jerarquía: se ve el árbol sin tener que leer el código */
table.arbol tr.n2>td:first-child{padding-left:14px}
table.arbol tr.n3>td:first-child{padding-left:34px}
table.arbol tr.n4>td:first-child{padding-left:56px}
table.arbol tr.n2 .cnom{font-weight:600;color:var(--ink)}
table.arbol tr.n3 .cnom{color:var(--ink)}
table.arbol tr.n4 .cnom{color:var(--ink2)}
table.arbol tr.n2>td{border-top:1px solid var(--linea)}

/* ---------- asistente para abrir una cuenta ---------- */
.wiz{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.wpaso{display:grid;grid-template-columns:30px 1fr;gap:14px;padding:14px 0;
  border-top:1px solid var(--hair);align-items:start}
.wpaso:first-child{border-top:0;padding-top:4px}
.wnum{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-size:12.5px;font-weight:700;background:var(--sup);border:1px solid var(--linea);
  color:var(--muted)}
.wpaso.ya .wnum{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.wbody{min-width:0}
.wpaso.ya .wbody{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.wtit{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;
  color:var(--muted);margin-bottom:10px}
.wpaso.ya .wtit{margin-bottom:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.wval{font-size:15px;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:600}
.wcap{font-size:13px;color:var(--muted);margin:-4px 0 12px}

.wtipos{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.wtipo{text-align:left;display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;
  padding:13px 14px;border:1px solid var(--linea);border-radius:var(--r2);
  background:var(--sup);cursor:pointer;transition:.14s}
.wtipo:hover{border-color:var(--oro);background:var(--crema)}
.wtipo .wk{grid-row:span 2;width:26px;height:26px;border-radius:8px;display:grid;
  place-items:center;background:var(--oro);color:var(--oro-tx);font-weight:700;font-size:13px}
.wtipo b{color:var(--ink);font-size:14.5px}
.wtipo span:last-child{grid-column:2;color:var(--muted);font-size:12.5px;line-height:1.45}

.wops{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px}
/* rejilla, no flex: la etiqueta «sugerida» tiene que poder bajar a su
   renglón sin aplastar el nombre */
.wop{text-align:left;display:grid;grid-template-columns:auto minmax(0,1fr);
  gap:3px 10px;align-items:start;padding:10px 12px;
  border:1px solid var(--linea);border-radius:var(--r1);background:var(--sup);
  cursor:pointer;transition:.14s}
.wop:hover{border-color:var(--oro);background:var(--crema)}
.wop.sug{border-style:dashed}
.wop.otro{border-style:dashed;background:transparent}
.wop .wcod{grid-column:1;grid-row:1 / span 2;align-self:start;margin-top:1px;
  font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11.5px;
  color:var(--ink2);background:var(--sup2);padding:2px 7px;border-radius:5px;
  font-variant-numeric:tabular-nums}
.wop .wcod.nv{color:var(--muted);background:transparent;border:1px dashed var(--linea)}
/* el nombre completo vale más que la altura pareja: envuelve, no se corta */
.wop .wnom{grid-column:2;color:var(--ink);font-size:14px;line-height:1.35;
  overflow-wrap:break-word}
.wop .wsug{grid-column:2;font-size:10px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);font-weight:700}

/* el resumen: el árbol tal como va a quedar, antes de tocar nada */
.wres{margin-top:18px;padding-top:16px;border-top:1px solid var(--linea)}
.wrt{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;
  color:var(--muted);margin-bottom:10px}
.wrbol{display:flex;flex-direction:column;gap:4px}
.wrl{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:8px 12px;
  border-radius:var(--r1);background:var(--sup)}
.wrl.n2{margin-left:16px}
.wrl.n3{margin-left:32px}
.wrl.n4{margin-left:48px}
.wrl.nv{background:var(--avi-bg)}
.wrl b.codn{flex:0 0 auto;min-width:86px}
.wrl>span:nth-of-type(1){color:var(--ink);font-weight:600;font-size:14.5px}
.wrl em{font-style:normal;color:var(--muted);font-size:12px;margin-left:auto}
@media (max-width:640px){
  .wrl.n2,.wrl.n3,.wrl.n4{margin-left:0}
  .wrl em{margin-left:0;flex-basis:100%}
}
h3.grp .gt{
  margin-left:8px;color:var(--oro-os);letter-spacing:.04em;font-weight:600
}
/* una línea de modelo sin cuenta es trabajo pendiente, no un error */
tr.porasignar .cnt.vac{color:var(--avi);letter-spacing:.14em;font-weight:600}
tr.porasignar{background:var(--avi-bg)}
/* la cédula y el sufijo del porcentaje son datos atómicos */
table.dat.reps td:nth-child(3), table.dat.reps td:nth-child(5){white-space:nowrap}
/* un solo día en la tendencia no debe leerse como una barra de progreso */
.tend .d{max-width:96px}

/* ---------- KPIs ejecutivos y estadísticas ---------- */
:root{
  --s1:var(--oro);
  --s2:color-mix(in srgb, var(--oro) 78%, var(--panel));
  --s3:color-mix(in srgb, var(--oro) 58%, var(--panel));
  --s4:color-mix(in srgb, var(--oro) 42%, var(--panel));
  --s5:color-mix(in srgb, var(--oro) 30%, var(--panel));
  --s6:color-mix(in srgb, var(--oro) 22%, var(--panel));
}
.hero{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.hero .h.dest{background:color-mix(in srgb, var(--crema) 55%, var(--panel))}
.hero .vrow{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-top:5px}
.hero .vrow .v{font-size:34px;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1.05}
.hero .vrow .u{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:0}
.dlt{
  display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;
  font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;
  background:var(--sup2);color:var(--muted);white-space:nowrap
}
.dlt.ok{background:var(--ok-bg);color:var(--ok-ink)}
.dlt.mal{background:var(--mal-bg);color:var(--mal-ink)}

.cats.perper{margin:0 0 18px}

/* tendencia */
.tend{
  display:flex;align-items:flex-end;gap:6px;height:104px;position:relative;
  padding-top:20px;border-bottom:1px solid var(--linea)
}
.tend .d{flex:1 1 0;min-width:12px;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.tend .d i{display:block;border-radius:4px 4px 0 0;min-height:3px;background:var(--s3)}
.tend .d.hoy i{background:var(--oro)}
.tend .prom{position:absolute;left:0;right:0;border-top:1px dashed var(--muted);pointer-events:none}
.tend .prom b{
  position:relative;top:-9px;background:var(--panel);padding:0 6px;
  font-size:10.5px;font-weight:600;color:var(--muted)
}
.tendpie{display:flex;gap:6px;margin-top:6px}
.tendpie span{flex:1 1 0;min-width:12px;text-align:center;font-size:10.5px;color:var(--muted);
  font-variant-numeric:tabular-nums}

/* barras horizontales */
.bh{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline;margin-bottom:13px}
.bh .l{font-size:13.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bh .m{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.bh .m em{font-style:normal;font-weight:600;font-size:12px;color:var(--muted);margin-left:7px}
.bh .t{grid-column:1/-1;height:10px;border-radius:999px;background:var(--sup2);overflow:hidden}
.bh .t i{display:block;height:100%;border-radius:999px;background:var(--s1)}
.bh.s2 .t i{background:var(--s2)}
.bh.s3 .t i{background:var(--s3)}
.bh.s4 .t i{background:var(--s4)}
.bh.s5 .t i{background:var(--s5)}
.bh.s6 .t i{background:var(--s6)}

/* tabla comparativa con micro-barra de margen */
table.dat.cmp td{padding:9px 10px}
table.dat.cmp .rank{width:26px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.mgb{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end;
  font-variant-numeric:tabular-nums}
.mgb .mt{flex:0 0 auto;width:56px;height:6px;border-radius:999px;background:var(--sup2);overflow:hidden}
.mgb .mt i{display:block;height:100%;background:var(--ok)}
.mgb .mt i.medio{background:var(--avi)}
.mgb .mt i.bajo{background:var(--mal)}

/* nota de crédito en el libro */
table.libro tr.nc td.n{color:var(--mal)}

/* ---------- navegación de segundo nivel ---------- */
.subtabs.sub2{
  background:transparent;padding:0;gap:2px;margin:-4px 0 18px;
  border-bottom:1px solid var(--linea);border-radius:0
}
.subtabs.sub2 button{
  border-radius:0;background:transparent;padding:9px 14px;
  border-bottom:2px solid transparent;font-size:13px
}
.subtabs.sub2 button.on{
  background:transparent;color:var(--ink);border-bottom-color:var(--oro);font-weight:700
}

/* ---------- lo que todavía no existe ---------- */
.card.enobra{
  border-style:dashed;background:linear-gradient(180deg,var(--sup) 0%,var(--panel) 60%);
  text-align:center;padding:40px 26px
}
.card.enobra .obra-ic{font-size:30px;opacity:.5;margin-bottom:10px}
.card.enobra h2{margin-bottom:8px}
.card.enobra .cap{max-width:62ch;margin:0 auto 16px}
.card.enobra .nota{text-align:left;max-width:62ch;margin:0 auto}

/* ---------- la tasa que falta: no es un aviso, es una puerta cerrada ---- */
.card.sintasa{
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  border-left:4px solid var(--avi);background:var(--avi-bg)
}
.card.sintasa .sti{
  flex:0 0 auto;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
  background:var(--sup);color:var(--avi);font-size:24px
}
.card.sintasa .stx{flex:1 1 320px}
.card.sintasa h2{margin:0 0 6px}
.card.sintasa p{margin:0 0 6px;color:var(--ink2);font-size:13.5px;line-height:1.55}
.card.sintasa .mini{margin:0}
.cintain .cargatasa{margin-left:8px;padding:2px 10px;font-size:11px;vertical-align:baseline}

/* ---------- el IGTF, siempre en las dos monedas ---------- */
.igtfbs{
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:10px;
  padding-top:10px;border-top:1px dashed var(--linea)
}
.igtfbs b{font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.igtfbs i{font-style:normal;color:var(--muted)}
.igtfbs em{font-style:normal;color:var(--muted);font-size:11.5px;margin-left:auto}

/* ---------- el equivalente en bolívares, al lado del monto ---------- */
.eqbox{
  display:flex;align-items:center;min-height:40px;padding:0 13px;
  border:1px solid var(--linea);border-radius:var(--r1);background:var(--sup);
  color:var(--ink2);font-variant-numeric:tabular-nums;font-size:14px
}

/* ---------- pantalla de inicio ---------- */
/* en el inicio no hay barras: la pantalla es toda de la empresa */
body.enhome header.top{display:none}
body.enhome .wrap{max-width:none;padding:0;margin:0}
body.enhome .barra{display:none !important}

.home{
  min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:26px 24px;position:relative;overflow:hidden;
  background:
    radial-gradient(120% 82% at 50% -12%, var(--crema) 0%, var(--page) 58%, var(--page) 100%);
}
/* una franja de la marca arriba, para que la pantalla tenga peso */
.home::before{
  content:"";position:absolute;inset:0 0 auto 0;height:5px;
  background:linear-gradient(90deg,var(--marron-os),var(--oro),var(--oro-cl),var(--oro),var(--marron-os))
}
/* el halo dorado detrás del logo, ahora más ancho y un punto más presente */
.home::after{
  content:"";position:absolute;top:-215px;left:50%;transform:translateX(-50%);
  width:min(760px,110vw);height:500px;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,var(--oro),transparent 74%);opacity:.17
}
.homein{position:relative;z-index:1;width:100%;max-width:1180px;text-align:center}

.hmarca{margin-bottom:24px}
.hlogo{
  display:inline-flex;align-items:center;justify-content:center;
  padding:8px 18px;border-radius:24px;margin-bottom:14px;
  background:var(--logo-bg,transparent)
}
/* el logo manda en esta pantalla: crece con el alto de la ventana y se
   despega del fondo con su propia sombra, sin caja que lo encierre */
.hlogo img{
  height:clamp(104px,17.5vh,172px);max-width:min(420px,80vw);
  object-fit:contain;display:block;
  filter:drop-shadow(0 14px 26px rgba(34,24,15,.16))
}
.hmono{
  width:clamp(104px,15vh,144px);height:clamp(104px,15vh,144px);margin:0 auto 14px;
  border-radius:32px;display:grid;place-items:center;
  font-family:Georgia,'Times New Roman',serif;font-size:clamp(46px,7vh,62px);font-weight:700;
  background:linear-gradient(140deg,var(--oro-cl),var(--oro-os));color:var(--oro-tx);
  box-shadow:0 16px 36px -16px var(--oro-os)
}
/* un filete corto: separa la marca del título sin poner una línea entera */
.hfil{
  display:block;width:52px;height:2px;margin:0 auto 18px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--oro),transparent)
}

.home h1{
  font-size:clamp(25px,3.9vw,36px);font-weight:400;letter-spacing:-.02em;
  color:var(--ink);margin:0 0 9px;line-height:1.15;text-wrap:balance
}
.home h1 b{font-weight:700;color:var(--oro-os)}
.hsub{margin:0 0 6px;font-size:15px;color:var(--ink2);font-weight:600}
.hfec{margin:0;font-size:13.5px;color:var(--muted)}
.hfec b{color:var(--ink2)}
.hviej{color:var(--avi);font-weight:600}

/* cuatro columnas: los siete módulos entran en dos filas y la pantalla se
   ve completa sin desplazar */
.hmods{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(252px,1fr));
  gap:12px;text-align:left;margin-bottom:20px
}
/* un módulo se ve pulsable antes de tocarlo: relieve, cursor y una flecha
   que se asoma al pasar por encima */
.hmod{
  display:grid;grid-template-columns:42px 1fr auto;gap:6px 14px;align-items:center;
  padding:16px 17px;border-radius:var(--r2);cursor:pointer;text-align:left;
  background:var(--panel,#fff);border:1px solid var(--linea);
  box-shadow:0 1px 2px rgba(0,0,0,.04), 0 10px 24px -18px rgba(0,0,0,.5);
  transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease
}
.hmod:hover{
  transform:translateY(-3px);border-color:var(--oro);
  box-shadow:0 2px 4px rgba(0,0,0,.05), 0 18px 34px -20px var(--oro-os)
}
.hmod:active{transform:translateY(-1px)}
.hmod:focus-visible{outline:none;border-color:var(--oro);box-shadow:var(--ring)}
.hic{
  width:42px;height:42px;border-radius:13px;display:grid;place-items:center;
  background:var(--crema);color:var(--oro-os);transition:.16s;align-self:start
}
.hic svg{width:23px;height:23px}
.hmod:hover .hic{background:var(--oro);color:var(--oro-tx)}
.htx{min-width:0;display:block}
.htx b{display:block;font-size:15.5px;color:var(--ink);margin-bottom:2px}
.htx>span{display:block;font-size:12.5px;color:var(--muted);line-height:1.4}
/* el aviso al pie de cada tarjeta, todas a la misma altura */
.hav{
  grid-column:2;grid-row:2;font-size:11px;font-weight:700;letter-spacing:.02em;
  color:var(--ink2);background:var(--sup2);padding:3px 9px;border-radius:999px;
  justify-self:start;align-self:end;white-space:nowrap
}
.hav.ok{background:var(--ok-bg);color:var(--ok)}
.hav.avi{background:var(--avi-bg);color:var(--avi)}
.hav.mal{background:var(--mal-bg);color:var(--mal)}
.hfl{
  grid-row:1;grid-column:3;font-size:19px;color:var(--oro);
  opacity:0;transform:translateX(-6px);transition:.16s
}
.hmod:hover .hfl,.hmod:focus-visible .hfl{opacity:1;transform:translateX(0)}

.hpie{margin:0;font-size:12px;color:var(--muted);line-height:1.6}

/* el logo del encabezado vuelve al inicio */
.mkbtn{
  display:flex;align-items:center;gap:13px;background:transparent;border:0;
  padding:4px 8px 4px 4px;margin-left:-4px;border-radius:12px;cursor:pointer;transition:.14s
}
.mkbtn:hover{background:rgba(255,255,255,.07)}
.mkbtn:focus-visible{outline:none;box-shadow:var(--ring)}

@media (max-width:640px){
  .home{padding:26px 16px}
  .hlogo img{height:clamp(92px,15vh,124px)}
  .hfil{margin-bottom:14px}
  .hmods{grid-template-columns:1fr;gap:10px}
  .hmod{padding:15px 16px;gap:13px;grid-template-columns:42px 1fr auto}
  .hic{width:42px;height:42px}
  .hfl{display:none}
}

/* ---------- encabezado con acción a la derecha ---------- */
.lvhd{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.lvhd>div:first-child{flex:1 1 240px}
.lvhd .cap{margin:2px 0 0}
.lvsel{flex:0 0 auto;min-width:190px}
.hero.lvtot{margin-bottom:16px}

/* ---------- libro ---------- */
table.libro tr.anu td{opacity:.55}
table.libro td:nth-child(2),table.libro td:nth-child(4){white-space:nowrap}
table.libro td:nth-child(2) .chip{

}
table.libro tr.anu td.n{text-decoration:line-through}
/* los códigos de cuenta, los RIF y las cédulas: dato atómico, nunca se parte.
   No se llama .mono porque ese nombre ya es el monograma del logo. */
.codn{
  font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12.5px;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap
}
b.codn{font-weight:600;color:var(--ink)}
td.codn{color:var(--ink2)}
h3.grp{
  font-size:11px;margin:22px 0 8px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);font-weight:700

.kpis-mod{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpis-mod .kpi{

function valMail(s){
  s=(s||'').trim();
  if(!s) return {ok:false,msg:'Falta el correo. Sin él no se le puede enviar el recibo.'};
  if(/\s/.test(s)) return {ok:false,msg:'El correo no puede llevar espacios.'};
  const at=s.split('@');
  if(at.length!==2) return {ok:false,msg:'Falta la arroba, o hay más de una.'};
  const [u,d]=at;
  if(!u) return {ok:false,msg:'Falta lo que va antes de la arroba.'};
  if(!d) return {ok:false,msg:'Falta el dominio después de la arroba: gmail.com, hotmail.com…'};
  if(!/^[A-Za-z0-9._%+-]+$/.test(u)) return {ok:false,msg:'Hay caracteres que no van antes de la arroba.'};
  if(u.startsWith('.')||u.endsWith('.')||u.includes('..')) return {ok:false,msg:'Los puntos están mal colocados.'};
  if(!d.includes('.')) return {ok:false,msg:'Al dominio le falta el punto: escriba .com, .net, .ve…'};
  if(d.startsWith('.')||d.endsWith('.')||d.includes('..')) return {ok:false,msg:'El dominio tiene puntos mal colocados.'};
  if(!/^[A-Za-z0-9.-]+$/.test(d)) return {ok:false,msg:'El dominio tiene caracteres que no van.'};
  const tld=d.split('.').pop();
  if(!/^[A-Za-z]{2,}$/.test(tld)) return {ok:false,msg:'La terminación del dominio no es válida.'};
  const dl=d.toLowerCase();
  if(DOMS_MAL[dl]) return {ok:false,msg:'¿Quiso escribir '+u+'@'+DOMS_MAL[dl]+'?',sug:u+'@'+DOMS_MAL[dl]};
  if(s.length>70) return {ok:false,msg:'El correo es demasiado largo.'};
  return {ok:true,msg:'Correo válido'+(DOMS_OK.includes(dl)?'':' · dominio poco común, verifíquelo')};
}

/* El RIF venezolano lleva dígito verificador. No es adorno: un RIF con el
   verificador malo lo rechaza el portal del SENIAT y deja el libro inservible.
   Se calcula con pesos 4,3,2,7,6,5,4,3,2 sobre el tipo y los ocho dígitos. */
const RIF_TIPO = {V:1, E:2, J:3, P:4, G:5};
function digitoRif(tipo, ocho){
  const pesos = [3,2,7,6,5,4,3,2];
  let suma = (RIF_TIPO[tipo] || 0) * 4;
  for(let i = 0; i < 8; i++) suma += (+ocho[i]) * pesos[i];
  const r = 11 - (suma % 11);
  return r > 9 ? 0 : r;
}
function valRif(tipo, cuerpo){
  const c = String(cuerpo || '').replace(/[^0-9]/g, '');
  if(!RIF_TIPO[tipo]) return {ok:false, msg:'Elija el tipo de RIF.'};
  if(!c) return {ok:false, msg:'Falta el RIF. Sin él no se puede emitir ningún libro.'};
  if(c.length < 9) return {ok:false, msg:'Al RIF le faltan dígitos: van ocho y el verificador.'};
  if(c.length > 9) return {ok:false, msg:'El RIF tiene dígitos de más: van ocho y el verificador.'};
  const d = digitoRif(tipo, c.slice(0, 8));
  if(d !== +c[8]) return {ok:false,
    msg:'El dígito verificador no cuadra: para ' + tipo + '-' + c.slice(0,8)
        + ' debería terminar en ' + d + ', no en ' + c[8] + '.'};
  return {ok:true, msg:'RIF válido · dígito verificador correcto', fmt: tipo + '-' + c.slice(0,8) + '-' + c[8]};
}

/* ==================================================================
   IVA e IGTF
   El precio del catálogo YA incluye el IVA: la base sale dividiendo.
   El IGTF se causa sobre la porción de la FACTURA saldada en divisas,
   no sobre el efectivo que la clienta pone sobre el mostrador.
   ================================================================== */
/* Redondeo comercial. El empujón de una milmillonésima existe porque 1,275
   no se puede representar exacto en binario: sin él, Math.round devuelve 1,27
   y el IGTF queda un centavo corto. Con él, medio centavo siempre sube. */
function r2(n){
  n = Number(n) || 0;
  return Math.round((n + (n < 0 ? -1e-9 : 1e-9)) * 100) / 100;
}
function fisc(){ return DB.fisc || {}; }
function ivaActivo(){ return fisc().ivaActivo !== false; }
function alicIVA(){ return ivaActivo() ? (+fisc().alic || 0)/100 : 0; }
function igtfActivo(){ return fisc().igtfActivo !== false; }
function pctIGTF(){ return igtfActivo() ? (+fisc().igtfPct || 0)/100 : 0; }
function esDivisa(k){ return (fisc().igtfMet || []).indexOf(k) >= 0; }
function metDivisas(){ return METODOS.filter(m=>esDivisa(m.k)); }

/* de un monto que ya trae el IVA adentro, cuánto es base */
function baseDe(monto){
  const a = alicIVA();
  return a ? r2(monto / (1 + a)) : r2(monto);
}
/* el IVA es el resto, nunca un segundo redondeo: así base + iva === monto */
function ivaDe(monto){ return r2(monto - baseDe(monto)); }
function gravado(l){ return l.exento !== true; }

/* desglose de un juego de líneas más el delivery */
function desglosaVenta(lineas, deliv){
  let base = 0, iva = 0, exe = 0;
  (lineas||[]).forEach(l=>{
    const m = r2(l.precio * l.cant);
    if(!gravado(l) || !alicIVA()){ exe += m; }
    else { const b = baseDe(m); base += b; iva += r2(m - b); }
  });
  const d = deliv || 0;
  if(d > 0.005){
    if(fisc().delivGravado === false || !alicIVA()) exe += d;
    else { const b = baseDe(d); base += b; iva += r2(d - b); }
  }
  return {base:r2(base), iva:r2(iva), exento:r2(exe), total:r2(base + iva + exe)};
}

/* cuánto de la factura queda sin saldar después de una lista de cobros */
function saldoFactura(cobros, totalFac){
  const t = tasaVigente();
  let saldo = totalFac;
  (cobros||[]).forEach(c=>{
    const usd = c.mon === 'BS' ? (t ? c.monto / t.bcv : 0) : c.monto;
    saldo = r2(saldo - Math.min(usd, Math.max(0, saldo)));
  });
  return Math.max(0, saldo);
}
/* el IGTF causado: 3 % de lo que cada cobro en divisas alcanzó a saldar */
function igtfDe(cobros, totalFac){
  const p = pctIGTF(); if(!p) return 0;
  const t = tasaVigente();
  let saldo = totalFac, g = 0;
  (cobros||[]).forEach(c=>{
    const usd = c.mon === 'BS' ? (t ? c.monto / t.bcv : 0) : c.monto;
    const aplica = Math.min(usd, Math.max(0, saldo));
    if(esDivisa(c.met)) g = r2(g + r2(aplica * p));
    saldo = r2(saldo - aplica);
  });
  return r2(g);
}
function totalArts(){return VTA.lineas.reduce((a,l)=>a+l.precio*l.cant,0);}
function montoDeliv(){if(VTA.entrega!=='delivery'||!VTA.zonaId)return 0;
  const z=DB.cfg.zonas.find(x=>x.id===VTA.zonaId);return z?z.usd:0;}
/* el total de la FACTURA: no cambia al activarse el IVA, porque el precio
   ya lo traía adentro. Lo que cambia es qué parte de él es ingreso. */
function totalVenta(){return Math.round((totalArts()+montoDeliv())*100)/100;}
function desgVenta(){ return desglosaVenta(VTA.lineas, montoDeliv()); }
function igtfVenta(){ return igtfDe(VTA.cobros, totalVenta()); }
/* lo que de verdad hay que cobrar hoy, con el IGTF ya causado encima */
function totalCobrar(){ return r2(totalVenta() + igtfVenta()); }
/* si la clienta salda lo que falta con ESTA vía, ¿cuánto entrega? */
function exactoPara(k){
  const falta = r2(totalCobrar() - pagadoUSD());
  if(falta <= 0.005) return 0;
  if(!esDivisa(k) || !pctIGTF()) return falta;
  const fac  = Math.min(falta, saldoFactura(VTA.cobros, totalVenta()));
  const otro = r2(falta - fac);
  return r2(fac + r2(fac * pctIGTF()) + otro);
}
/* cuánto IGTF agregaría pagar lo que falta por esta vía */
function igtfSiPaga(k){ return r2(exactoPara(k) - r2(totalCobrar() - pagadoUSD())); }
function pagoRep(){const r=DB.cfg.repartidores.find(x=>x.id===VTA.repId);

function faltaUSD(){return Math.round((totalCobrar()-pagadoUSD())*100)/100;}

/* ==========================================================================
   SICOM · pantalla de inicio

   Lo primero que se ve al abrir. Ocupa la pantalla entera, sin barras ni
   pestañas, y se viste con el logo y los colores de la empresa: los mismos
   que salieron del logo cuando se cargó, así que otra empresa con otro logo
   ve su propia casa sin que nadie toque una línea.

   Cada módulo es un botón grande que dice qué hay dentro y, cuando hay algo

const DIASEM = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function fechaLarga(iso){
  const p = String(iso).split('-');
  const d = new Date(+p[0], +p[1]-1, +p[2], 12);
  return DIASEM[d.getDay()] + ' ' + (+p[2]) + ' de ' + MESNOM[(+p[1])-1] + ' de ' + p[0];
}

/* lo que cada módulo tiene que decir hoy, sin que haya que entrar a mirarlo */
function homeAviso(k){
  if(k === 'vta'){
    if(faltaTasaHoy()) return {t:'Falta la tasa de hoy', cl:'mal'};
    const n = ventasVal(hoy).length;
    return n ? {t:n + (n === 1 ? ' venta hoy' : ' ventas hoy'), cl:'ok'} : null;
  }
  if(k === 'tes'){
    const p = pendAbiertos();
    if(p.length) return {t:p.length + (p.length === 1 ? ' vuelto por entregar' : ' vueltos por entregar'), cl:'avi'};
    const s = saldoAcc();
    return s > 0.005 ? {t:'USD ' + fN(s) + ' al accionista', cl:''} : null;
  }
  if(k === 'trib'){
    const n = totalesLibro(filasLibroVentas(mesDe(hoy))).n;
    return n ? {t:n + (n === 1 ? ' documento en ' : ' documentos en ') + MESNOM[+mesDe(hoy).slice(5)-1], cl:''} : null;
  }
  if(k === 'conta'){
    const r = modelosRotos().length + modelosHuerfanos().length;
    if(r) return {t:r + (r === 1 ? ' modelo con problema' : ' modelos con problema'), cl:'mal'};
    const l = lineasPorAsignar();
    return l ? {t:l + (l === 1 ? ' línea por asignar' : ' líneas por asignar'), cl:'avi'} : null;
  }
  if(k === 'bd'){
    const n = DB.clientes.length;
    return n ? {t:n + (n === 1 ? ' cliente' : ' clientes'), cl:''} : null;
  }
  if(k === 'cfg'){
    const f = pasos().filter(p=>!p.ok).length;
    return f ? {t:f + (f === 1 ? ' cosa por configurar' : ' cosas por configurar'), cl:'avi'} : null;
  }
  if(k === 'ger'){
    return verificaCadena().ok ? {t:'Registro íntegro', cl:'ok'} : {t:'Revisar la auditoría', cl:'mal'};
  }
  return null;
}

/* El desglose de una venta ya registrada sale de lo que se guardó con ella.
   Las ventas anteriores al IVA no guardaron nada: se deriva con la alícuota
   de hoy y se marca como derivado, para no hacer pasar por hecho lo que es
   un cálculo posterior. */
function desgDe(v){
  if(v && v.fis && v.fis.base !== undefined)
    return {base:v.fis.base, iva:v.fis.iva, exento:v.fis.exento||0,
            total:r2(v.fis.base + v.fis.iva + (v.fis.exento||0)),
            alic:v.fis.alic, igtf:v.fis.igtf||0, igtfPct:v.fis.igtfPct||0, derivado:false};
  const d = desglosaVenta((v&&v.lineas)||[], (v&&v.deliv)||0);
  d.alic = fisc().alic; d.igtf = 0; d.igtfPct = 0; d.derivado = true;
  return d;
}

/* precarga automática del monto que falta, en la moneda del método elegido */
function precarga(cual){
  if(cual==='cobro'){
    /* lo que salda la venta POR ESTA VÍA: si causa IGTF, ya viene incluido */
    const f=Math.max(0,exactoPara(VTA.met));
    VTA.buf = f>0.005 ? f.toFixed(2).replace('.',',') : '';
  }else{
    const m=METODOS.find(x=>x.k===VTA.vmet);
    let r=Math.max(0,vueltoResta());
    if(m.k==='efec_usd') r=Math.min(r,Math.round((DB.fondoUSD-efUSDdado())*100)/100);
    VTA.vbuf = r>0.005 ? r.toFixed(2).replace('.',',') : '';
  }
}
/* convierte lo escrito en dólares al monto que se guarda según la moneda del método */
function montoEn(m,usd,t){ return m.mon==='BS' ? Math.round(usd*(t?t.bcv:0)*100)/100 : Math.round(usd*100)/100; }

  return (enBs?'el cliente entrega ':'equivale a ')+'Bs '+fN(v*t.bcv)+'  ·  tasa '+fN(t.bcv,2);}

function desglose(usd){let r=[],q=Math.floor(usd+0.001);
  DENOM.forEach(d=>{const n=Math.floor(q/d);if(n>0){r.push(n+' × $'+d);q-=n*d;}});
  const c=Math.round((usd-Math.floor(usd))*100); if(c>0)r.push(c+'¢ en menudo');
  return r.length?r:['—'];}

/* registrar */
function registrar(){
  if(trancaTasa('registrar la venta')) return;
  const t=tasaVigente(); let c=cliActual();
  if(c&&c.nuevo){
    const nc={id:'c'+(++DB.corr.cli),doc:c.doc,nom:c.nom.trim(),ape:c.ape.trim(),gen:c.gen,op:c.op,tel:c.tel,
              mail:c.mail.trim(),compras:0,monto:0,ultima:null,mkt:c.mkt};
    DB.clientes.push(nc); VTA.cli=nc; c=nc;
  }
  VTA.lineas.forEach(l=>{const p=DB.productos.find(x=>x.id===l.id); if(!p)return;
    if(l.talla&&p.tallas){const tt=p.tallas.find(x=>x.t===l.talla); if(tt)tt.e=Math.max(0,tt.e-l.cant);}
    else p.exi=Math.max(0,p.exi-l.cant);});
  const num='V-'+String(++DB.corr.venta).padStart(5,'0');
  c.compras=(c.compras||0)+1; c.monto=Math.round(((c.monto||0)+totalVenta())*100)/100; c.ultima=hoy;

  VTA.cobros.filter(x=>x.fuente==='accionista').forEach(x=>{
    const usd=x.mon==='BS'&&t?x.monto/t.bcv:x.monto;
    DB.accionista.push({fecha:hoy,tipo:'cobro',concepto:'Cobro venta '+num+' recibido en su cuenta',
      usd:-Math.round(usd*100)/100,ref:x.ref,venta:num,op:'acc_cob'});});
  VTA.vueltos.filter(x=>x.fuente==='accionista').forEach(x=>{
    const usd=x.mon==='BS'&&t?x.monto/t.bcv:x.monto;
    DB.accionista.push({fecha:hoy,tipo:'vuelto',concepto:'Vuelto venta '+num+' con fondos del accionista',
      usd:Math.round(usd*100)/100,ref:x.ref,venta:num,op:'acc_vue'});});

  const resta=vueltoResta();
  if(resta>0.005) DB.vpend.push({id:nid('vp'),tipo:'vuelto',venta:num,fecha:hoy,cliId:c.id,
    usd:resta,saldo:resta,entregas:[],cajera:DB.turno,op:'vue_pend'});

  DB.ventas.push({num,fecha:hoy,hora:horaAhora(),cliId:c.id,canal:VTA.canal,vendedorId:VTA.vendedorId==='sin'?null:VTA.vendedorId,
    repId:VTA.repId,entrega:VTA.entrega,deliv:montoDeliv(),cajera:DB.turno,total:totalVenta(),tasa:t?t.bcv:null,
    fis:(function(){ const d=desgVenta(); return {alic:fisc().alic, base:d.base, iva:d.iva, exento:d.exento,
      igtfPct:fisc().igtfPct, igtf:igtfVenta(), cobrado:totalCobrar()}; })(),
    lineas:VTA.lineas.map(l=>{const p=DB.productos.find(x=>x.id===l.id)||{};
      return {sku:l.sku,nom:l.nom,talla:l.talla,cant:l.cant,precio:l.precio,cat:p.cat||'',costo:p.costo||0};}),
    op:'vta',
    cobros:VTA.cobros.map(x=>Object.assign({},x,{op:'cob_'+x.met})),
    vueltos:VTA.vueltos.map(x=>Object.assign({},x,{op:'vue_'+x.met})),
    pend:resta>0.005?resta:0});
  VTA.hecha={num,fecha:hoy,tasa:t?t.bcv:null,pend:resta>0.005?resta:0,cajera:DB.turno,
             repId:VTA.repId,pagoRep:pagoRep()};
  /* el recibo sale con la misma acción: no hace falta un segundo clic */
  DB.correos.push({fecha:hoy,cli:nomComp(c),mail:c.mail,venta:num,
    arts:VTA.lineas.reduce((a,l)=>a+l.cant,0),tipo:'recibo',estado:'enviado'});
  VTA.correoEnviado=true;
  bitacora('caja','Venta registrada', num+' · '+nomComp(c)+' · USD '+fN(totalVenta())
    +' · '+VTA.canal+' · '+VTA.cobros.length+(VTA.cobros.length===1?' cobro':' cobros')
    +(resta>0.005?' · queda vuelto pendiente USD '+fN(resta):''));
  aviso('Venta '+num+' registrada · recibo enviado a '+c.mail);
  VTA.paso='correo'; pinta();
}

/* -------------------------------------------------------- TESORERÍA ------ */
function ventasDe(f){return DB.ventas.filter(v=>v.fecha===f);}
function movMet(f,k,mon){
  let e=0,sal=0;
  ventasVal(f).forEach(v=>{
    v.cobros.forEach(c=>{if(c.met===k)e+=c.monto;});
    v.vueltos.forEach(x=>{if(x.met===k)sal+=x.monto;});
  });
  DB.vpend.forEach(v=>v.entregas.forEach(x=>{if(x.met===k&&x.fecha===f)sal+=x.monto;}));
  return {ent:Math.round(e*100)/100, sal:Math.round(sal*100)/100, neto:Math.round((e-sal)*100)/100};
}
function esperadoCaja(f){
  const r={};
  METODOS.forEach(m=>{r[m.k]=movMet(f,m.k,m.mon);});
  r.efec_usd.esperado=Math.round((DB.fondoUSD+r.efec_usd.neto)*100)/100;
  r.efec_bs.esperado=r.efec_bs.neto;
  return r;
}
/* ==========================================================================
   1 · Sin la tasa del día no se registra nada
   Todo monto en bolívares se convierte con la tasa del día. Si no está
   cargada, el sistema tendría que usar la de ayer sin decirlo: la venta
   quedaría mal convertida, el cierre no cuadraría y el libro saldría con
   una cifra que nadie puede defender. Es más barato trancar la puerta.
   ========================================================================== */
function faltaTasaHoy(){ return !tasaDeHoyCargada(); }
function avisoSinTasa(que){
  const t = tasaVigente();
  return '<div class="card sintasa"><div class="sti">◷</div>'
    + '<div class="stx"><h2>Falta la tasa de hoy</h2>'
    + '<p>No se puede ' + esc(que) + ' sin la tasa del <b>' + fFecha(hoy) + '</b>. '
    + 'Todo lo que se cobra o se paga en bolívares se convierte con ella: si el sistema usara la de otro día, '
    + 'la cifra quedaría mal y nadie se enteraría hasta el cierre.</p>'
    + '<p class="mini">' + (t ? 'La última cargada es la del <b>' + fFecha(t.fecha) + '</b> · Bs ' + fN(t.bcv, 2)
                              : 'No hay ninguna tasa cargada todavía.') + '</p></div>'
    + '<button class="b oro" data-goto="cfg|tasas">Cargar la tasa de hoy</button></div>';
}
/* el mismo corte, para las acciones que no pasan por una pantalla */
function trancaTasa(que){
  if(!faltaTasaHoy()) return false;
  aviso('Cargue primero la tasa del ' + fFecha(hoy) + ': sin ella no se puede ' + que + '.', true);
  return true;
}

/* ==========================================================================
   3 · Una venta con vuelto pendiente no se devuelve: se anula completa
   Devolver parte de una venta cuyo vuelto todavía se le debe a la clienta
   deja dos deudas cruzadas sobre la misma operación y ninguna cuadra con la
   caja. O se le entrega el vuelto y entonces sí se devuelve, o se deshace
   la venta entera.
   ========================================================================== */
function vueltoPendDe(v){
  return r2(DB.vpend.filter(x=>x.venta === v.num && x.tipo !== 'devolucion'
      && !x.anulado && x.saldo > 0.005).reduce((a,x)=>a+x.saldo, 0));
}
function puedeDevolver(v){
  if(anulada(v)) return 'Esa venta está anulada.';
  const q = vueltoPendDe(v);
  if(q > 0.005) return 'Tiene un vuelto pendiente de USD ' + fN(q)
    + '. Entrégueselo primero en Tesorería, o anule la venta completa.';
  return '';
}

/* ----------------------------------------------------------- REPORTES ---- */
/* ==========================================================================
   SICOM · Reportes de ventas · resumen y estadísticas
   Rehecho: una cifra manda, las demás la acompañan, y todo responde a las
   cinco preguntas que un dueño de tienda se hace al abrir la pantalla.
   ========================================================================== */
let ESTPER = 'hoy';

const PERIODOS = [['hoy','Hoy'],['ayer','Ayer'],['7d','Últimos 7 días'],['mes','Este mes']];

function diaMenos(n){
  const d = new Date(hoy + 'T12:00:00'); d.setDate(d.getDate() - n);
  return isoLocal(d);
}
/* {desde, hasta, nom} del período elegido, y el comparable anterior */
function rangoDe(k){
  if(k === 'ayer'){ const a = diaMenos(1); return {d:a, h:a, n:'ayer', prev:{d:diaMenos(2), h:diaMenos(2), n:fFecha(diaMenos(2))}}; }
  if(k === '7d')  return {d:diaMenos(6), h:hoy, n:'los últimos 7 días',
                          prev:{d:diaMenos(13), h:diaMenos(7), n:'los 7 anteriores'}};
  if(k === 'mes'){ const p = hoy.slice(0,8) + '01';
    const ant = new Date(hoy + 'T12:00:00'); ant.setDate(1); ant.setMonth(ant.getMonth()-1);
    const pa = isoLocal(ant), ua = isoLocal(new Date(new Date(hoy+'T12:00:00').setDate(0)));
    return {d:p, h:hoy, n:'este mes', prev:{d:pa, h:ua, n:'el mes pasado'}}; }
  return {d:hoy, h:hoy, n:'hoy', prev:{d:diaMenos(1), h:diaMenos(1), n:fFecha(diaMenos(1))}};
}
function ventasRango(d, h){
  return DB.ventas.filter(v=>v.fecha >= d && v.fecha <= h && !anulada(v));
}
/* el costo de una línea: las ventas viejas no lo guardaron, sale del catálogo */
function costoLinea(l){
  if(l.costo > 0) return l.costo;
  const p = DB.productos.find(x=>x.sku === l.sku);
  return (p && p.costo) || 0;
}
function tieneCosto(l){ return costoLinea(l) > 0; }

/* el bloque de cifras de un rango */
function cifrasDe(d, h){
  const vs = ventasRango(d, h);
  let venta = 0, costo = 0, uds = 0, conCosto = 0;
  vs.forEach(v=>{
    venta += netoVenta(v);
    v.lineas.forEach(l=>{
      uds += l.cant;
      const c = costoLinea(l);
      if(c > 0){ costo += c * l.cant; conCosto += l.precio * l.cant; }
    });
  });
  const fug = DB.ventas.filter(x=>anulada(x) && x.anulada.fecha >= d && x.anulada.fecha <= h)
                .reduce((a,x)=>a+x.total, 0)
            + DB.ventas.reduce((a,x)=>a + devDe(x).filter(y=>y.fecha >= d && y.fecha <= h)
                .reduce((b,y)=>b+y.usd, 0), 0);
  return {n:vs.length, venta:r2(venta), costo:r2(costo), uds:uds,
          margen:r2(conCosto - costo), baseMargen:r2(conCosto),
          ticket:r2(vs.length ? venta / vs.length : 0), fugas:r2(fug), ventas:vs};
}

/* la píldora de variación. subeBueno dice si subir es bueno: en las fugas no */
function delta(act, ant, subeBueno, sufijo){
  if(!(ant > 0.005)) return '';
  const p = ((act - ant) / ant) * 100;
  if(Math.abs(p) < 1) return '<span class="dlt">= 0,0 %</span>';
  const bien = (p > 0) === (subeBueno !== false);
  return '<span class="dlt '+(bien?'ok':'mal')+'">'+(p>0?'▲':'▼')+' '+fN(Math.abs(p),1)+' %'
    +(sufijo||'')+'</span>';
}
function kpiCard(rot, cifra, uni, dlt, sub, dest){
  return '<div class="h'+(dest?' dest':'')+'"><span class="k">'+esc(rot)+'</span>'
    + '<div class="vrow"><span class="v">'+cifra+'</span>'
    + (uni?'<span class="u">'+esc(uni)+'</span>':'') + (dlt||'') + '</div>'
    + (sub?'<span class="s">'+sub+'</span>':'') + '</div>';
}

/* ------------------------------------------------- la cabecera de cifras -- */
function bandaKPI(R){
  const A = cifrasDe(R.d, R.h), B = cifrasDe(R.prev.d, R.prev.h);
  const t = tasaEn(R.h) || tasaVigente();
  const pct = A.baseMargen > 0.005 ? (A.margen / A.baseMargen) * 100 : null;
  const pctB = B.baseMargen > 0.005 ? (B.margen / B.baseMargen) * 100 : null;
  const dPts = (pct !== null && pctB !== null && Math.abs(pct - pctB) >= 0.1)
    ? '<span class="dlt '+(pct>=pctB?'ok':'mal')+'">'+(pct>=pctB?'▲':'▼')+' '
      + fN(Math.abs(pct-pctB),1)+' pts</span>' : '';

  return '<div class="hero">'
    + kpiCard('Vendido neto', fN(A.venta), 'USD', delta(A.venta, B.venta, true),
        (t ? 'Bs '+fN(A.venta*t.bcv, 0)+' · ' : '')
        + (B.venta > 0.005 ? 'vs '+fN(B.venta)+' '+esc(R.prev.n) : 'sin comparable'), true)
    + kpiCard('Margen bruto', pct === null ? '—' : fN(A.margen), pct === null ? '' : 'USD', dPts,
        pct === null ? 'ningún artículo tiene costo cargado'
          : fN(pct,1)+' % sobre lo que tiene costo')
    + kpiCard('Ticket promedio', fN(A.ticket), 'USD', delta(A.ticket, B.ticket, true),
        A.n + ' ' + (A.n===1?'venta':'ventas') + ' · ' + A.uds + ' ' + (A.uds===1?'unidad':'unidades'))
    + kpiCard('Fugas', fN(A.fugas), 'USD', delta(A.fugas, B.fugas, false),
        A.fugas < 0.005 ? 'sin anulaciones ni devoluciones' : 'anulado y devuelto en el período')
    + '</div>';
}

/* ------------------------------------------------------------ tendencia -- */
function bloqueTendencia(R){
  const dias = [];
  let f = R.d, guarda = 0;
  while(f <= R.h && guarda++ < 40){ dias.push(f);
    const x = new Date(f + 'T12:00:00'); x.setDate(x.getDate()+1); f = isoLocal(x); }
  const datos = dias.map(d=>({f:d, v:r2(ventasRango(d,d).reduce((a,x)=>a+netoVenta(x),0))}));
  const conVta = datos.filter(x=>x.v > 0.005);
  if(!conVta.length) return '';
  const max = Math.max.apply(null, datos.map(x=>x.v)) || 1;
  const prom = r2(datos.reduce((a,x)=>a+x.v,0) / datos.length);
  const unico = conVta.length === 1;

  let h = '<div class="card"><h2>Cómo viene el período</h2>'
    + '<div class="tend">'
    + (unico ? '' : '<div class="prom" style="bottom:'+(prom/max*100)+'%"><b>promedio '+fN(prom)+'</b></div>')
    + datos.map(x=>'<div class="d'+(x.f===hoy?' hoy':'')+'" title="'+fFecha(x.f)+' · USD '+fN(x.v)+'">'
        + '<i style="height:'+(x.v/max*100)+'%"></i></div>').join('')
    + '</div><div class="tendpie">'
    + datos.map(x=>'<span>'+x.f.slice(8)+'</span>').join('')+'</div>';
  if(unico) h += '<div class="nota">Un solo día con ventas en este período. '
    + 'La comparación aparece cuando haya un segundo día.</div>';
  return h + '</div>';
}

/* --------------------------------------------------- barras horizontales -- */
function bhLista(datos, opt){
  opt = opt || {};
  const max = opt.max || Math.max.apply(null, datos.map(x=>x[1])) || 1;
  const tot = datos.reduce((a,x)=>a+x[1], 0) || 1;
  const uni = opt.uni === undefined ? 'USD ' : opt.uni;
  const dec = opt.dec === undefined ? 2 : opt.dec;
  return datos.map((x,i)=>'<div class="bh s'+Math.min(i+1,6)+'">'
    + '<span class="l">'+esc(x[0])+'</span>'
    + '<span class="m">'+uni+fN(x[1],dec)+'<em>'+fN(x[1]/tot*100,1)+' %</em></span>'
    + '<span class="t"><i style="width:'+Math.max(2, x[1]/max*100)+'%"></i></span></div>').join('');
}
/* agrupa, ordena y deja «Otros» si hay cola larga */
function agrupaTop(pares, tope){
  const m = {};
  pares.forEach(p=>{ if(!p[0]) return; m[p[0]] = (m[p[0]]||0) + p[1]; });
  const ls = Object.keys(m).map(k=>[k, r2(m[k])]).sort((a,b)=>b[1]-a[1]);
  if(ls.length <= (tope||6)) return ls;
  const cab = ls.slice(0, (tope||6)-1);
  const col = ls.slice((tope||6)-1);
  cab.push(['Otros ('+col.length+')', r2(col.reduce((a,x)=>a+x[1],0))]);
  return cab;
}

function bloqueOrigen(R){
  const vs = ventasRango(R.d, R.h);
  if(!vs.length) return '';
  const canal = agrupaTop(vs.map(v=>[v.canal, netoVenta(v)]));
  const met = [];
  vs.forEach(v=>v.cobros.forEach(c=>{
    const t = tasaEn(v.fecha);
    const usd = c.mon === 'BS' && t ? c.monto / t.bcv : c.monto;
    const mm = METODOS.find(y=>y.k === c.met);
    met.push([mm ? mm.n : c.met, usd]);
  }));
  const igtf = r2(vs.reduce((a,v)=>a + ((v.fis||{}).igtf || 0), 0));
  const deliv = r2(vs.reduce((a,v)=>a + (v.deliv || 0), 0));

  return '<div class="card"><h2>De dónde vino el dinero</h2>'
    + '<div class="g2b">'
    + '<div><h3 class="grp">Canal de venta</h3>'+bhLista(canal)+'</div>'
    + '<div><h3 class="grp">Método de pago</h3>'+bhLista(agrupaTop(met))
      + '<div class="mini" style="margin-top:12px">'
      + (igtf > 0.005 ? 'IGTF percibido: <b>USD '+fN(igtf)+'</b>' : 'Sin IGTF en el período')
      + (deliv > 0.005 ? ' · Delivery facturado: <b>USD '+fN(deliv)+'</b>' : '')
      + '</div></div>'
    + '</div></div>';
}

function bloqueArticulos(R){
  const vs = ventasRango(R.d, R.h);
  const m = {};
  vs.forEach(v=>v.lineas.forEach(l=>{
    const k = l.sku || l.nom;
    if(!m[k]) m[k] = {nom:l.nom, cat:l.cat || '—', uds:0, venta:0, costo:0, sinCosto:false};
    const c = costoLinea(l);
    m[k].uds += l.cant; m[k].venta += l.precio * l.cant;
    if(c > 0) m[k].costo += c * l.cant; else m[k].sinCosto = true;
  }));
  const ls = Object.keys(m).map(k=>m[k]).sort((a,b)=>b.venta - a.venta);
  if(!ls.length) return '';
  return '<div class="card"><h2>Qué se vendió</h2>'
    + '<div class="tabwrap"><table class="dat cmp"><thead><tr>'
    + '<th class="rank">#</th><th>Artículo</th><th>Categoría</th>'
    + '<th class="n">Und</th><th class="n">Venta USD</th><th class="n">Costo USD</th>'
    + '<th class="n">Margen USD</th><th class="n">Margen</th></tr></thead><tbody>'
    + ls.map((x,i)=>{
        const mg = r2(x.venta - x.costo);
        const p = x.sinCosto || x.costo <= 0 ? null : (mg / x.venta) * 100;
        const cl = p === null ? '' : (p >= 40 ? '' : p >= 15 ? ' medio' : ' bajo');
        return '<tr><td class="rank">'+(i+1)+'</td><td><b>'+esc(x.nom)+'</b></td>'
          + '<td class="mini">'+esc(x.cat)+'</td>'
          + '<td class="n">'+x.uds+'</td><td class="n">'+fN(x.venta)+'</td>'
          + '<td class="n">'+(x.costo>0?fN(x.costo):'—')+'</td>'
          + '<td class="n">'+(p===null?'—':fN(mg))+'</td>'
          + '<td class="n">'+(p===null
              ? '<span class="mini">sin costo</span>'
              : '<span class="mgb"><span class="mt"><i class="'+cl.trim()+'" style="width:'
                + Math.max(2, Math.min(100, p))+'%"></i></span>'+fN(p,1)+' %</span>')
          + '</td></tr>'; }).join('')
    + '</tbody></table></div></div>';
}

function bloqueVendedoras(R){
  const vs = ventasRango(R.d, R.h);
  const m = {};
  vs.forEach(v=>{
    const k = v.vendedorId ? vendNom(v.vendedorId) : 'Autoservicio';
    if(!m[k]) m[k] = {n:0, usd:0};
    m[k].n++; m[k].usd += netoVenta(v);
  });
  const ls = Object.keys(m).map(k=>[k, m[k]]).sort((a,b)=>b[1].usd - a[1].usd);
  if(!ls.length) return '';
  const tot = ls.reduce((a,x)=>a+x[1].usd, 0) || 1;
  return '<div class="card"><h2>Quién vendió</h2><table class="dat"><thead><tr>'
    + '<th>Vendedora</th><th class="n">Ventas</th><th class="n">USD</th>'
    + '<th class="n">Ticket</th><th class="n">% del total</th></tr></thead><tbody>'
    + ls.map(x=>'<tr><td><b>'+esc(x[0])+'</b></td><td class="n">'+x[1].n+'</td>'
        + '<td class="n">'+fN(r2(x[1].usd))+'</td>'
        + '<td class="n">'+fN(r2(x[1].usd / x[1].n))+'</td>'
        + '<td class="n">'+fN(x[1].usd / tot * 100, 1)+' %</td></tr>').join('')
    + '</tbody></table></div>';
}

function bloqueComparativo(){
  const fechas = Array.from(new Set(DB.ventas.map(v=>v.fecha))).sort().reverse().slice(0, 30);
  if(!fechas.length) return '';
  let ant = null;
  return '<div class="card"><h2>Día por día</h2><div class="tabwrap"><table class="dat"><thead><tr>'
    + '<th>Día</th><th class="n">Ventas</th><th class="n">Total USD</th>'
    + '<th class="n">Ticket</th><th class="n">Margen</th><th class="n">Δ vs día anterior</th>'
    + '</tr></thead><tbody>'
    + fechas.map(f=>{
        const c = cifrasDe(f, f);
        const p = c.baseMargen > 0.005 ? (c.margen / c.baseMargen) * 100 : null;
        const prev = fechas[fechas.indexOf(f) + 1];
        const cp = prev ? cifrasDe(prev, prev) : null;
        const d = cp && cp.venta > 0.005 ? delta(c.venta, cp.venta, true) : '';
        return '<tr><td><b>'+fFecha(f)+'</b>'+(f===hoy?' <span class="chip ok">hoy</span>':'')+'</td>'
          + '<td class="n">'+c.n+'</td><td class="n"><b>'+fN(c.venta)+'</b></td>'
          + '<td class="n">'+fN(c.ticket)+'</td>'
          + '<td class="n">'+(p===null?'—':fN(p,1)+' %')+'</td>'
          + '<td class="n">'+(d||'—')+'</td></tr>'; }).join('')
    + '</tbody></table></div></div>';
}

function vacioVentas(R){
  if(!DB.ventas.length)
    return '<div class="card enobra"><div class="obra-ic">📈</div>'
      + '<h2>Aquí verá cuánto vendió, cuánto ganó y de dónde vino el dinero</h2>'

function repEst(){
  const R = rangoDe(ESTPER);
  let h = selPeriodo() + bandaKPI(R);
  if(!ventasRango(R.d, R.h).length) return h + vacioVentas(R);
  h += bloqueTendencia(R) + bloqueOrigen(R) + bloqueArticulos(R)
     + bloqueVendedoras(R) + bloqueComparativo();
  return h;
}

function repDia(){
  const R = rangoDe('hoy');
  let h = bandaKPI(R);
  if(!ventasRango(R.d, R.h).length) return h + vacioVentas(R);
  h += bloqueOrigen(R) + bloqueArticulos(R) + bloqueVendedoras(R);
  return h;
}

/* ==========================================================================
   SICOM · TRIBUTOS · Ingresos brutos e impuesto de actividades económicas
   El municipio no cobra sobre la utilidad: cobra sobre el ingreso bruto
   efectivamente percibido. El IVA no es ingreso —es del fisco nacional— y
   por eso no entra en la base. Las devoluciones y las anulaciones sí restan,
   cada una en el mes en que ocurrieron.
   ========================================================================== */
function iaeActivo(){ return fisc().iaeActivo !== false; }
function iaeAlic(){ const n = +fisc().iaeAlic; return iaeActivo() && isFinite(n) && n > 0 ? n : 0; }
function iaeMinTrib(){ const n = +fisc().iaeMin; return isFinite(n) && n > 0 ? n : 0; }

function ibMes(m){
  const t = totalesLibro(filasLibroVentas(m));
  const bruto = r2(t.base + t.exento);
  const causado = r2(bruto * iaeAlic() / 100);
  return {mes:m, n:t.n, facturado:t.total, iva:t.iva, bruto:bruto,
          causado:causado, pagar:Math.max(causado, iaeMinTrib())};
}

let LVMES = null;   /* 'AAAA-MM'; null = el mes en curso */

function mesDe(f){ return String(f||'').slice(0,7); }
function mesActual(){ return LVMES || mesDe(hoy); }
function mesesConVentas(){
  const m = Array.from(new Set(DB.ventas.map(v=>mesDe(v.fecha)))).sort().reverse();
  const h = mesDe(hoy); if(!m.includes(h)) m.unshift(h);
  return m;
}
const MESNOM = ['enero','febrero','marzo','abril','mayo','junio','julio',
                'agosto','septiembre','octubre','noviembre','diciembre'];
function mesTexto(m){
  const p = String(m).split('-');
  return MESNOM[(+p[1])-1] + ' de ' + p[0];
}

/* El RIF del comprador. Casi toda la clientela es persona natural: su RIF es
   la letra más la cédula. Si el cliente es una empresa, se toma su RIF tal
   como esté cargado. */
function rifCliente(c){
  if(!c) return '—';
  if(c.rif) return c.rif;
  const d = String(c.doc||'').replace(/\D/g,'');
  return d ? (c.tipoDoc || 'V') + '-' + d : '—';
}

/* una fila del libro por cada venta del mes, anuladas incluidas en cero */
/* ==========================================================================
   SICOM · Libro de ventas del SENIAT · versión corregida

   Tres cosas que estaban mal y por qué importan:

   1. Una devolución hecha en agosto rebajaba el libro de JULIO. Julio ya se
      declaró. Un libro fiscal de un período cerrado no se puede mover.
   2. La devolución se prorrateaba entre lo gravado y lo exento por igual, sin
      mirar qué artículo regresó. Devolver un artículo exento bajaba un débito
      fiscal que sí se causó.
   3. Redondear base, IVA y total por separado sobre una fracción hacía que la
      fila no sumara: 15,52 + 2,49 = 18,01 contra un total de 18,00.

   La corrección es la misma para las tres: la venta se asienta ENTERA en su
   mes, y cada devolución y cada anulación es un ajuste aparte —una nota de
   crédito— en el mes en que ocurrió, calculado sobre las líneas que de verdad
   regresaron. Nunca se prorratea nada.
   ========================================================================== */

/* el desglose de un juego de líneas devueltas, respetando la condición
   de cada artículo tal como estaba al venderse */
function desgLineasDev(v, ls){
  let base = 0, iva = 0, exe = 0;
  (ls||[]).forEach(l=>{
    const orig = (v.lineas||[])[l.i] || {};
    const m = r2(l.precio * l.cant);
    if(orig.exento === true || !alicIVA()){ exe += m; }
    else { const b = baseDe(m); base += b; iva += r2(m - b); }
  });
  return {base:r2(base), iva:r2(iva), exento:r2(exe)};
}
/* lo que queda vivo de una venta: lo vendido menos lo ya devuelto */
function desgVivo(v){
  const d = desgDe(v);
  let base = d.base, iva = d.iva, exe = d.exento || 0;
  devDe(v).forEach(x=>{
    const q = desgLineasDev(v, x.lineas);
    base = r2(base - q.base); iva = r2(iva - q.iva); exe = r2(exe - q.exento);
  });
  return {base:base, iva:iva, exento:exe};
}

function filaLibro(o){
  return {num:o.num, fecha:o.fecha, tipo:o.tipo, ref:o.ref || '',
          cli:o.cli, rif:o.rif, alic:o.alic,
          base:o.base, iva:o.iva, exento:o.exento,
          total:r2(o.base + o.iva + o.exento),
          derivado:!!o.derivado};
}

function filasLibroVentas(m){
  const fs = [];
  DB.ventas.forEach(v=>{
    const c = DB.clientes.find(x=>x.id === v.cliId) || null;
    const cli = c ? nomComp(c) : '—', rif = rifCliente(c);
    const d = desgDe(v);
    const anu = v.anulada || null;
    const anuMismoMes = anu && mesDe(anu.fecha) === mesDe(v.fecha);

    /* 1 · la factura, entera, en el mes en que se emitió */
    if(mesDe(v.fecha) === m){
      /* anulada dentro del mismo período: va en cero, conservando el número */
      const z = anuMismoMes;
      fs.push(filaLibro({num:v.num, fecha:v.fecha, tipo: z ? 'anulada' : 'factura',
        cli:cli, rif:rif, alic:d.alic, derivado:d.derivado,
        base: z ? 0 : d.base, iva: z ? 0 : d.iva, exento: z ? 0 : (d.exento||0)}));
    }

    /* 2 · cada devolución, como nota de crédito, en SU mes */
    devDe(v).forEach((x, k)=>{
      if(mesDe(x.fecha) !== m) return;
      const q = desgLineasDev(v, x.lineas);
      if(q.base + q.iva + q.exento < 0.005) return;
      fs.push(filaLibro({num:'NC-' + v.num + '-' + (k+1), fecha:x.fecha, tipo:'devolucion',
        ref:v.num, cli:cli, rif:rif, alic:d.alic, derivado:d.derivado,
        base:r2(-q.base), iva:r2(-q.iva), exento:r2(-q.exento)}));
    });

    /* 3 · la anulación de un mes anterior, como nota de crédito, en su mes */
    if(anu && !anuMismoMes && mesDe(anu.fecha) === m){
      const q = desgVivo(v);
      if(Math.abs(q.base) + Math.abs(q.iva) + Math.abs(q.exento) >= 0.005)
        fs.push(filaLibro({num:'NC-' + v.num + '-A', fecha:anu.fecha, tipo:'anulacion',
          ref:v.num, cli:cli, rif:rif, alic:d.alic, derivado:d.derivado,
          base:r2(-q.base), iva:r2(-q.iva), exento:r2(-q.exento)}));
    }
  });
  return fs.sort((a,b)=> a.fecha === b.fecha
    ? String(a.num).localeCompare(String(b.num)) : a.fecha.localeCompare(b.fecha));
}

function totalesLibro(fs){
  const s = k => r2((fs||[]).reduce((a,x)=>a+x[k], 0));
  return {total:s('total'), exento:s('exento'), base:s('base'), iva:s('iva'), n:(fs||[]).length};
}

function mesesConMovimiento(){
  const m = new Set();
  DB.ventas.forEach(v=>{
    m.add(mesDe(v.fecha));
    if(v.anulada) m.add(mesDe(v.anulada.fecha));
    devDe(v).forEach(x=>m.add(mesDe(x.fecha)));
  });
  m.add(mesDe(hoy));
  return Array.from(m).sort().reverse();
}

function parseMasivo(txt){
  const filas=[],vistos={};
  txt.split(/\r?\n/).forEach((ln,i)=>{
    const raw=ln.trim(); if(!raw)return;
    const p=raw.split(/[\s;\t]+/).filter(Boolean),r={n:i+1,raw:raw};
    if(p.length<2){r.mal='Faltan datos';filas.push(r);return;}
    let f=p[0],iso=null,m=f.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
    if(m)iso=m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
    else if(/^\d{4}-\d{2}-\d{2}$/.test(f))iso=f;
    if(!iso){r.mal='Fecha no reconocida: «'+f+'»';filas.push(r);return;}
    r.fecha=iso; const bcv=num(p[1]);
    if(!isFinite(bcv)||bcv<=0){r.mal='Tasa inválida: «'+p[1]+'»';filas.push(r);return;}
    if(bcv<1||bcv>100000){r.mal='Fuera de rango ('+fN(bcv,2)+')';filas.push(r);return;}
    r.bcv=bcv; if(p[2]){const pa=num(p[2]);if(isFinite(pa)&&pa>0)r.par=pa;}
    if(iso>hoy){r.mal='Fecha futura';filas.push(r);return;}
    if(vistos[iso]){r.mal='Repetida (línea '+vistos[iso]+')';filas.push(r);return;}
    vistos[iso]=i+1;
    const ya=DB.tasas.find(t=>t.fecha===iso);
    r.tipo=ya?(ya.bcv===bcv?'igual':'actualiza'):'nueva'; if(ya)r.antes=ya.bcv;
    filas.push(r);});
  return filas;
}

    + '<button class="b oro" id="pc_csv">Descargar completo</button></div>';
  h += '<div class="kpis kpis-mod">'
    + kpiMod(nM, 'Tipos', '')
    + kpiMod(nT, 'Rubros', '')
    + kpiMod(nD, 'Sub-rubros', '')
    + kpiMod(nC, 'Cuentas', '')
    + kpiMod(ctasMov().length, 'Reciben movimiento', '')
    + '</div>';

  cs.filter(c=>nivelCta(c.c)===1).forEach(g=>{
    h += '<h3 class="grp">'+esc(g.c)+' · '+esc(g.n)+'</h3>'
      + '<table class="dat plan arbol"><tbody>';
    cs.filter(c=>c.c !== g.c && String(c.c).charAt(0) === String(g.c).charAt(0)).forEach(c=>{
      const nv = nivelCta(c.c), us = usosDeCta(c.c);
      h += '<tr class="n'+nv+'"><td style="width:130px"><b class="codn">'+esc(c.c)+'</b></td>'
        + '<td><span class="cnom">'+esc(c.n)+'</span>'
        + (hijasDe(c.c).length
            ? '<span class="mini"> · '+hijasDe(c.c).length+' '
              +(hijasDe(c.c).length===1?'cuenta':'cuentas')+'</span>' : '')
        + '</td>'
        + '<td style="width:110px"><span class="chip'+(esMov(c.c)?' ok':'')+'">'+esc(nivelNom(c.c))+'</span></td>'
        + '<td class="mini" style="width:200px">'+(us.length ? esc(us.join(' · ')) : '')+'</td></tr>';
    });
    h += '</tbody></table>';
  });
  if(!cs.length) h += '<div class="vacio"><div class="vi">⌕</div>El plan está vacío.</div>';
  return h + '</div>';
}

/* ==========================================================================
   SICOM · CONTABILIDAD · asistente para abrir una cuenta

   Nadie tiene por qué saberse la codificación de memoria. Se pregunta en el
   orden en que la persona piensa —qué tipo de cuenta, en qué rubro, dentro
   de cuál sub-rubro, y cómo se llama— y el código sale solo. Cada respuesta
   filtra la siguiente: por eso el camino se va estrechando en vez de abrirse.
   ========================================================================== */

function norm(s){
  return String(s || '').toLowerCase().normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
}

/* Lo que suele hacer falta en una boutique. Son sugerencias: aparecen en la
   lista, pero la cuenta no nace hasta que se usa. Un plan lleno de cuentas
   vacías es peor que un plan corto. */
const SUGER = {
  '1':[
    {r:'Efectivo y equivalentes de efectivo', s:['Caja chica','Bancos · cuentas en divisas','Efectivo en tránsito']},
    {r:'Cuentas por cobrar', s:['Clientes','Empleados','Otras cuentas por cobrar']},
    {r:'Inventarios', s:['Mercancía en tránsito','Mercancía en consignación','Empaques y material de tienda']},
    {r:'Propiedad, planta y equipo', s:['Mobiliario y equipo de tienda','Vehículos','Equipos de computación','Maquinaria y equipos','Mejoras al local arrendado','Depreciación acumulada']},
    {r:'Gastos pagados por anticipado', s:['Seguros pagados por anticipado','Alquileres pagados por anticipado']},
    {r:'Otros activos', s:['Depósitos en garantía']}
  ],
  '2':[
    {r:'Cuentas por pagar comerciales', s:['Proveedores nacionales','Proveedores del exterior']},
    {r:'Deudas con el personal', s:['Sueldos por pagar','Prestaciones sociales','Vacaciones por pagar','Utilidades por pagar']},
    {r:'Impuestos por pagar', s:['Retenciones de IVA por enterar','Retenciones de ISLR por enterar']},
    {r:'Obligaciones financieras', s:['Préstamos bancarios','Intereses por pagar']},
    {r:'Otras cuentas por pagar', s:['Servicios por pagar','Anticipos recibidos de clientes']}
  ],
  '3':[
    {r:'Capital', s:['Aportes pendientes de capitalizar']},
    {r:'Resultados', s:['Reserva legal']}
  ],
  '4':[
    {r:'Ingresos operacionales', s:['Ventas al mayor','Ventas por redes sociales']},
    {r:'Contra-ingresos', s:['Descuentos concedidos']},
    {r:'Otros ingresos', s:['Diferencia en cambio','Ingresos financieros','Venta de activos']}
  ],
  '5':[
    {r:'Costo de ventas', s:['Fletes sobre compras','Costos de importación','Merma de inventario']}
  ],
  '6':[
    {r:'Gastos de personal', s:['Bono de alimentación','Aportes patronales','Bonificaciones']},
    {r:'Gastos de local', s:['Alquiler del local','Condominio','Electricidad','Agua','Internet y telefonía','Mantenimiento y limpieza','Vigilancia']},
    {r:'Gastos operativos', s:['Publicidad y redes sociales','Empaques y bolsas','Papelería','Fletes y encomiendas','Honorarios profesionales']},
    {r:'Gastos tributarios', s:['Tasas y timbres municipales','Impuestos varios']},
    {r:'Depreciación y amortización', s:['Amortización de mejoras']},
    {r:'Gastos financieros', s:['Intereses bancarios','Diferencia en cambio']}
  ]
};

const TIPO_AYUDA = {
  '1':'Lo que la empresa tiene: dinero, mercancía, mobiliario, lo que le deben.',
  '2':'Lo que la empresa debe: proveedores, personal, impuestos, préstamos.',
  '3':'Lo que es de los dueños: el capital y los resultados acumulados.',
  '4':'Lo que la empresa gana: ventas, delivery, otros ingresos.',
  '5':'Lo que costó la mercancía que se vendió.',
  '6':'Lo que se gasta para operar: personal, local, publicidad, impuestos.'
};

/* rubros que ya existen bajo un tipo */
function rubrosDe(t){ return hijasDe(t).sort((a,b)=>cmpCod(a.c,b.c)); }
/* Una sugerencia ya está cubierta si existe una cuenta con ese mismo nombre,
   o con un nombre que sea el comienzo del sugerido: «Depreciación» cubre a
   «Depreciación y amortización», y ofrecer las dos invita a duplicar. Se pide
   que el nombre existente tenga cierto cuerpo, para que «Ventas» no se trague
   a «Ventas al mayor». */
function cubierta(sug, nombresYa){
  const n = norm(sug);
  return nombresYa.some(y => y === n || (y.length >= 8 && n.indexOf(y + ' ') === 0));
}
/* sugerencias de rubro que todavía no existen */
function sugRubros(t){
  const ya = rubrosDe(t).map(x=>norm(x.n));
  return (SUGER[t] || []).map(x=>x.r).filter(r=>!cubierta(r, ya));
}
/* sugerencias de sub-rubro para un rubro, se llame como se llame */
function sugSubs(t, rubroNom, rubroCod){
  const e = (SUGER[t] || []).find(x=>norm(x.r) === norm(rubroNom));
  if(!e) return [];
  const ya = (rubroCod ? hijasDe(rubroCod) : []).map(x=>norm(x.n));
  return e.s.filter(x=>!cubierta(x, ya));
}

let CTW = null;
function nuevoCTW(){
  CTW = {tipo:'', rubroC:'', rubroN:'', rubroLibre:false,
         subC:'', subN:'', subLibre:false, subNinguno:false, nom:''};
}
function ctwRubroNom(){
  if(CTW.rubroC){ const r = ctaObj(CTW.rubroC); return r ? r.n : ''; }
  return CTW.rubroN;
}
function ctwSubNom(){
  if(CTW.subC){ const s = ctaObj(CTW.subC); return s ? s.n : ''; }
  return CTW.subN;
}
function ctwTieneRubro(){ return !!(CTW.rubroC || CTW.rubroN.trim()); }
function ctwTieneSub(){ return CTW.subNinguno || !!(CTW.subC || CTW.subN.trim()); }

/* La cadena completa que va a quedar en el plan, con el código de cada
   escalón ya resuelto. Lo que no existe se marca como nuevo: así el resumen
   puede decir exactamente cuántas cuentas se van a crear. */
function ctwPlan(){
  const P = [];
  if(!CTW.tipo) return P;
  const t = ctaObj(CTW.tipo);
  P.push({cod:CTW.tipo, nom:t ? t.n : (TIPO_GRUPO[CTW.tipo] || '').toUpperCase(), nueva:!t});
  let padre = CTW.tipo;

  if(CTW.rubroC && ctaObj(CTW.rubroC)){
    P.push({cod:CTW.rubroC, nom:ctaObj(CTW.rubroC).n, nueva:false}); padre = CTW.rubroC;
  } else if(CTW.rubroN.trim()){
    const cod = proxCodigo(padre); if(!cod) return P;
    P.push({cod:cod, nom:CTW.rubroN.trim(), nueva:true}); padre = cod;
  } else return P;

  if(CTW.subC && ctaObj(CTW.subC)){
    P.push({cod:CTW.subC, nom:ctaObj(CTW.subC).n, nueva:false}); padre = CTW.subC;
  } else if(CTW.subN.trim()){
    const cod = proxCodigo(padre); if(!cod) return P;
    P.push({cod:cod, nom:CTW.subN.trim(), nueva:true}); padre = cod;
  }

  if(CTW.nom.trim()){
    const cod = proxCodigo(padre);
    if(cod) P.push({cod:cod, nom:CTW.nom.trim(), nueva:true});
  }
  return P;
}
/* la cuenta que va a recibir movimiento: la última de la cadena */
function ctwFinal(){ const P = ctwPlan(); return P.length ? P[P.length-1] : null; }
function ctwListo(){
  const f = ctwFinal();
  return !!(f && f.nueva && String(f.nom).trim().length >= 3);
}

function asistenteCuenta(){

  h += ctwPaso(1, 'Tipo de cuenta', !!CTW.tipo,
    CTW.tipo ? CTW.tipo + ' · ' + (ctaObj(CTW.tipo) || {n:''}).n : '', 'tipo',
    '<div class="wtipos">' + ['1','2','3','4','5','6'].map(k=>{

  if(CTW.tipo){
    const ex = rubrosDe(CTW.tipo), sug = sugRubros(CTW.tipo);
    let cuerpo = '<p class="wcap">Es la gran división dentro de '
      + esc((ctaObj(CTW.tipo) || {n:''}).n) + '.</p><div class="wops">'
      + ex.map(r=>ctwOpcion('data-ctwrub', r.c, r.n, r.c, false)).join('')
      + sug.map(r=>ctwOpcion('data-ctwrubn', r, r, '', true)).join('')
      + '<button class="wop otro" data-ctwrubo="1"><span class="wcod nv">+</span>'
      + '<span class="wnom">Escribir otro rubro</span></button></div>';

        + '<input id="ctw_rn" value="'+esc(CTW.rubroN)+'" maxlength="60" '
        + 'placeholder="Por ejemplo: Propiedad, planta y equipo"></div></div>';

      (CTW.rubroC ? CTW.rubroC + ' · ' : '') + ctwRubroNom(), 'rubro', cuerpo);
  }

  /* 3 · sub-rubro --------------------------------------------------------- */
  if(ctwTieneRubro() && !CTW.rubroLibre){
    const ex = CTW.rubroC ? hijasDe(CTW.rubroC).sort((a,b)=>cmpCod(a.c,b.c)) : [];
    const sug = sugSubs(CTW.tipo, ctwRubroNom(), CTW.rubroC);
    let cuerpo = '<p class="wcap">La división de adentro. Si el rubro no se divide, siga sin elegir ninguno.</p>'
      + '<div class="wops">'
      + ex.map(s=>ctwOpcion('data-ctwsub', s.c, s.n, s.c, false)).join('')
      + sug.map(s=>ctwOpcion('data-ctwsubn', s, s, '', true)).join('')
      + '<button class="wop otro" data-ctwsubo="1"><span class="wcod nv">+</span>'
      + '<span class="wnom">Escribir otro sub-rubro</span></button>'
      + '<button class="wop otro" data-ctwsubx="1"><span class="wcod nv">—</span>'
      + '<span class="wnom">Ninguno · la cuenta cuelga del rubro</span></button></div>';
    if(CTW.subLibre)
      cuerpo += '<div class="fila" style="margin-top:14px">'
        + '<div style="flex:2 1 320px"><label class="f">Nombre del sub-rubro</label>'
        + '<input id="ctw_sn" value="'+esc(CTW.subN)+'" maxlength="60" '
        + 'placeholder="Por ejemplo: Vehículos"></div></div>';
    h += ctwPaso(3, 'Sub-rubro', ctwTieneSub() && !CTW.subLibre,
      CTW.subNinguno ? 'ninguno' : (CTW.subC ? CTW.subC + ' · ' : '') + ctwSubNom(),
      'sub', cuerpo);
  }

  /* 4 · descripción ------------------------------------------------------- */
  if(ctwTieneRubro() && !CTW.rubroLibre && ctwTieneSub() && !CTW.subLibre){
    const padre = CTW.subC || (CTW.subN.trim() ? '·nuevo·' : CTW.rubroC || '·nuevo·');
    const tope = padre !== '·nuevo·' && nivelCta(padre) >= NIVEL_MAX;
    let cuerpo = '';
    if(tope){
      cuerpo = '<div class="nota rj" style="margin:0">La cuenta <b class="codn">'+esc(padre)
        + '</b> ya está en el último escalón: no se le puede colgar nada debajo. '
        + 'Elija otro sub-rubro, o cree la cuenta como sub-rubro del rubro.</div>';
    } else {
      cuerpo = '<p class="wcap">Cómo se llama la cuenta que va a recibir los movimientos.'
        + (ctwListo() ? ' Puede dejarlo en blanco: entonces se crea solo el sub-rubro, '
            + 'y es él quien recibe los movimientos.' : '')+'</p>'
        + '<div class="fila"><div style="flex:2 1 340px">'
        + '<input id="ctw_nom" value="'+esc(CTW.nom)+'" maxlength="60" '
        + 'placeholder="Por ejemplo: Toyota Corolla"></div></div>';
    }
    h += ctwPaso(4, 'Descripción' + (ctwListo() ? ' · opcional' : ''), false, '', 'nom', cuerpo);
  }

  h += '</div>';

  /* resumen --------------------------------------------------------------- */
  if(P.length > 1){
    const nuevas = P.filter(x=>x.nueva);
    h += '<div class="wres"><div class="wrt">Así va a quedar</div><div class="wrbol">'
      + P.map((x,i)=>'<div class="wrl n'+nivelCta(x.cod)+(x.nueva ? ' nv' : '')+'">'
          + '<b class="codn">'+esc(x.cod)+'</b>'
          + '<span>'+esc(x.nom)+'</span>'
          + '<em>'+esc(NIVEL_NOM[nivelCta(x.cod)] || '')
          + (i === P.length-1 && x.nueva ? ' · recibe movimiento' : '')+'</em>'
          + (x.nueva ? '<span class="chip avi">nueva</span>' : '<span class="chip ok">ya existe</span>')
          + '</div>').join('')
      + '</div>';
    if(nuevas.length > 1)
      h += '<div class="nota">Se van a crear <b>'+nuevas.length+' cuentas</b>: '
        + nuevas.map(x=>esc(x.cod)).join(' · ')
        + '. Las de arriba hacen falta para que la última cuelgue de algún lado.</div>';
    const et = (NIVEL_NOM[nivelCta(fin.cod)] || 'cuenta').toLowerCase();
    h += '<div class="acc">'
      + '<button class="b oro" id="ctw_crear"'+(ctwListo() ? '' : ' disabled')+'>'
      + (ctwListo()
          ? 'Crear ' + (et === 'cuenta' ? 'la cuenta ' : 'el ' + et + ' ') + esc(fin.cod)
          : 'Escriba cómo se llama')+'</button>'
      + '</div></div>';
  }
  return h + '</div>';
}

function csvPlanCuentas(){
  const q = s => '"' + String(s==null?'':s).replace(/"/g,'""') + '"';
  const L = [[q(DB.empresa.nom)].join(';'), [q('RIF ' + DB.empresa.rif)].join(';'),
             [q('PLAN DE CUENTAS · tipo, rubro, sub-rubro y cuenta')].join(';'),
             [q('Emitido el ' + fFecha(hoy))].join(';'), '',
             ['Código','Nivel','Escalón','Cuenta','Tipo','Tipo de cuenta','Rubro','Sub-rubro',
              'Recibe movimiento','Se usa en'].map(q).join(';')];
  ctasOrden().forEach(c=>{
    const seg = String(c.c).split('.');
    const m = ctaObj(seg[0]);
    const t = seg.length > 1 ? ctaObj(seg.slice(0,2).join('.')) : null;
    const u = seg.length > 2 ? ctaObj(seg.slice(0,3).join('.')) : null;
    L.push([q(c.c), q(nivelCta(c.c)), q(nivelNom(c.c)), q(c.n), q(c.t),
            q(m ? m.c + ' · ' + m.n : ''), q(t ? t.c + ' · ' + t.n : ''),
            q(u ? u.c + ' · ' + u.n : ''),
            q(esMov(c.c) ? 'Sí' : 'No'), q(usosDeCta(c.c).join(' · '))].join(';'));
  });
  L.push('');
  L.push([q('Cuentas'), q(ctasOrden().length)].join(';'));
  L.push([q('Que reciben movimiento'), q(ctasMov().length)].join(';'));
  return '﻿' + L.join('\r\n');
}

  o += '<optgroup label="Depende de la operación">'
    + ds.map(k=>'<option value="'+k+'"'+(val===k?' selected':'')+'>'+esc(CTAS_DIN[k])+'</option>').join('')
    + '</optgroup>';
  const tipos = ['Activo','Pasivo','Patrimonio','Ingreso','Costo','Gasto'];
  tipos.forEach(t=>{
    const cs = ctasMov().filter(c=>c.t===t).sort((a,b)=>cmpCod(a.c,b.c));
    if(!cs.length) return;
    o += '<optgroup label="'+t+'">'
      + cs.map(c=>'<option value="'+esc(c.c)+'"'+(val===c.c?' selected':'')+'>'+esc(c.c+' · '+c.n)+'</option>').join('')
      + '</optgroup>';
  });
  if(val && !esCtaDin(val) && !ctaNom(val))
    o = '<option value="'+esc(val)+'" selected>⚠ '+esc(val)+' · ya no está en el catálogo</option>' + o;
  return '<select class="selcta" id="'+id+'" data-ctasel="1">'+o+'</select>';
}
